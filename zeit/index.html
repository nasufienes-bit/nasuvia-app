<!doctype html>
<html lang="de-CH">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex, nofollow, noai, noimageai">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="icon" type="image/png" href="../favicon.png" />
<title>Zeiterfassung</title>
<meta name="theme-color" content="#F4FAF6" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Zeiterfassung" />
<link rel="apple-touch-icon" href="../icon-180.png" />
<link rel="stylesheet" href="../schrift.css" />
<script src="../konfig.js"></script>
<script src="../lib/supabase.js"></script>
<style>
:root{--papier:#F4FAF6;--flaeche:#E8F4EE;--karte:#fff;--tinte:#0A1F17;--text:#3F5A4F;--leise:#7C8499;--blau:#0B3B2E;--elektrik:#0E7A55;--gruen:#0E9F6E;--rot:#E5484D;--linie:color-mix(in srgb,var(--blau,#0B3B2E) 14%,transparent);--schatten:0 1px 2px rgba(12,18,38,.04),0 14px 34px -22px color-mix(in srgb,var(--blau,#0B3B2E) 40%,transparent);--display:'League Spartan',-apple-system,system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;--unten:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.5 var(--display);background:var(--papier);color:var(--tinte);min-height:100vh;padding-bottom:calc(80px + var(--unten))}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer}
.kopfzeile{position:sticky;top:0;z-index:20;background:rgba(247,249,253,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
.kopfzeile .wrap{display:flex;align-items:center;gap:12px;height:62px}
.kopfzeile .nv-knopf{margin-right:4px}
.marke{display:flex;align-items:center;gap:8px;font-weight:700;font-size:19px;letter-spacing:-.02em;white-space:nowrap}
.marke i{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--blau),var(--elektrik));display:grid;place-items:center}
.marke i svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tabs{margin-left:auto;display:flex;gap:2px}
.tabs button{border:0;background:none;padding:8px 12px;border-radius:100px;color:var(--text);font-weight:500}
.tabs button.an{background:#fff;color:var(--blau);font-weight:600;box-shadow:var(--schatten)}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px}
main{padding:22px 0 30px}
h1{font-size:30px;letter-spacing:-.02em;line-height:1.1}
.unter{color:var(--text);margin-top:4px}
.kopf{display:flex;justify-content:space-between;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px}
.aktionen{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:100px;padding:10px 16px;font-weight:600;background:#fff;color:var(--blau);box-shadow:var(--schatten);white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.haupt{background:var(--blau);color:#fff}
.btn.klein{padding:6px 11px;font-size:13px}
.btn.rot{color:var(--rot)}
.btn:disabled{opacity:.45;cursor:default}
.raster{display:grid;gap:14px}
.r4{grid-template-columns:repeat(4,minmax(0,1fr))}.r2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:820px){.r4,.r2{grid-template-columns:1fr 1fr}.tabs{display:none}}
@media(max-width:520px){.r2{grid-template-columns:1fr}}
.card{background:var(--karte);border-radius:18px;padding:18px;box-shadow:var(--schatten)}
.card h2{font-size:17px;margin-bottom:10px}
.abstand{margin-top:14px}
.zahl .l{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--leise)}
.zahl .w{font-size:25px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.zahl .k{font-size:12.5px;color:var(--leise)}
.leer{color:var(--leise);padding:10px 0}
.hinweis{color:var(--text);font-size:13.5px}
.zeile{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--linie)}
.zeile:last-child{border-bottom:0}
.zeile b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zeile small{color:var(--leise);font-size:12.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zeile .betrag{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.zeile.klick{cursor:pointer}
.zeile.mit-wahl{grid-template-columns:auto minmax(0,1fr) auto}
.zeile input[type=checkbox]{width:18px;height:18px;accent-color:var(--blau)}
.tag-titel{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--leise);padding:14px 0 2px;display:flex;justify-content:space-between}
.marke-s{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;border-radius:100px;padding:2px 8px;margin-left:6px;vertical-align:1px}
.m-offen{background:rgba(245,181,61,.2);color:#8a5a00}.m-ok{background:rgba(14,159,110,.12);color:var(--elektrik,#0A7150)}.m-blau{background:color-mix(in srgb,var(--elektrik,#0E7A55) 10%,transparent);color:var(--blau)}.m-grau{background:var(--flaeche);color:var(--leise)}
.filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
select,input[type=text],input[type=date],input[type=month],input[type=time],input[type=number],input[type=search],textarea{font:inherit;border:1px solid color-mix(in srgb,var(--blau,#0B3B2E) 26%,transparent);border-radius:10px;padding:8px 11px;background:#fff;color:var(--tinte);min-width:0}
.woche{overflow-x:auto}
.woche table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:640px}
.woche th{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--leise);font-weight:500;text-align:right;padding:8px 6px;border-bottom:1px solid var(--linie)}
.woche th:first-child,.woche td:first-child{text-align:left}
.woche td{padding:10px 6px;border-bottom:1px solid var(--linie);text-align:right}
.woche td.null{color:#C4C8D4}
.woche tr:last-child td{border-bottom:0;font-weight:700}
.woche .heute{background:color-mix(in srgb,var(--elektrik,#0E7A55) 6%,transparent)}
.woche-nav{display:inline-flex;align-items:center;gap:6px}
.woche-nav b{min-width:170px;text-align:center}
dialog{border:0;border-radius:20px;padding:0;width:min(520px,calc(100% - 20px));box-shadow:0 40px 100px -30px rgba(12,18,38,.5)}
dialog::backdrop{background:rgba(12,18,38,.35)}
.dlg{padding:20px;display:grid;gap:10px;max-height:calc(100vh - 40px);overflow:auto}
.dlg h3{font-size:20px}
.dlg label{display:grid;gap:4px;font-size:13px;color:var(--text)}
.dlg .zwei{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dlg .drei{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.dlg .fuss{display:flex;justify-content:space-between;gap:8px;margin-top:6px;flex-wrap:wrap}
.link-feld{display:flex;gap:6px}
.link-feld input{flex:1;font-family:var(--mono);font-size:12px}
.unten-nav{display:none}
@media(max-width:820px){.unten-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(247,249,253,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--linie);padding:6px 4px calc(6px + var(--unten))}
.unten-nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--leise);padding:4px 0}
.unten-nav button.an{color:var(--blau);font-weight:600}
.unten-nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--unten));transform:translate(-50%,20px);opacity:0;background:var(--tinte);color:#fff;border-radius:100px;padding:11px 18px;font-weight:600;transition:.3s;z-index:99;pointer-events:none;max-width:90vw;text-align:center}
.toast.da{transform:translate(-50%,0);opacity:1}
.start{text-align:center;padding:40px 18px}
.start .gross{width:74px;height:74px;border-radius:22px;margin:0 auto 16px;background:linear-gradient(135deg,var(--blau),var(--elektrik));display:grid;place-items:center}
.start .gross svg{width:38px;height:38px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.start h2{font-size:24px;margin-bottom:6px}
.start p{max-width:540px;margin:0 auto 18px;color:var(--text)}
.schritte{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;text-align:left;max-width:820px;margin:22px auto 0}
.schritte div{background:#fff;border-radius:16px;padding:16px;box-shadow:var(--schatten);font-size:14px;color:var(--text)}
.schritte b{display:block;color:var(--tinte);font-size:15px;margin-bottom:2px}
@media(max-width:720px){.schritte{grid-template-columns:1fr}}
.info-box{background:color-mix(in srgb,var(--elektrik,#0E7A55) 7%,transparent);border-radius:14px;padding:12px 14px;font-size:13.5px;color:var(--blau)}
.auswahl-leiste{position:sticky;bottom:calc(76px + var(--unten));z-index:15;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--tinte);color:#fff;border-radius:16px;padding:10px 12px;margin-top:12px;box-shadow:0 20px 40px -20px rgba(12,18,38,.6)}
.auswahl-leiste .btn{box-shadow:none}
@media(min-width:821px){.auswahl-leiste{bottom:16px}}
[data-suche-hier]{display:flex;margin-left:8px}@media(max-width:820px){[data-suche-hier]{margin-left:auto}}
@media(max-width:520px){.zahl .w{font-size:20px}.card{padding:14px}h1{font-size:26px}.dlg .drei{grid-template-columns:1fr 1fr}}
/* Stundenrapport zum Drucken */
#rapport{display:none}
@media print{
  body{background:#fff;padding:0}
  body > *:not(#rapport){display:none!important}
  #rapport{display:block;padding:10mm 4mm;font-size:11pt;color:#000}
  #rapport h1{font-size:20pt;margin-bottom:2mm}
  #rapport p{margin-bottom:4mm;color:#333}
  #rapport table{width:100%;border-collapse:collapse}
  #rapport th,#rapport td{border-bottom:1px solid #ccc;padding:2mm 1.5mm;text-align:left;vertical-align:top}
  #rapport td.r,#rapport th.r{text-align:right}
  #rapport tfoot td{font-weight:700;border-top:2px solid #000;border-bottom:0}
  #rapport .unterschrift{display:flex;gap:20mm;margin-top:18mm}
  #rapport .unterschrift div{flex:1;border-top:1px solid #000;padding-top:2mm;font-size:9pt}
  .lz-pille,.nv-schwebend{display:none!important}
}
.kal-leiste{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.kal-leiste .woche-nav b{min-width:150px;text-transform:capitalize}
.kal-leute{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.kal-leute button{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--linie);background:#fff;border-radius:100px;padding:6px 12px;font:inherit;font-size:13.5px;cursor:pointer;color:var(--tinte)}
.kal-leute button.an{border-color:var(--elektrik);background:color-mix(in srgb,var(--elektrik,#0E7A55) 8%,transparent);font-weight:600}
.kal-leute i,.ma-wahl i,i.punkt{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
i.punkt{margin-right:6px;vertical-align:1px}
.kal-woche{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:8px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.kal-spalte{background:var(--flaeche,#F4FAF6);border-radius:14px;padding:8px;min-height:160px;display:flex;flex-direction:column;gap:6px}
.kal-spalte.heute{box-shadow:inset 0 0 0 2px var(--elektrik)}
.kal-kopf{font-size:12px;color:var(--leise);text-transform:uppercase;letter-spacing:.08em;display:flex;gap:6px;align-items:baseline}
.kal-kopf b{font-size:18px;color:var(--tinte);letter-spacing:0}
.block{background:#fff;border-left:4px solid var(--f);border-radius:10px;padding:7px 8px;display:grid;gap:1px;font-size:13px;box-shadow:0 1px 2px rgba(12,18,38,.06)}
.block b{font-size:12.5px;color:var(--tinte)}.block span{color:var(--f);font-weight:600}.block small{color:var(--text);font-size:12px;line-height:1.3}
.block .marke-s{justify-self:start;margin-top:3px}
.kal-plus{margin-top:auto;border:1.5px dashed var(--linie);background:none;border-radius:10px;padding:6px;font-size:18px;color:var(--leise);cursor:pointer}
.kal-plus:hover{border-color:var(--elektrik);color:var(--elektrik)}
.kal-monat{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.kal-wt{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--leise);text-align:center;padding:4px 0}
.kal-tag{min-height:84px;border:0;background:var(--flaeche,#F4FAF6);border-radius:10px;padding:6px;text-align:left;display:flex;flex-direction:column;gap:3px;cursor:pointer;font:inherit;color:var(--tinte);overflow:hidden}
.kal-tag span{font-weight:700;font-size:13px}.kal-tag.aussen{opacity:.45}.kal-tag.heute{box-shadow:inset 0 0 0 2px var(--elektrik)}
.kal-tag i{display:block;color:#fff;font-style:normal;font-size:11px;border-radius:5px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kal-tag em{font-style:normal;font-size:11px;color:var(--leise)}
.ma-wahl{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:6px}.ma-wahl label{display:flex!important;align-items:center;gap:6px;font-size:14px;color:var(--tinte)}
a.live{text-decoration:none}
@media(max-width:640px){.kal-tag{min-height:56px;padding:4px}.kal-tag i{font-size:0;height:6px;padding:0}.kal-woche{grid-template-columns:repeat(7,minmax(150px,1fr))}}
.segment{display:inline-flex;background:var(--flaeche,#E8F4EE);border-radius:100px;padding:3px;gap:2px}
.segment button{border:0;background:none;border-radius:100px;padding:6px 14px;font:inherit;font-size:13.5px;cursor:pointer;color:var(--text)}
.segment button.an{background:#fff;color:var(--blau,#0B3B2E);font-weight:600;box-shadow:0 1px 2px rgba(12,18,38,.08)}
</style>
</head>
<body>
<header class="kopfzeile"><div class="wrap">
  <div class="marke"><i><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg></i>Zeiterfassung</div>
  <nav class="tabs" id="tabs"></nav>
  <span data-suche-hier></span>
</div></header>
<main class="wrap" id="inhalt"><p class="leer">Wird geladen …</p></main>
<nav class="unten-nav" id="untenNav"></nav>
<dialog id="dlg"></dialog>
<div class="toast" id="toast"></div>
<div id="rapport"></div>
<script src="../korb.js"></script>
<script src="../pakete.js"></script>
<script src="../branchen.js"></script>
<script src="../lizenz.js" data-produkt="zeit"></script>
<script src="../zusatz.js"></script>
<script src="../suche.js"></script>
<script src="../ordi.js" defer></script>
<script src="../erinnerungen.js" defer></script>
<script src="../tipps.js" defer></script>
<script src="../ui.js"></script>
<script src="../navi.js" data-hier="zeit" data-einfuegen=".kopfzeile .wrap"></script>
<script>
(() => {
  'use strict';
  const K = window.NASUVIA_KONFIG || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fmt = new Intl.NumberFormat('de-CH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const chf = (r) => fmt.format((r || 0) / 100);
  const iso = (d) => d.toLocaleDateString('sv-SE');
  const heute = () => iso(new Date());
  const dk = (d) => (d ? d.slice(8, 10) + '.' + d.slice(5, 7) + '.' + d.slice(0, 4) : '');
  const dkurz = (d) => (d ? d.slice(8, 10) + '.' + d.slice(5, 7) + '.' : '');
  const WT = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
  const wt = (d) => WT[new Date(d + 'T12:00').getDay()];
  const std = (min) => { min = Math.round(min || 0); return Math.floor(min / 60) + ':' + String(min % 60).padStart(2, '0'); };
  const stdDez = (min) => Math.round((min || 0) / 60 * 100) / 100;
  const betragLesen = (t) => { const n = Number(String(t || '').replace(/[’'\s]/g, '').replace(/^CHF/i, '').replace(',', '.')); return Number.isFinite(n) ? Math.round(n * 100) : 0; };
  const plusTage = (d, n) => { const x = new Date(d + 'T12:00'); x.setDate(x.getDate() + n); return iso(x); };
  const montag = (d) => { const x = new Date(d + 'T12:00'); const t = (x.getDay() + 6) % 7; x.setDate(x.getDate() - t); return iso(x); };
  const monatsEnde = (m) => { const [j, mo] = m.split('-').map(Number); return iso(new Date(j, mo, 0, 12)); };
  const MONATE = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
  const monatName = (m) => MONATE[Number(m.slice(5, 7)) - 1] + ' ' + m.slice(0, 4);
  const toast = (t, ms = 2800) => { const e = $('toast'); e.textContent = t; e.classList.add('da'); clearTimeout(toast.z); toast.z = setTimeout(() => e.classList.remove('da'), ms); };
  const fehlerText = (e) => String((e && e.message) || e || 'Unbekannter Fehler').replace(/^.*?: /, (m) => (/exception/i.test(m) ? '' : m));
  const neuerSchluessel = () => { const a = new Uint8Array(18); crypto.getRandomValues(a); return [...a].map((b) => b.toString(16).padStart(2, '0')).join(''); };
  const erfassenLink = (t) => new URL('erfassen/?t=' + t, location.href).href;

  const ICON = {
    uebersicht: '<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>',
    eintraege: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
    mitarbeiter: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2a5 5 0 0 1 5.5 5.8"/>',
    auftraege: '<path d="M4 7h16v13H4z"/><path d="M9 7V4h6v3"/><path d="M4 12h16"/>',
    plan: '<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  };
  const TABS = [['uebersicht', 'Übersicht'], ['plan', 'Einsatzplan'], ['eintraege', 'Einträge'], ['mitarbeiter', 'Mitarbeiter'], ['auftraege', 'Aufträge']];
  const Z = { tab: 'uebersicht', woche: montag(heute()), monat: heute().slice(0, 7), fMa: '', fAuftrag: '', fStatus: 'offen', wahl: new Set(),
    mitarbeiter: [], auftraege: [], eintraege: [], einsaetze: [], planWoche: montag(heute()), bereit: false, planModus: (() => { try { return localStorage.getItem('ze.planModus') || 'woche'; } catch { return 'woche'; } })(), planMa: '', standorte: {} };
  if (Z.planModus === 'monat') Z.planWoche = heute().slice(0, 7) + '-01';
  try { const t = sessionStorage.getItem('ze.tab'); if (TABS.some(([id]) => id === t)) Z.tab = t; } catch {}
  const q = new URLSearchParams(location.search);
  if (TABS.some(([id]) => id === q.get('tab'))) Z.tab = q.get('tab');

  if (!K.produkt) {
    $('inhalt').innerHTML = `<div class="start"><div class="gross"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg></div><h2>Zeiterfassung</h2><p>Die Zeiterfassung gibt es in der Verkaufsversion (Ordasio). Für deine eigenen Mitarbeiter nutzt du das Team-Werkzeug auf nasuvia.ch.</p></div>`;
    return;
  }
  const sb = window.supabase.createClient(K.url, K.key, { auth: { persistSession: true, autoRefreshToken: true, storageKey: K.speicher } });

  /* ---------- Daten ---------- */
  const maName = (id) => (Z.mitarbeiter.find((m) => m.id === id) || {}).name || 'Unbekannt';
  const ma = (id) => Z.mitarbeiter.find((m) => m.id === id) || {};
  const auftrag = (id) => Z.auftraege.find((a) => a.id === id);
  const auftragText = (id) => { const a = auftrag(id); return a ? a.name + (a.kunde ? ' · ' + a.kunde : '') : ''; };

  async function stammLaden() {
    const [m, a] = await Promise.all([
      sb.from('ze_mitarbeiter').select('*').is('geloescht_am', null).order('aktiv', { ascending: false }).order('name'),
      sb.from('ze_auftraege').select('*').is('geloescht_am', null).order('aktiv', { ascending: false }).order('name'),
    ]);
    if (m.error) throw m.error; if (a.error) throw a.error;
    const k = await sb.from('ze_konfig').select('*').maybeSingle();
    Z.zeitAn = !k.data || k.data.zeit_erfassen !== false;
    Z.optionen = (k.data && k.data.optionen) || {};
    Z.mitarbeiter = m.data; Z.auftraege = a.data;
  }
  // Einträge: ganzes Jahr rund um den gewählten Monat und die gewählte Woche (reicht für Übersicht, Monat und offene Posten)
  async function eintraegeLaden() {
    const von = [Z.monat + '-01', Z.woche, plusTage(heute(), -400)].sort()[0];
    const bis = [monatsEnde(Z.monat), plusTage(Z.woche, 6), heute()].sort().pop();
    const alle = [];
    for (let ab = 0; ; ab += 1000) {
      const { data, error } = await sb.from('ze_eintraege').select('*').is('geloescht_am', null).gte('datum', von).lte('datum', plusTage(bis, 1)).order('datum', { ascending: false }).order('von', { ascending: false, nullsFirst: false }).range(ab, ab + 999);
      if (error) throw error;
      alle.push(...data);
      if (data.length < 1000) break;
    }
    Z.eintraege = alle;
    const [pv, pb] = planBereich();
    const es = await sb.from('ze_einsaetze').select('*').is('geloescht_am', null).gte('datum', [pv, heute()].sort()[0]).lte('datum', [pb, heute()].sort().pop()).order('datum').order('von', { nullsFirst: false });
    if (es.error) throw es.error;
    Z.einsaetze = es.data;
    try { const st = await sb.from('ze_standorte').select('*'); Z.standorte = Object.fromEntries((st.data || []).map((x) => [x.einsatz_id, x])); } catch { Z.standorte = {}; }
  }
  const KORB = [
    { tabelle: 'ze_mitarbeiter', art: 'Mitarbeiter', titel: (r) => r.name, zurueck: {} },
    { tabelle: 'ze_auftraege', art: 'Auftrag', titel: (r) => r.name + (r.kunde ? ' · ' + r.kunde : ''),
      dateien: async (rows) => { const { data } = await sb.from('ze_fotos').select('pfad').in('auftrag_id', rows.map((r) => r.id)); if (data && data.length) await sb.storage.from('auftrag-fotos').remove(data.map((f) => f.pfad)); } },
    { tabelle: 'ze_eintraege', art: 'Stunden-Eintrag', titel: (r) => `${maName(r.mitarbeiter_id)} · ${dk(r.datum)} · ${std(r.minuten)} Std.` },
    { tabelle: 'ze_fotos', art: 'Foto', titel: (r) => `Foto zu ${(auftrag(r.auftrag_id) || {}).name || 'Auftrag'} · ${dk(r.erstellt.slice(0, 10))}`, dateien: async (rows) => { await sb.storage.from('auftrag-fotos').remove(rows.map((r) => r.pfad)); } },
    { tabelle: 'ze_einsaetze', art: 'Einsatz', titel: (r) => `${maName(r.mitarbeiter_id)} · ${dk(r.datum)}${r.adresse ? ' · ' + r.adresse : ''}` },
  ];
  async function allesLaden() {
    Korb.neuLaden = async () => { await stammLaden(); await eintraegeLaden(); zeichnen(); };
    Korb.aufraeumen(sb, KORB);
    try { await stammLaden(); await eintraegeLaden(); Z.bereit = true; zeichnen(); }
    catch (e) { $('inhalt').innerHTML = `<div class="card"><h2>Daten konnten nicht geladen werden</h2><p class="hinweis">${esc(fehlerText(e))}</p><button class="btn abstand" data-a="neuLaden">Nochmals versuchen</button></div>`; }
  }

  /* ---------- Navigation ---------- */
  function navZeichnen() {
    $('tabs').innerHTML = TABS.map(([id, n]) => `<button class="${Z.tab === id ? 'an' : ''}" data-tab="${id}">${n}</button>`).join('');
    $('untenNav').innerHTML = TABS.map(([id, n]) => `<button class="${Z.tab === id ? 'an' : ''}" data-tab="${id}"><svg viewBox="0 0 24 24">${ICON[id]}</svg>${n}</button>`).join('');
  }
  function zeichnen() {
    navZeichnen();
    if (!Z.bereit) return;
    if (!Z.mitarbeiter.length && Z.tab !== 'auftraege') { $('inhalt').innerHTML = startSeite(); return; }
    $('inhalt').innerHTML = ({ uebersicht, eintraege, mitarbeiter, auftraege, plan })[Z.tab]();
  }

  function startSeite() {
    return `<div class="start"><div class="gross"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg></div>
      <h2>Arbeitszeit erfassen, ohne Zettel</h2>
      <p>Ihre Mitarbeiter tippen Stunden und Aufträge auf dem Handy ein. Sie sehen alles sofort hier, drucken den Stundenrapport und machen mit einem Klick eine Rechnung oder den Lohn daraus.</p>
      <button class="btn haupt" data-a="maNeu">+ Ersten Mitarbeiter erfassen</button>
      <div class="schritte">
        <div><b>1. Mitarbeiter erfassen</b>Name, Stundenlohn und Ansatz für Kunden.</div>
        <div><b>2. Link schicken</b>Jeder bekommt einen persönlichen Link per WhatsApp. Kein Konto, kein Passwort.</div>
        <div><b>3. Fertig</b>Stunden kommen hier an. Daraus werden Rechnung, Rapport und Lohn.</div>
      </div></div>`;
  }

  /* ---------- Übersicht: Woche ---------- */
  function uebersicht() {
    const tage = [...Array(7)].map((_, i) => plusTage(Z.woche, i));
    const inWoche = Z.eintraege.filter((e) => e.datum >= tage[0] && e.datum <= tage[6]);
    const monatE = Z.eintraege.filter((e) => e.datum.slice(0, 7) === heute().slice(0, 7));
    const offen = Z.eintraege.filter((e) => !e.verrechnet);
    const summe = (l) => l.reduce((s, e) => s + e.minuten, 0);
    const wert = (l) => l.reduce((s, e) => s + Math.round(e.minuten / 60 * (ma(e.mitarbeiter_id).ansatz_rappen || 0)), 0);
    const lohn = (l) => l.reduce((s, e) => s + Math.round(e.minuten / 60 * (ma(e.mitarbeiter_id).stundenlohn_rappen || 0)), 0);
    const aktive = Z.mitarbeiter.filter((m) => m.aktiv || inWoche.some((e) => e.mitarbeiter_id === m.id));
    const zelle = (min, kl = '') => `<td class="${min ? '' : 'null'} ${kl}">${min ? std(min) : '–'}</td>`;
    const kw = (() => { const d = new Date(Z.woche + 'T12:00'); d.setDate(d.getDate() + 3); const j = new Date(d.getFullYear(), 0, 4); return 1 + Math.round(((d - j) / 864e5 - 3 + ((j.getDay() + 6) % 7)) / 7); })();
    const neueste = Z.eintraege.slice().sort((a, b) => (b.erstellt > a.erstellt ? 1 : -1)).slice(0, 6);
    const zeitHinweis = Z.zeitAn === false ? '<div class="info-box" style="margin-bottom:14px">Die Arbeitszeit wird zurzeit nicht erfasst. Ihre Mitarbeiter sehen nur Aufträge, Einsätze und Fotos. Einschalten unter „Mitarbeiter“.</div>' : '';
    return zeitHinweis + `<div class="kopf"><div><h1>Übersicht</h1><p class="unter">Wer hat wann wie lange gearbeitet.</p></div>
        <div class="aktionen"><button class="btn" data-a="startAnpassen">Übersicht anpassen</button><button class="btn" data-a="eintragNeu">+ Eintrag</button><button class="btn" data-a="lohn">Stunden in den Lohnlauf</button></div></div>
      ${ST().zahlen ? `<div class="raster r4">
        <div class="card zahl"><div class="l">Diese Woche</div><div class="w">${std(summe(inWoche))}</div><div class="k">Stunden, alle Mitarbeiter</div></div>
        <div class="card zahl"><div class="l">${MONATE[new Date().getMonth()]}</div><div class="w">${std(summe(monatE))}</div><div class="k">Lohnkosten ca. CHF ${chf(lohn(monatE))}</div></div>
        <div class="card zahl"><div class="l">Noch nicht verrechnet</div><div class="w">${std(summe(offen))}</div><div class="k">Wert CHF ${chf(wert(offen))}</div></div>
        <div class="card zahl"><div class="l">Mitarbeiter</div><div class="w">${Z.mitarbeiter.filter((m) => m.aktiv).length}</div><div class="k">${Z.auftraege.filter((a) => a.aktiv).length} offene Aufträge</div></div>
      </div>` : ''}
      ${ST().woche ? `<div class="card abstand">
        <div class="kopf" style="margin-bottom:6px"><h2 style="margin:0">Woche ${kw}</h2>
          <div class="woche-nav"><button class="btn klein" data-a="wocheZurueck" aria-label="Woche zurück">‹</button><b>${dkurz(tage[0])} bis ${dk(tage[6])}</b><button class="btn klein" data-a="wocheVor" aria-label="Woche vor">›</button>${Z.woche !== montag(heute()) ? '<button class="btn klein" data-a="wocheHeute">Heute</button>' : ''}</div></div>
        <div class="woche"><table><thead><tr><th>Mitarbeiter</th>${tage.map((t) => `<th class="${t === heute() ? 'heute' : ''}">${wt(t)} ${dkurz(t)}</th>`).join('')}<th>Total</th></tr></thead><tbody>
          ${aktive.map((m) => { const l = inWoche.filter((e) => e.mitarbeiter_id === m.id); return `<tr class="klick" data-ma-woche="${m.id}"><td><b>${esc(m.name)}</b></td>${tage.map((t) => zelle(summe(l.filter((e) => e.datum === t)), t === heute() ? 'heute' : '')).join('')}${zelle(summe(l))}</tr>`; }).join('')}
          <tr><td>Total</td>${tage.map((t) => zelle(summe(inWoche.filter((e) => e.datum === t)), t === heute() ? 'heute' : '')).join('')}${zelle(summe(inWoche))}</tr>
        </tbody></table></div>
      </div>` : ''}
      ${ST().heute ? `<div class="card abstand"><h2>Heute geplant</h2>${Z.einsaetze.filter((s) => s.datum === heute()).map((s) => `<div class="zeile klick" data-einsatz="${s.id}"><div style="min-width:0"><b>${s.von ? s.von.slice(0, 5) + ' · ' : ''}${esc(maName(s.mitarbeiter_id))}${s.erledigt ? '<span class="marke-s m-ok">erledigt</span>' : ''}</b><small>${esc([auftragText(s.auftrag_id), s.adresse].filter(Boolean).join(' · '))}</small></div></div>`).join('') || '<p class="leer">Heute ist nichts geplant.</p>'}</div>` : ''}
      ${ST().zuletzt ? `<div class="card abstand"><h2>Zuletzt erfasst</h2>${neueste.length ? neueste.map((e) => eintragZeile(e)).join('') : '<p class="leer">Noch nichts erfasst. Schicken Sie Ihren Mitarbeitern den Link unter „Mitarbeiter“.</p>'}</div>` : ''}`;

  const ST = () => { try { return { zahlen: true, woche: true, heute: true, zuletzt: true, ...JSON.parse(localStorage.getItem('ze.start') || '{}') }; } catch { return { zahlen: true, woche: true, heute: true, zuletzt: true }; } };
  function startAnpassen() {
    const f = dialog(`<h3>Übersicht anpassen</h3><p class="hinweis">Wählen Sie, was auf der Übersicht erscheint.</p>
      ${ST_KARTEN.map(([k, n]) => `<label style="display:flex;gap:8px;align-items:center;font-size:15px;color:var(--tinte)"><input type="checkbox" name="${k}" ${ST()[k] ? 'checked' : ''}> ${n}</label>`).join('')}
      <div class="fuss"><span></span><span class="aktionen"><button type="button" class="btn" data-a="zu">Abbrechen</button><button class="btn haupt">Speichern</button></span></div>`);
    f.onsubmit = (ev) => { ev.preventDefault(); const d = new FormData(f); try { localStorage.setItem('ze.start', JSON.stringify(Object.fromEntries(ST_KARTEN.map(([k]) => [k, d.get(k) === 'on'])))); } catch {} dlg.close(); zeichnen(); toast('Übersicht angepasst'); };
  }
  function eintragZeile(e, mitWahl) {
    const ort = e.standort && (e.standort.start || e.standort.ende);
    const t = [e.von && e.bis ? `${e.von.slice(0, 5)}–${e.bis.slice(0, 5)}` : '', e.pause_min ? `${e.pause_min} Min. Pause` : '', auftragText(e.auftrag_id), e.taetigkeit, Number(e.km) ? `${e.km} km` : ''].filter(Boolean);
    return `<div class="zeile klick ${mitWahl ? 'mit-wahl' : ''}" data-eintrag="${e.id}">
      ${mitWahl ? `<input type="checkbox" data-wahl="${e.id}" ${Z.wahl.has(e.id) ? 'checked' : ''} aria-label="Auswählen">` : ''}
      <div style="min-width:0"><b>${esc(maName(e.mitarbeiter_id))}${mitWahl ? '' : ` <span style="font-weight:400;color:var(--leise)">· ${wt(e.datum)} ${dk(e.datum)}</span>`}${e.verrechnet ? '<span class="marke-s m-ok">verrechnet</span>' : ''}</b><small>${esc(t.join(' · ')) || 'Ohne Angaben'}${ort ? ` · <a href="https://maps.apple.com/?q=${ort[0]},${ort[1]}" target="_blank" rel="noopener" data-stopp>📍 Ort</a>` : ''}</small></div>
      <div class="betrag">${std(e.minuten)}</div></div>`;
  }

  /* ---------- Einsatzplan: wer geht wann zu welchem Kunden ---------- */
  const smsText = (s) => { const a = auftrag(s.auftrag_id); const firma = (window.NASUVIA_LIZENZ && (window.NASUVIA_LIZENZ.firma || window.NASUVIA_LIZENZ.name)) || 'wir';
    return `Guten Tag, wir bestätigen Ihren Termin am ${wt(s.datum)} ${dk(s.datum)}${s.von ? ' um ' + s.von.slice(0, 5) + ' Uhr' : ''}${a ? ' (' + a.name + ')' : ''}. ${maName(s.mitarbeiter_id).split(' ')[0]} kommt bei Ihnen vorbei. Freundliche Grüsse, ${firma}`; };
  // Einsatzplan als Kalender: Woche (Raster), Monat oder Liste; Farbe pro Mitarbeiter
  const FARBEN_MA = ['#0E7A55', '#2563EB', '#C2410C', '#7C3AED', '#0891B2', '#B91C1C', '#CA8A04', '#DB2777', '#4D7C0F', '#475569'];
  const maFarbe = (id) => FARBEN_MA[Math.max(0, Z.mitarbeiter.findIndex((m) => m.id === id)) % FARBEN_MA.length];
  const monatsStart = (d) => d.slice(0, 7) + '-01';
  function planBereich() {
    if (Z.planModus === 'monat') { const st = montag(monatsStart(Z.planWoche)); return [st, plusTage(st, 41)]; }
    return [plusTage(Z.planWoche, -7), plusTage(Z.planWoche, 13)];
  }
  const sichtbarePlan = () => Z.einsaetze.filter((s) => !Z.planMa || s.mitarbeiter_id === Z.planMa);
  function liveText(s) {
    const st = Z.standorte[s.id]; if (!st) return s.live && !s.erledigt ? '<span class="marke-s">Live-Standort an</span>' : '';
    const min = Math.max(0, Math.round((Date.now() - Date.parse(st.zeit)) / 60000));
    return `<a class="marke-s m-ok live" href="https://maps.google.com/?q=${st.lat},${st.lng}" target="_blank" rel="noopener" data-stopp>📍 ${min < 1 ? 'gerade eben' : 'vor ' + min + ' Min.'}</a>`;
  }
  function block(s) {
    return `<div class="block klick" data-einsatz="${s.id}" style="--f:${maFarbe(s.mitarbeiter_id)}${s.erledigt ? ';opacity:.55' : ''}"><b>${s.von ? s.von.slice(0, 5) + (s.bis ? '–' + s.bis.slice(0, 5) : '') : 'Ganzer Tag'}</b>
      <span>${esc(maName(s.mitarbeiter_id))}</span><small>${esc([auftragText(s.auftrag_id), s.adresse].filter(Boolean).join(' · ')) || ''}</small>${liveText(s)}${s.erledigt ? '<small>✓ erledigt</small>' : ''}</div>`;
  }
  function plan() {
    const m = Z.planModus;
    const tage = [...Array(7)].map((_, i) => plusTage(Z.planWoche, i));
    const l = sichtbarePlan();
    const aktive = Z.mitarbeiter.filter((x) => x.aktiv);
    const titel = m === 'monat' ? new Date(monatsStart(Z.planWoche) + 'T12:00').toLocaleDateString('de-CH', { month: 'long', year: 'numeric' }) : `${dkurz(tage[0])} bis ${dk(tage[6])}`;

      inhalt = `<div class="kal-woche">${tage.map((t) => `<div class="kal-spalte ${t === heute() ? 'heute' : ''}" data-plan-tag="${t}"><div class="kal-kopf">${wt(t)} <b>${Number(t.slice(8))}</b></div>
        ${l.filter((s) => s.datum === t).map(block).join('')}<button class="kal-plus" data-plan-neu="${t}" aria-label="Einsatz am ${dk(t)} planen">+</button></div>`).join('')}</div>`;
    } else if (m === 'monat') {
      const st = montag(monatsStart(Z.planWoche)), mon = Z.planWoche.slice(0, 7);
      inhalt = `<div class="kal-monat">${['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'].map((x) => `<div class="kal-wt">${x}</div>`).join('')}${[...Array(42)].map((_, i) => { const t = plusTage(st, i), e = l.filter((s) => s.datum === t);
        return `<button class="kal-tag ${t.slice(0, 7) !== mon ? 'aussen' : ''} ${t === heute() ? 'heute' : ''}" data-plan-woche="${t}"><span>${Number(t.slice(8))}</span>${e.slice(0, 3).map((s) => `<i style="background:${maFarbe(s.mitarbeiter_id)}">${esc((s.von || '').slice(0, 5))} ${esc(maName(s.mitarbeiter_id).split(' ')[0])}</i>`).join('')}${e.length > 3 ? `<em>+${e.length - 3}</em>` : ''}</button>`; }).join('')}</div>`;
    } else {
      inhalt = tage.map((t) => { const e = l.filter((s) => s.datum === t);
        return `<div class="tag-titel" ${t === heute() ? 'style="color:var(--elektrik)"' : ''}><span>${wt(t)} ${dk(t)}${t === heute() ? ' · heute' : ''}</span><span>${e.length || ''}</span></div>` +
          (e.length ? e.map((s) => `<div class="zeile klick" data-einsatz="${s.id}"><div style="min-width:0"><b><i class="punkt" style="background:${maFarbe(s.mitarbeiter_id)}"></i>${s.von ? s.von.slice(0, 5) + (s.bis ? '–' + s.bis.slice(0, 5) : '') + ' · ' : ''}${esc(maName(s.mitarbeiter_id))}${s.erledigt ? '<span class="marke-s m-ok">erledigt</span>' : ''} ${liveText(s)}</b>
              <small>${esc([auftragText(s.auftrag_id), s.adresse, s.notiz].filter(Boolean).join(' · ')) || 'Ohne Angaben'}</small></div>
              <div class="aktionen">${s.kunde_telefon ? `<a class="btn klein" href="sms:${esc(s.kunde_telefon.replace(/\s/g, ''))}?&body=${encodeURIComponent(smsText(s))}" data-stopp>SMS an Kunde</a>` : ''}</div></div>`).join('')
            : '<p class="leer" style="padding:4px 0 8px;font-size:13px">Nichts geplant</p>'); }).join('');
    }
    return `<div class="kopf"><div><h1>Einsatzplan</h1><p class="unter">Wer geht wann wohin. Ihre Mitarbeiter sehen ihre Einsätze mit allen Infos auf dem Handy.</p></div>
        <div class="aktionen"><button class="btn haupt" data-a="einsatzNeu">+ Einsatz planen</button></div></div>
      <div class="card">
        <div class="kal-leiste">
          <div class="segment">${[['woche', 'Woche'], ['monat', 'Monat'], ['liste', 'Liste']].map(([k, n]) => `<button class="${m === k ? 'an' : ''}" data-plan-modus="${k}">${n}</button>`).join('')}</div>

        </div>
        ${aktive.length > 1 ? `<div class="kal-leute"><button class="${!Z.planMa ? 'an' : ''}" data-plan-ma="">Alle</button>${aktive.map((x) => `<button class="${Z.planMa === x.id ? 'an' : ''}" data-plan-ma="${x.id}"><i style="background:${maFarbe(x.id)}"></i>${esc(x.name)}</button>`).join('')}</div>` : ''}
        ${inhalt}
      </div>
      <p class="hinweis abstand">Tippen Sie auf einen Tag oder auf „+“, um dort einen Einsatz zu planen. Mit „SMS an Kunde“ öffnet sich eine fertige Terminbestätigung.</p>`;
  }
  function einsatzDialog(s = {}) {

      ${s.id ? `<div class="zwei"><label>Mitarbeiter<select name="ma" required>${aktive.map((m) => `<option value="${m.id}" ${m.id === s.mitarbeiter_id ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}</select></label>
      <label>Datum<input type="date" name="datum" value="${s.datum || heute()}" required></label></div>`
      : `<div><span class="hinweis">Wer geht? (mehrere möglich)</span><div class="ma-wahl">${aktive.map((m, i) => `<label><input type="checkbox" name="ma" value="${m.id}" ${(Z.planMa ? Z.planMa === m.id : i === 0) ? 'checked' : ''}><i style="background:${maFarbe(m.id)}"></i>${esc(m.name)}</label>`).join('')}</div></div>
      <label>Datum<input type="date" name="datum" value="${s.datum || heute()}" required></label>`}
      <div class="zwei"><label>Von<input type="time" name="von" value="${(s.von || '').slice(0, 5)}"></label><label>Bis (ungefähr)<input type="time" name="bis" value="${(s.bis || '').slice(0, 5)}"></label></div>
      <label>Auftrag<select name="auftrag"><option value="">Ohne Auftrag</option>${Z.auftraege.filter((a) => a.aktiv || a.id === s.auftrag_id).map((a) => `<option value="${a.id}" ${a.id === s.auftrag_id ? 'selected' : ''}>${esc(a.name)}${a.kunde ? ' · ' + esc(a.kunde) : ''}</option>`).join('')}</select></label>
      <label>Adresse<input type="text" name="adresse" value="${esc(s.adresse || '')}" maxlength="200" placeholder="Strasse, PLZ Ort"></label>
      <label>Telefon des Kunden (für die SMS)<input type="tel" name="tel" value="${esc(s.kunde_telefon || '')}" maxlength="40" placeholder="079 123 45 67"></label>
      <label>Kurze Notiz<input type="text" name="notiz" value="${esc(s.notiz || '')}" maxlength="500" placeholder="z. B. Schlüssel beim Nachbarn"></label>
      <label>Zusatzinfos <small class="hinweis">Material, Zugang, Ansprechperson, Ablauf</small><textarea name="info" rows="3" maxlength="2000" placeholder="z. B. Material im Lager abholen. Kunde ist ab 9 Uhr da. Hund im Garten.">${esc(s.info || '')}</textarea></label>
      <label style="display:flex;gap:8px;align-items:flex-start;font-size:14px;color:var(--tinte)"><input type="checkbox" name="live" ${s.live ? 'checked' : ''} style="margin-top:3px"> <span>Live-Standort während dieses Einsatzes<br><small class="hinweis">Nur wenn der Mitarbeiter auf dem Handy „Standort teilen“ antippt. Sie sehen den letzten Ort, nach 12 Stunden oder bei „Erledigt“ wird er gelöscht. Bitte vorher mit dem Mitarbeiter absprechen.</small></span></label>
      ${s.id ? `<label style="display:flex;gap:8px;align-items:center;font-size:14px;color:var(--tinte)"><input type="checkbox" name="erledigt" ${s.erledigt ? 'checked' : ''}> Erledigt</label>` : ''}
      <div class="fuss">${s.id ? '<button type="button" class="btn rot" data-a="einsatzLoeschen">Löschen</button>' : '<span></span>'}<span class="aktionen"><button type="button" class="btn" data-a="zu">Abbrechen</button><button class="btn haupt">Speichern</button></span></div>`);
    f.dataset.formEinsatz = s.id || '';
    f.onsubmit = async (ev) => {
      ev.preventDefault();
      const d = new FormData(f);
      const leute = s.id ? [d.get('ma')] : d.getAll('ma');
      if (!leute.length) { toast('Bitte mindestens einen Mitarbeiter wählen'); return; }
      const zeile = { datum: d.get('datum'), von: d.get('von') || null, bis: d.get('bis') || null, auftrag_id: d.get('auftrag') || null,
        adresse: String(d.get('adresse') || '').trim(), kunde_telefon: String(d.get('tel') || '').trim(), notiz: String(d.get('notiz') || '').trim(),
        info: String(d.get('info') || '').trim(), live: d.get('live') === 'on' };
      if (s.id) zeile.erledigt = d.get('erledigt') === 'on';
      const r = s.id ? await Korb.aendern(sb, 'ze_einsaetze', s.id, { ...zeile, mitarbeiter_id: leute[0] }, 'Einsatz geändert')
        : await Korb.neu(sb, 'ze_einsaetze', leute.map((ma) => ({ ...zeile, mitarbeiter_id: ma })), leute.length > 1 ? `${leute.length} Einsätze geplant` : 'Einsatz geplant');
      if (r.error) { toast(fehlerText(r.error), 6000); return; }
      // Ist der Auftrag nur bestimmten Mitarbeitern zugewiesen, bekommen ihn die eingeplanten Mitarbeiter automatisch dazu
      const af = auftrag(zeile.auftrag_id);
      const fehlen = af && (af.zugewiesen || []).length ? leute.filter((x) => !af.zugewiesen.includes(x)) : [];
      if (fehlen.length) await sb.from('ze_auftraege').update({ zugewiesen: [...af.zugewiesen, ...fehlen] }).eq('id', af.id);
      await stammLaden();
      dlg.close(); await eintraegeLaden(); zeichnen(); toast(s.id ? 'Gespeichert' : 'Einsatz geplant');
    };
  }

  /* ---------- Einträge: Monat mit Filter ---------- */
  const gefiltert = () => Z.eintraege.filter((e) => e.datum.slice(0, 7) === Z.monat && (!Z.fMa || e.mitarbeiter_id === Z.fMa)
    && (!Z.fAuftrag || (Z.fAuftrag === 'ohne' ? !e.auftrag_id : e.auftrag_id === Z.fAuftrag))
    && (Z.fStatus === 'alle' || (Z.fStatus === 'offen' ? !e.verrechnet : e.verrechnet)));
  function eintraege() {
    const l = gefiltert();
    for (const id of [...Z.wahl]) if (!l.some((e) => e.id === id)) Z.wahl.delete(id);
    const tage = [...new Set(l.map((e) => e.datum))];
    const summe = l.reduce((s, e) => s + e.minuten, 0);
    const gew = l.filter((e) => Z.wahl.has(e.id));
    return `<div class="kopf"><div><h1>Einträge</h1><p class="unter">${monatName(Z.monat)} · ${std(summe)} Stunden · ${l.length} ${l.length === 1 ? 'Eintrag' : 'Einträge'}</p></div>
        <div class="aktionen"><button class="btn" data-a="korb">Zuletzt gelöscht</button><button class="btn" data-a="eintragNeu">+ Eintrag</button><button class="btn" data-a="rapport">Stundenrapport drucken</button><button class="btn" data-a="csv">CSV</button></div></div>
      <div class="filter">
        <input type="month" data-f="monat" value="${Z.monat}" aria-label="Monat">
        <select data-f="fMa" aria-label="Mitarbeiter"><option value="">Alle Mitarbeiter</option>${Z.mitarbeiter.map((m) => `<option value="${m.id}" ${Z.fMa === m.id ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}</select>
        <select data-f="fAuftrag" aria-label="Auftrag"><option value="">Alle Aufträge</option><option value="ohne" ${Z.fAuftrag === 'ohne' ? 'selected' : ''}>Ohne Auftrag</option>${Z.auftraege.map((a) => `<option value="${a.id}" ${Z.fAuftrag === a.id ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select>
        <select data-f="fStatus" aria-label="Status"><option value="offen" ${Z.fStatus === 'offen' ? 'selected' : ''}>Nicht verrechnet</option><option value="verrechnet" ${Z.fStatus === 'verrechnet' ? 'selected' : ''}>Verrechnet</option><option value="alle" ${Z.fStatus === 'alle' ? 'selected' : ''}>Alle</option></select>
      </div>
      <div class="card">${l.length ? `<div class="zeile mit-wahl" style="padding-top:0"><input type="checkbox" data-a="alleWaehlen" ${gew.length === l.length ? 'checked' : ''} aria-label="Alle auswählen"><small style="font-size:13px">Alle auswählen</small><span></span></div>`
        + tage.map((t) => { const x = l.filter((e) => e.datum === t); return `<div class="tag-titel"><span>${wt(t)} ${dk(t)}</span><span>${std(x.reduce((s, e) => s + e.minuten, 0))}</span></div>` + x.map((e) => eintragZeile(e, true)).join(''); }).join('')
        : '<p class="leer">Keine Einträge für diese Auswahl.</p>'}</div>
      ${gew.length ? `<div class="auswahl-leiste"><b>${gew.length} gewählt · ${std(gew.reduce((s, e) => s + e.minuten, 0))} Std.</b><span style="flex:1"></span>
        <button class="btn klein haupt" style="background:#fff;color:var(--blau)" data-a="rechnung">In Rechnung übernehmen</button>
        <button class="btn klein" data-a="verrechnet">${gew.every((e) => e.verrechnet) ? 'Wieder offen' : 'Als verrechnet markieren'}</button>
        <button class="btn klein rot" data-a="loeschenGew">Löschen</button></div>` : ''}`;
  }

  /* ---------- Wie erfasst wird (pro Firma wählbar) ---------- */
  // Jede Option: [Schlüssel, Titel, [[Wert, Name, Erklärung]], Standard]
  const OPTIONEN = [
    ['art', 'Erfassung', [['stempeln', 'Stempeluhr', 'Start und Stopp auf dem Handy, Nachtragen möglich. Für die meisten Betriebe.'],
      ['vonbis', 'Von–bis eintragen', 'Keine Uhr. Beginn, Ende und Pause werden eingetragen.'],
      ['stunden', 'Nur Stunden pro Tag', 'Vereinfachte Erfassung nach Art. 73b ArGV 1. Nur mit schriftlicher Vereinbarung und für Mitarbeitende, die ihre Zeit weitgehend selbst einteilen.']], 'stempeln'],
    ['standort', 'Standort', [['aus', 'Aus', 'Es wird kein Standort gespeichert.'], ['stempeln', 'Beim Starten und Stoppen', 'Für alle: Ort beim Stempeln, kein Mitverfolgen.'],
      ['mitarbeiter', 'Pro Person wählen', 'Bei jedem Mitarbeiter einzeln einstellbar.']], 'mitarbeiter'],
    ['pause', 'Pausen', [['manuell', 'Selbst eintragen', 'Mitarbeitende tragen die Pause ein.'], ['auto', 'Mindestpause automatisch', 'Nach Art. 15 ArG: 15 Min. ab 5½ Std., 30 Min. ab 7 Std., 60 Min. ab 9 Std.']], 'manuell'],
    ['auftrag', 'Auftrag', [['frei', 'Freiwillig', ''], ['pflicht', 'Pflicht', 'Jede Zeit gehört zu einem Auftrag. Ideal zum Verrechnen.'], ['aus', 'Ausblenden', 'Nur Arbeitszeit, ohne Aufträge.']], 'frei'],
    ['taetigkeit', 'Tätigkeit', [['frei', 'Freiwillig', ''], ['pflicht', 'Pflicht', 'Kurz beschreiben, was gemacht wurde (für Rapporte).'], ['aus', 'Ausblenden', '']], 'frei'],
    ['km', 'Kilometer', [['ja', 'Erfassen', ''], ['nein', 'Ausblenden', '']], 'ja'],
    ['nachtragen', 'Nachtragen bis', [['1', 'Gestern', 'Nur heute und gestern.'], ['7', '7 Tage', ''], ['31', '1 Monat', ''], ['400', 'Unbegrenzt', '']], '400'],
    ['rundung', 'Stempeluhr runden', [['0', 'Genau', ''], ['5', 'Auf 5 Min.', ''], ['15', 'Auf 15 Min.', 'Start und Stopp werden auf die nächste Viertelstunde gerundet.']], '0'],
  ];
  // Vorschläge nach Branche
  const BRANCHE_OPTIONEN = {
    handwerk: { art: 'stempeln', standort: 'mitarbeiter', pause: 'auto', auftrag: 'pflicht', taetigkeit: 'frei', km: 'ja', nachtragen: '7', rundung: '0' },
    garten: { art: 'stempeln', standort: 'mitarbeiter', pause: 'auto', auftrag: 'pflicht', taetigkeit: 'frei', km: 'ja', nachtragen: '7', rundung: '0' },
    gastro: { art: 'stempeln', standort: 'aus', pause: 'auto', auftrag: 'aus', taetigkeit: 'aus', km: 'nein', nachtragen: '1', rundung: '15' },
    beauty: { art: 'stempeln', standort: 'aus', pause: 'auto', auftrag: 'aus', taetigkeit: 'aus', km: 'nein', nachtragen: '7', rundung: '5' },
    handel: { art: 'stempeln', standort: 'aus', pause: 'auto', auftrag: 'aus', taetigkeit: 'aus', km: 'nein', nachtragen: '7', rundung: '5' },
    transport: { art: 'stempeln', standort: 'stempeln', pause: 'auto', auftrag: 'frei', taetigkeit: 'frei', km: 'ja', nachtragen: '7', rundung: '0' },
    beratung: { art: 'stunden', standort: 'aus', pause: 'manuell', auftrag: 'pflicht', taetigkeit: 'pflicht', km: 'nein', nachtragen: '31', rundung: '0' },
    kreativ: { art: 'stunden', standort: 'aus', pause: 'manuell', auftrag: 'pflicht', taetigkeit: 'pflicht', km: 'nein', nachtragen: '31', rundung: '0' },
    gesundheit: { art: 'vonbis', standort: 'aus', pause: 'manuell', auftrag: 'aus', taetigkeit: 'frei', km: 'nein', nachtragen: '7', rundung: '0' },
    bildung: { art: 'vonbis', standort: 'aus', pause: 'manuell', auftrag: 'frei', taetigkeit: 'frei', km: 'nein', nachtragen: '31', rundung: '0' },
  };
  const opt = (k) => { const o = OPTIONEN.find((x) => x[0] === k); return String((Z.optionen || {})[k] ?? o[3]); };
  function optionenKarte() {
    const br = window.Branchen ? Branchen.finde(Branchen.aktuell()) : null, vorschlag = br && BRANCHE_OPTIONEN[br.id];
    const gleich = vorschlag && Object.entries(vorschlag).every(([k, v]) => opt(k) === v);
    return `<details class="card" style="margin-bottom:14px" ${Object.keys(Z.optionen || {}).length ? '' : 'open'}><summary style="cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center"><span><b>So erfassen Ihre Mitarbeitenden</b><br><small class="hinweis">${esc(OPTIONEN.map(([k, , w]) => (w.find((x) => x[0] === opt(k)) || [])[1]).slice(0, 4).join(' · '))}</small></span><span class="btn klein">Anpassen</span></summary>
      ${vorschlag ? `<div class="info-box" style="margin:12px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span style="flex:1;min-width:200px">${gleich ? '✓ Eingestellt wie empfohlen' : 'Empfohlen'} für <b>${esc(br.name)}</b>.</span>${gleich ? '' : '<button class="btn klein haupt" data-opt-branche>Übernehmen</button>'}</div>` : ''}
      <div style="display:grid;gap:14px;margin-top:12px">${OPTIONEN.map(([k, titel, werte]) => { const w = werte.find((x) => x[0] === opt(k)) || werte[0];
        return `<div><div style="font-size:13px;color:var(--leise);margin-bottom:5px">${titel}</div><div class="segment" style="flex-wrap:wrap">${werte.map(([v, n]) => `<button class="${opt(k) === v ? 'an' : ''}" data-opt="${k}" data-wert="${v}">${n}</button>`).join('')}</div>${w[2] ? `<p class="hinweis" style="margin-top:5px">${esc(w[2])}</p>` : ''}</div>`; }).join('')}</div>
      <p class="hinweis" style="margin-top:14px">Gesetz: Arbeitgeber müssen die Arbeitszeit erfassen (Art. 46 ArG, Art. 73 ArGV 1): Tages- und Wochenzeit, Pausen ab 30 Minuten, Aufbewahrung 5 Jahre. Live-Standort lässt sich zusätzlich pro Einsatz im Einsatzplan einschalten.</p></details>`;
  }
  async function optionenSpeichern(neu) {
    const uid = (await sb.auth.getUser()).data.user.id, vorher = Z.optionen;
    Z.optionen = { ...(Z.optionen || {}), ...neu }; zeichnen();
    const { error } = await sb.from('ze_konfig').upsert({ user_id: uid, optionen: Z.optionen, geaendert: new Date().toISOString() });
    if (error) { Z.optionen = vorher; zeichnen(); toast(fehlerText(error)); return; }
    toast('✓ Gilt ab sofort für alle Mitarbeitenden');
  }
  document.addEventListener('click', (ev) => {
    const o = ev.target.closest('[data-opt]'); if (o) { ev.preventDefault(); optionenSpeichern({ [o.dataset.opt]: o.dataset.wert }); return; }
    if (ev.target.closest('[data-opt-branche]')) { ev.preventDefault(); const br = Branchen.finde(Branchen.aktuell()); optionenSpeichern(BRANCHE_OPTIONEN[br.id]); }
  });

  /* ---------- Mitarbeiter ---------- */
  function mitarbeiter() {
    const monat = heute().slice(0, 7);
    return `<div class="kopf"><div><h1>Mitarbeiter</h1><p class="unter">Jeder bekommt einen persönlichen Link zum Erfassen. Kein Konto, kein Passwort.</p></div>
        <div class="aktionen"><button class="btn" data-a="korb">Zuletzt gelöscht</button><a class="btn" href="../vorlagen/?v=wochenrapport" title="Rapporte zum Ausfüllen von Hand">Rapport-Vorlagen</a><button class="btn haupt" data-a="maNeu">+ Mitarbeiter</button></div></div>
      <div class="card" style="margin-bottom:14px"><label style="display:flex;gap:12px;align-items:flex-start;cursor:pointer"><input type="checkbox" data-zeit-an ${Z.zeitAn !== false ? 'checked' : ''} style="width:20px;height:20px;margin-top:2px;accent-color:var(--blau)">
        <span><b>Mitarbeiter erfassen ihre Arbeitszeit</b><br><small class="hinweis">Ausgeschaltet sehen Ihre Mitarbeiter auf dem Handy nur ihre Aufträge und Einsätze und laden Fotos hoch, ohne Stunden zu erfassen.</small></span></label></div>
      ${Z.zeitAn !== false ? optionenKarte() : ''}
      <div class="card">${Z.mitarbeiter.map((m) => { const min = Z.eintraege.filter((e) => e.mitarbeiter_id === m.id && e.datum.slice(0, 7) === monat).reduce((s, e) => s + e.minuten, 0);
        return `<div class="zeile klick" data-ma="${m.id}"><div style="min-width:0"><b>${esc(m.name)}${m.aktiv ? '' : '<span class="marke-s m-grau">inaktiv</span>'}</b><small>${m.rolle === 'projektleiter' ? '<b style="display:inline;color:var(--elektrik)">Projektleiter</b> · ' : ''}${m.standort ? '📍 · ' : ''}${m.stundenlohn_rappen ? `Lohn CHF ${chf(m.stundenlohn_rappen)}/Std.` : 'Kein Stundenlohn'} · ${m.ansatz_rappen ? `Ansatz CHF ${chf(m.ansatz_rappen)}/Std.` : 'Kein Ansatz'}</small></div>
          <div class="aktionen">${m.aktiv ? `<button class="btn klein" data-link="${m.id}">Link senden</button>` : ''}<span class="betrag" style="min-width:56px">${std(min)}</span></div></div>`; }).join('')}</div>
      <p class="hinweis abstand">Die Stunden rechts gelten für ${MONATE[new Date().getMonth()]}. Verlässt jemand die Firma, stellen Sie ihn auf „inaktiv“: Der Link funktioniert dann nicht mehr, die Stunden bleiben erhalten.</p>`;
  }

  /* ---------- Aufträge ---------- */
  const STATUS_AF = { offen: ['Offen', 'm-grau'], in_arbeit: ['In Arbeit', 'm-blau'], erledigt: ['Erledigt', 'm-offen'], kontrolliert: ['Kontrolliert', 'm-ok'] };
  const wer = (a) => (a.zugewiesen && a.zugewiesen.length ? a.zugewiesen.map(maName).join(', ') : 'Alle Mitarbeiter');
  const zuwahl = (gewaehlt = []) => `<div style="display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px">${Z.mitarbeiter.filter((m) => m.aktiv || gewaehlt.includes(m.id)).map((m) => `<label style="display:flex;gap:6px;align-items:center;font-size:14px;color:var(--tinte)"><input type="checkbox" name="zu" value="${m.id}" ${gewaehlt.includes(m.id) ? 'checked' : ''}>${esc(m.name)}${m.rolle === 'projektleiter' ? ' <small class="hinweis">(PL)</small>' : ''}</label>`).join('') || '<span class="hinweis">Noch keine Mitarbeiter erfasst.</span>'}</div>
      <p class="hinweis" style="margin-top:4px">Niemand angehakt = alle Mitarbeiter sehen den Auftrag. Projektleiter sehen immer alle.</p>`;
  const ordnerTeile = (o) => String(o || '').split('/').map((x) => x.trim()).filter(Boolean);
  function auftraege() {
    const sicht = Z.auftraege.filter((a) => (Z.afArchiv ? !a.aktiv : a.aktiv) && (!Z.afWer || (Z.afWer === 'alle' ? !(a.zugewiesen || []).length : (a.zugewiesen || []).includes(Z.afWer))));
    const pfad = ordnerTeile(Z.afOrdner || ''), tiefe = pfad.length, praefix = pfad.join('/');
    const imPfad = sicht.filter((a) => { const o = ordnerTeile(a.ordner); return o.slice(0, tiefe).join('/') === praefix; });
    const unter = {}; for (const a of imPfad) { const o = ordnerTeile(a.ordner); if (o.length > tiefe) (unter[o[tiefe]] = unter[o[tiefe]] || []).push(a); }
    const hier = imPfad.filter((a) => ordnerTeile(a.ordner).length === tiefe);
    const offenStd = (l) => Z.eintraege.filter((e) => l.some((a) => a.id === e.auftrag_id) && !e.verrechnet).reduce((s, e) => s + e.minuten, 0);
    return `<div class="kopf"><div><h1>Aufträge</h1><p class="unter">In Ordnern wie auf dem Computer, z. B. Projekte › Zürich › Adresse. Mit Fotos, Stunden und Material.</p></div>
        <div class="aktionen"><button class="btn" data-a="afArchiv">${Z.afArchiv ? 'Offene zeigen' : `Archiv (${Z.auftraege.filter((a) => !a.aktiv).length})`}</button><button class="btn" data-a="korb">Zuletzt gelöscht</button><button class="btn" data-a="ordnerNeu">+ Ordner</button><button class="btn haupt" data-a="afNeu">+ Auftrag</button></div></div>
      <div class="card">
        <div class="aktionen" style="margin-bottom:8px;font-size:14px"><button class="btn klein" data-af-ordner="">🏠 Alle</button>${pfad.map((n, i) => `<span>›</span><button class="btn klein" data-af-ordner="${esc(pfad.slice(0, i + 1).join('/'))}">${esc(n)}</button>`).join('')}
          <span style="flex:1"></span><select data-f="afWer" aria-label="Nach Mitarbeiter filtern" style="font-size:14px"><option value="">Alle Aufträge</option><option value="alle" ${Z.afWer === 'alle' ? 'selected' : ''}>Für alle sichtbar</option>${Z.mitarbeiter.filter((m) => m.aktiv).map((m) => `<option value="${m.id}" ${Z.afWer === m.id ? 'selected' : ''}>Zugewiesen: ${esc(m.name)}</option>`).join('')}</select>
          ${imPfad.length ? `<button class="btn klein" data-a="ordnerZuweisen">${tiefe ? 'Ordner zuweisen' : 'Alle zuweisen'}</button>` : ''}</div>
        ${Object.keys(unter).sort((a, b) => a.localeCompare(b)).map((n) => { const l = unter[n], o = offenStd(l); return `<div class="zeile klick" data-af-ordner="${esc([...pfad, n].join('/'))}"><div style="min-width:0"><b>📁 ${esc(n)}</b><small>${l.length} ${l.length === 1 ? 'Auftrag' : 'Aufträge'} · ${l.filter((a) => a.status === 'erledigt' || a.status === 'kontrolliert').length} erledigt</small></div><div class="aktionen">${o ? `<span class="marke-s m-offen">${std(o)} offen</span>` : ''}<span style="color:var(--leise)">›</span></div></div>`; }).join('')}
        ${hier.map((a) => { const l = Z.eintraege.filter((e) => e.auftrag_id === a.id); const offen = l.filter((e) => !e.verrechnet).reduce((s, e) => s + e.minuten, 0);
          return `<div class="zeile klick" data-af="${a.id}"><div style="min-width:0"><b>${esc(a.name)}<span class="marke-s ${STATUS_AF[a.status || 'offen'][1]}">${STATUS_AF[a.status || 'offen'][0]}</span>${a.aktiv ? '' : '<span class="marke-s m-grau">archiviert</span>'}</b><small>👤 ${esc(wer(a))} · ${esc([a.kunde, a.adresse].filter(Boolean).join(' · ') || 'Ohne Kunde')} · total ${std(l.reduce((s, e) => s + e.minuten, 0))} Std.</small></div>
            <div class="aktionen">${offen ? `<button class="btn klein" data-af-offen="${a.id}">${std(offen)} offen</button>` : ''}</div></div>`; }).join('')}
        ${!Object.keys(unter).length && !hier.length ? `<p class="leer">${tiefe ? 'Dieser Ordner ist noch leer. Legen Sie mit „+ Auftrag“ den ersten Auftrag darin an.' : 'Noch keine Aufträge. Erstellen Sie Ordner, zum Beispiel „Projekte“, darin „Zürich“, und darin die Adressen als Aufträge.'}</p>` : ''}
      </div>
      <div class="info-box abstand"><b>So arbeiten Sie am einfachsten:</b> Aufträge in Ordnern sind der Standard: Mitarbeiter finden sie auf dem Handy im gleichen Ordner, machen Fotos und melden „Erledigt“. Projektleiter kontrollieren und setzen „Kontrolliert“.
        <br>Die <b>Option</b> dazu ist der <button class="link" data-tab="plan" style="background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;padding:0;font:inherit">Einsatzplan</button>: ein Kalender, in dem Sie Mitarbeitern Termine mit Infos zuweisen.</div>`;
  }

      else minuten = Math.round(Number(String(d.get('dauer')).replace(',', '.')) * 60);

  // Fotos vor dem Hochladen verkleinern (spart Speicher und Datenvolumen)
  function fotoKlein(datei) {
    return new Promise((ok) => { const img = new Image(); img.onload = () => { const s = Math.min(1, 1800 / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = img.width * s; c.height = img.height * s; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); c.toBlob((b) => ok(b || datei), 'image/jpeg', .82); URL.revokeObjectURL(img.src); }; img.onerror = () => ok(datei); img.src = URL.createObjectURL(datei); });
  }

  /* ---------- Rechnung, Lohn, Rapport, CSV ---------- */
  async function inRechnung() {
    const l = Z.eintraege.filter((e) => Z.wahl.has(e.id)).sort((a, b) => (a.datum > b.datum ? 1 : -1));
    if (!l.length) return;
    const ohneAnsatz = [...new Set(l.filter((e) => !ma(e.mitarbeiter_id).ansatz_rappen).map((e) => maName(e.mitarbeiter_id)))];
    // Eine Position pro Mitarbeiter und Tätigkeit; Datum im Text, damit der Kunde nachvollziehen kann
    const gruppen = new Map();
    for (const e of l) {
      const k = e.mitarbeiter_id + '|' + (e.taetigkeit || '').toLowerCase();
      if (!gruppen.has(k)) gruppen.set(k, { ma: ma(e.mitarbeiter_id), taetigkeit: e.taetigkeit, tage: [], minuten: 0 });
      const g = gruppen.get(k); g.minuten += e.minuten; if (!g.tage.includes(e.datum)) g.tage.push(e.datum);
    }
    const positionen = [...gruppen.values()].map((g) => ({
      text: `${g.taetigkeit || 'Arbeit'} (${g.ma.name || 'Mitarbeiter'}, ${g.tage.map(dkurz).join(' ')})`,
      menge: String(stdDez(g.minuten)), preis: g.ma.ansatz_rappen ? (g.ma.ansatz_rappen / 100).toFixed(2) : '',
    }));
    const km = l.reduce((s, e) => s + Number(e.km || 0), 0);
    if (km) positionen.push({ text: `Fahrspesen ${km} km`, menge: String(km), preis: '0.70' });
    const af = [...new Set(l.map((e) => e.auftrag_id).filter(Boolean))].map(auftrag).filter(Boolean);
    // Material aus dem Lager, das für diese Aufträge verbraucht und noch nicht verrechnet wurde
    let material = [];
    if (af.length) {
      const r = await sb.from('lg_bewegungen').select('id,menge,artikel_id,lg_artikel(name,nummer,verkauf_rappen,einheit)').in('auftrag_id', af.map((a) => a.id)).eq('art', 'ausgang').eq('verrechnet', false);
      if (!r.error) material = r.data || [];
      const proArtikel = new Map();
      for (const m of material) { const x = proArtikel.get(m.artikel_id) || { a: m.lg_artikel || {}, menge: 0 }; x.menge += Math.abs(Number(m.menge)); proArtikel.set(m.artikel_id, x); }
      for (const { a, menge } of proArtikel.values()) positionen.push({ text: (a.name || 'Material') + (a.nummer ? ` (${a.nummer})` : ''), menge: String(Math.round(menge * 100) / 100), preis: a.verkauf_rappen ? (a.verkauf_rappen / 100).toFixed(2) : '' });
    }
    if (!await UI.frage(`${positionen.length} ${positionen.length === 1 ? 'Position' : 'Positionen'} (${std(l.reduce((s, e) => s + e.minuten, 0))} Std.) in eine neue Rechnung übernehmen?\n\n${material.length ? `\nDazu ${material.length} Material-Bezüge aus dem Lager.` : ''}\n\nDie Einträge werden als verrechnet markiert.${ohneAnsatz.length ? `\n\nOhne Ansatz: ${ohneAnsatz.join(', ')}. Den Preis tragen Sie in der Rechnung ein.` : ''}`)) return;
    const { error } = await sb.from('ze_eintraege').update({ verrechnet: true }).in('id', l.map((e) => e.id));
    if (error) { toast(fehlerText(error), 6000); return; }
    if (material.length) await sb.from('lg_bewegungen').update({ verrechnet: true }).in('id', material.map((m) => m.id));
    try { sessionStorage.setItem('ordasio.zeit.rechnung', JSON.stringify({ positionen, projekt: af.map((a) => a.name).join(', '), kunde: af.length === 1 ? af[0].kunde : '' })); } catch {}
    location.href = '../rechnungen/';
  }

  function rapport() {
    const l = gefiltert().slice().sort((a, b) => (a.datum + (a.von || '') > b.datum + (b.von || '') ? 1 : -1));
    if (!l.length) { toast('Keine Einträge für diese Auswahl'); return; }
    const firma = (window.NASUVIA_LIZENZ && (window.NASUVIA_LIZENZ.firma || window.NASUVIA_LIZENZ.name)) || '';
    const wer = Z.fMa ? maName(Z.fMa) : 'Alle Mitarbeiter';
    const was = Z.fAuftrag ? (Z.fAuftrag === 'ohne' ? 'Ohne Auftrag' : auftragText(Z.fAuftrag)) : '';
    $('rapport').innerHTML = `<h1>Stundenrapport ${esc(monatName(Z.monat))}</h1>
      <p>${esc(firma)}${firma ? ' · ' : ''}${esc(wer)}${was ? ' · ' + esc(was) : ''}</p>
      <table><thead><tr><th>Datum</th>${Z.fMa ? '' : '<th>Mitarbeiter</th>'}<th>Zeit</th><th>Auftrag / Tätigkeit</th><th class="r">km</th><th class="r">Stunden</th></tr></thead><tbody>
      ${l.map((e) => `<tr><td>${wt(e.datum)} ${dk(e.datum)}</td>${Z.fMa ? '' : `<td>${esc(maName(e.mitarbeiter_id))}</td>`}<td>${e.von && e.bis ? e.von.slice(0, 5) + '–' + e.bis.slice(0, 5) + (e.pause_min ? `<br><small>${e.pause_min} Min. Pause</small>` : '') : ''}</td><td>${esc([auftragText(e.auftrag_id), e.taetigkeit].filter(Boolean).join(' · '))}</td><td class="r">${Number(e.km) || ''}</td><td class="r">${std(e.minuten)}</td></tr>`).join('')}
      </tbody><tfoot><tr><td colspan="${Z.fMa ? 3 : 4}">Total</td><td class="r">${l.reduce((s, e) => s + Number(e.km || 0), 0) || ''}</td><td class="r">${std(l.reduce((s, e) => s + e.minuten, 0))}</td></tr></tfoot></table>
      <div class="unterschrift"><div>Datum, Unterschrift Mitarbeiter</div><div>Datum, Unterschrift ${Z.fAuftrag && Z.fAuftrag !== 'ohne' ? 'Kunde' : 'Arbeitgeber'}</div></div>`;
    window.print();
  }
  function csv() {
    const l = gefiltert();
    const zellen = [['Datum', 'Mitarbeiter', 'Von', 'Bis', 'Pause (Min.)', 'Stunden', 'Auftrag', 'Kunde', 'Tätigkeit', 'km', 'Verrechnet']]
      .concat(l.map((e) => [e.datum, maName(e.mitarbeiter_id), (e.von || '').slice(0, 5), (e.bis || '').slice(0, 5), e.pause_min, String(stdDez(e.minuten)), (auftrag(e.auftrag_id) || {}).name || '', (auftrag(e.auftrag_id) || {}).kunde || '', e.taetigkeit, e.km, e.verrechnet ? 'ja' : 'nein']));
    const text = '﻿' + zellen.map((z) => z.map((x) => `"${String(x ?? '').replace(/"/g, '""')}"`).join(';')).join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' })); a.download = `Zeiterfassung ${Z.monat}.csv`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

  /* ---------- Bedienung ---------- */
  document.addEventListener('click', async (ev) => {
    const t = ev.target;
    const tab = t.closest('[data-tab]');
    if (tab) { Z.tab = tab.dataset.tab; try { sessionStorage.setItem('ze.tab', Z.tab); } catch {} zeichnen(); window.scrollTo(0, 0); return; }
    if (t.matches('[data-wahl]')) { t.checked ? Z.wahl.add(t.dataset.wahl) : Z.wahl.delete(t.dataset.wahl); zeichnen(); return; }
    const kop = t.closest('[data-kopieren]');
    if (kop) { try { await navigator.clipboard.writeText(kop.dataset.kopieren); toast('Link kopiert'); } catch { dlg.querySelector('.link-feld input').select(); } return; }
    const nl = t.closest('[data-neuer-link]');
    if (nl) {
      if (!await UI.frage('Neuen Link erstellen? Der alte Link funktioniert danach nicht mehr.')) return;
      const r = await sb.from('ze_mitarbeiter').update({ token: neuerSchluessel() }).eq('id', nl.dataset.neuerLink).select().single();
      if (r.error) { toast(fehlerText(r.error)); return; }
      await stammLaden(); linkDialog(r.data); toast('Neuer Link erstellt'); return;
    }
    const li = t.closest('[data-link]'); if (li) { ev.stopPropagation(); linkDialog(ma(li.dataset.link)); return; }
    const afo = t.closest('[data-af-offen]'); if (afo) { if (dlg.open) dlg.close(); Z.tab = 'eintraege'; Z.fAuftrag = afo.dataset.afOffen; Z.fStatus = 'offen'; Z.fMa = '';
      const l = Z.eintraege.filter((e) => e.auftrag_id === Z.fAuftrag && !e.verrechnet); if (l.length) Z.monat = l[0].datum.slice(0, 7);
      Z.wahl = new Set(l.filter((e) => e.datum.slice(0, 7) === Z.monat).map((e) => e.id)); zeichnen(); return; }
    const mw = t.closest('[data-ma-woche]'); if (mw) { Z.tab = 'eintraege'; Z.fMa = mw.dataset.maWoche; Z.fStatus = 'alle'; Z.monat = Z.woche.slice(0, 7); zeichnen(); return; }
    if (t.closest('[data-stopp]')) return;
    const ao = t.closest('[data-af-ordner]'); if (ao && !t.closest('dialog')) { Z.afOrdner = ao.dataset.afOrdner; zeichnen(); return; }
    const fp = t.closest('[data-foto-pruefen]'); if (fp) { await Korb.aendern(sb, 'ze_fotos', fp.dataset.fotoPruefen, { geprueft: fp.dataset.wert === '1' }, fp.dataset.wert === '1' ? 'Foto geprüft' : 'Prüfung entfernt'); fotosZeigen(dlg.querySelector('form').dataset.formAf); return; }
    const fw = t.closest('[data-foto-weg]'); if (fw) { if (await Korb.loeschen(sb, 'ze_fotos', fw.dataset.fotoWeg, 'Foto')) fotosZeigen(dlg.querySelector('form').dataset.formAf); return; }
    const pm = t.closest('[data-plan-modus]'); if (pm) { Z.planModus = pm.dataset.planModus; try { localStorage.setItem('ze.planModus', Z.planModus); } catch {} if (Z.planModus === 'monat') Z.planWoche = monatsStart(Z.planWoche); else Z.planWoche = montag(Z.planWoche); await eintraegeLaden(); zeichnen(); return; }
    const pma = t.closest('[data-plan-ma]'); if (pma) { Z.planMa = pma.dataset.planMa; zeichnen(); return; }
    const pn = t.closest('[data-plan-neu]'); if (pn) { einsatzDialog({ datum: pn.dataset.planNeu }); return; }
    const pw = t.closest('[data-plan-woche]'); if (pw) { Z.planModus = 'woche'; Z.planWoche = montag(pw.dataset.planWoche); await eintraegeLaden(); zeichnen(); return; }
    if (t.closest('[data-stopp]')) return;
    const es = t.closest('[data-einsatz]'); if (es && !t.closest('dialog')) { einsatzDialog(Z.einsaetze.find((s) => s.id === es.dataset.einsatz)); return; }
    const ein = t.closest('[data-eintrag]'); if (ein && !t.closest('dialog') && !t.matches('input')) { eintragDialog(Z.eintraege.find((e) => e.id === ein.dataset.eintrag)); return; }
    const m = t.closest('[data-ma]'); if (m && !t.closest('dialog')) { maDialog(ma(m.dataset.ma)); return; }
    const af = t.closest('[data-af]'); if (af && !t.closest('dialog')) { afDialog(auftrag(af.dataset.af)); return; }
    const a = t.closest('[data-a]'); if (!a) return;
    const form = a.closest('form');
    switch (a.dataset.a) {
      case 'zu': dlg.close(); break;
      case 'neuLaden': allesLaden(); break;
      case 'maNeu': maDialog(); break;
      case 'afNeu': afDialog(); break;
      case 'eintragNeu': eintragDialog(); break;
      case 'einsatzNeu': einsatzDialog(); break;
      case 'planZurueck': Z.planWoche = Z.planModus === 'monat' ? monatsStart(plusTage(monatsStart(Z.planWoche), -1)) : plusTage(Z.planWoche, -7); await eintraegeLaden(); zeichnen(); break;
      case 'planVor': Z.planWoche = Z.planModus === 'monat' ? monatsStart(plusTage(monatsStart(Z.planWoche), 32)) : plusTage(Z.planWoche, 7); await eintraegeLaden(); zeichnen(); break;
      case 'planHeute': Z.planWoche = Z.planModus === 'monat' ? monatsStart(heute()) : montag(heute()); await eintraegeLaden(); zeichnen(); break;
      case 'einsatzLoeschen': {
        const es0 = Z.einsaetze.find((s) => s.id === form.dataset.formEinsatz) || {};
        if (!await Korb.loeschen(sb, 'ze_einsaetze', form.dataset.formEinsatz, `Einsatz ${maName(es0.mitarbeiter_id)} am ${dk(es0.datum || '')}`)) break;
        dlg.close(); await eintraegeLaden(); zeichnen(); toast('Gelöscht'); break;
      }
      case 'lohn': lohnDialog(); break;
      case 'korb': Korb.oeffnen(sb, KORB, async () => { await stammLaden(); await eintraegeLaden(); zeichnen(); }); break;
      case 'startAnpassen': startAnpassen(); break;
      case 'afArchiv': Z.afArchiv = !Z.afArchiv; zeichnen(); break;
      case 'ordnerZuweisen': {
        const pfad = ordnerTeile(Z.afOrdner || ''), p = pfad.join('/');
        const l = Z.auftraege.filter((x) => (Z.afArchiv ? !x.aktiv : x.aktiv) && ordnerTeile(x.ordner).slice(0, pfad.length).join('/') === p);
        const f = dialog(`<h3>${pfad.length ? `Ordner „${esc(pfad.join(' › '))}“ zuweisen` : 'Alle Aufträge zuweisen'}</h3>
          <p class="hinweis">Gilt für ${l.length} ${l.length === 1 ? 'Auftrag' : 'Aufträge'} in diesem Ordner und allen Unterordnern.</p>
          <div><span class="hinweis">Wer soll sie sehen?</span>${zuwahl([])}</div>
          <div class="fuss"><span></span><span class="aktionen"><button type="button" class="btn" data-a="zu">Abbrechen</button><button class="btn haupt">Zuweisen</button></span></div>`);
        f.onsubmit = async (e2) => {
          e2.preventDefault();
          const zu = new FormData(f).getAll('zu');
          const { error } = await Korb.aendern(sb, 'ze_auftraege', l.map((x) => x.id), { zugewiesen: zu }, 'Aufträge zugewiesen');
          if (error) { toast(fehlerText(error)); return; }
          dlg.close(); await stammLaden(); zeichnen(); toast(zu.length ? `${l.length} Aufträge zugewiesen an ${zu.map(maName).join(', ')}` : `${l.length} Aufträge für alle sichtbar`);
        };
        break;
      }
      case 'ordnerNeu': { const n = await UI.eingabe('Name des neuen Ordners' + (Z.afOrdner ? ` in „${Z.afOrdner.split('/').join(' › ')}“` : '')); if (n && n.trim()) { Z.afOrdner = [...ordnerTeile(Z.afOrdner), n.trim().replace(/\//g, '-')].join('/'); zeichnen(); toast('Ordner geöffnet. Jetzt den ersten Auftrag anlegen.'); } break; }
      case 'afEinsatz': { const id = form.dataset.formAf; dlg.close(); setTimeout(() => einsatzDialog({ auftrag_id: id, adresse: (auftrag(id) || {}).adresse || '' }), 50); break; }
      case 'rapport': rapport(); break;
      case 'csv': csv(); break;
      case 'rechnung': inRechnung(); break;
      case 'wocheZurueck': Z.woche = plusTage(Z.woche, -7); await eintraegeLaden(); zeichnen(); break;
      case 'wocheVor': Z.woche = plusTage(Z.woche, 7); await eintraegeLaden(); zeichnen(); break;
      case 'wocheHeute': Z.woche = montag(heute()); await eintraegeLaden(); zeichnen(); break;
      case 'alleWaehlen': { const l = gefiltert(); Z.wahl = a.checked ? new Set(l.map((e) => e.id)) : new Set(); zeichnen(); break; }
      case 'verrechnet': {
        const ids = [...Z.wahl], alle = Z.eintraege.filter((e) => Z.wahl.has(e.id)).every((e) => e.verrechnet);
        const { error } = await Korb.aendern(sb, 'ze_eintraege', ids, { verrechnet: !alle }, alle ? 'Wieder offen' : 'Als verrechnet markiert');
        if (error) { toast(fehlerText(error)); break; }
        Z.wahl.clear(); await eintraegeLaden(); zeichnen(); toast(alle ? 'Wieder als offen markiert' : 'Als verrechnet markiert'); break;
      }
      case 'loeschenGew': {
        if (!await Korb.loeschen(sb, 'ze_eintraege', [...Z.wahl], `${Z.wahl.size} ${Z.wahl.size === 1 ? 'Eintrag' : 'Einträge'}`)) break;
        Z.wahl.clear(); await eintraegeLaden(); zeichnen(); toast('Gelöscht'); break;
      }
      case 'eintragLoeschen': {
        const e0 = Z.eintraege.find((x) => x.id === form.dataset.formEintrag) || {};
        if (!await Korb.loeschen(sb, 'ze_eintraege', form.dataset.formEintrag, `Eintrag ${maName(e0.mitarbeiter_id)} am ${dk(e0.datum || '')}`)) break;
        dlg.close(); await eintraegeLaden(); zeichnen(); toast('Gelöscht'); break;
      }
      case 'maLoeschen': {
        if (!await Korb.loeschen(sb, 'ze_mitarbeiter', form.dataset.formMa, maName(form.dataset.formMa), { aktiv: false })) break;
        dlg.close(); await stammLaden(); await eintraegeLaden(); zeichnen(); toast('Gelöscht'); break;
      }
      case 'afLoeschen': {
        if (!await Korb.loeschen(sb, 'ze_auftraege', form.dataset.formAf, (auftrag(form.dataset.formAf) || {}).name || 'Auftrag')) break;
        dlg.close(); await stammLaden(); await eintraegeLaden(); zeichnen(); toast('Gelöscht'); break;
      }
    }
  });
  document.addEventListener('change', async (ev) => {
    if (ev.target.matches && ev.target.matches('[data-zeit-an]')) {
      const an = ev.target.checked, uid = (await sb.auth.getUser()).data.user.id;
      const { error } = await sb.from('ze_konfig').upsert({ user_id: uid, zeit_erfassen: an, geaendert: new Date().toISOString() });
      if (error) { toast(fehlerText(error)); ev.target.checked = !an; return; }
      Z.zeitAn = an;
      if (window.Rueckgaengig) Rueckgaengig.zeigen(an ? 'Arbeitszeit wird erfasst' : 'Ohne Zeiterfassung', async () => { await sb.from('ze_konfig').upsert({ user_id: uid, zeit_erfassen: !an, geaendert: new Date().toISOString() }); Z.zeitAn = !an; zeichnen(); }); return;
    }
    const fi = ev.target.closest && ev.target.closest('[data-af-foto]');
    if (fi && fi.files.length) {
      const uid = (await sb.auth.getUser()).data.user.id, auftragId = fi.dataset.afFoto;
      for (const datei of fi.files) {
        const klein = await fotoKlein(datei);
        const pfad = `${uid}/${auftragId}/${crypto.randomUUID()}.jpg`;
        const up = await sb.storage.from('auftrag-fotos').upload(pfad, klein, { contentType: 'image/jpeg' });
        if (up.error) { toast(fehlerText(up.error)); break; }
        await sb.from('ze_fotos').insert({ auftrag_id: auftragId, pfad });
      }
      fotosZeigen(auftragId); toast('Foto gespeichert'); return;
    }
    const t = ev.target;
    if (t.dataset.f) {
      Z[t.dataset.f] = t.value || (t.dataset.f === 'monat' ? heute().slice(0, 7) : '');
      Z.wahl.clear();
      if (t.dataset.f === 'monat') await eintraegeLaden();
      zeichnen();
    }
  });

  navZeichnen();
  // Erst laden, wenn jemand angemeldet ist; die Lizenzprüfung legt sich sonst ohnehin darüber
  (async function warten(n = 0) {
    const { data: { session } } = await sb.auth.getSession();
    if (session) allesLaden(); else if (n < 600) setTimeout(() => warten(n + 1), 500);
  })();
})();
</script>
</body>
</html>
