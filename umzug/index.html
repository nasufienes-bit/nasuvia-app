<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ordasio · Daten übernehmen</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F4FAF6;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color:#0A1F17;padding:20px;box-sizing:border-box}
  .k{max-width:420px;background:#fff;border-radius:22px;padding:28px 24px;box-shadow:0 20px 50px -30px rgba(10,31,23,.45);text-align:center}
  h1{font-size:1.3rem;margin:0 0 8px}p{margin:0;color:#3F5A4F}
</style>
</head>
<body>
<div class="k"><h1 id="t">Daten werden übernommen …</h1><p id="p">Einen Moment bitte.</p></div>
<script>
// Gegenstück zu app.nasuvia.ch: nimmt die im Browser gespeicherten Daten der alten Adresse entgegen.
// Vorhandene Daten an der neuen Adresse werden nie überschrieben, nur ergänzt.
(function () {
  var ALT = 'https://app.nasuvia.ch';
  var q = new URLSearchParams(location.search), ziel = q.get('ziel') || '/start/';
  if (ziel.charAt(0) !== '/' || ziel.charAt(1) === '/') ziel = '/start/';
  var weiter = function () { location.replace(ziel); };
  var $ = function (id) { return document.getElementById(id); };
  if (!window.opener) { $('t').textContent = 'Nichts zu übernehmen'; setTimeout(weiter, 800); return; }

  function dbSchreiben(d) {
    return new Promise(function (ok) {
      var r = indexedDB.open(d.name, d.version || 1);
      r.onupgradeneeded = function () {
        var db = r.result;
        d.stores.forEach(function (s) {
          var os = db.objectStoreNames.contains(s.name) ? r.transaction.objectStore(s.name)
            : db.createObjectStore(s.name, Object.assign({ autoIncrement: !!s.autoIncrement }, s.keyPath != null ? { keyPath: s.keyPath } : {}));
          (s.indexe || []).forEach(function (i) { if (!os.indexNames.contains(i.name)) os.createIndex(i.name, i.keyPath, { unique: i.unique, multiEntry: i.multiEntry }); });
        });
      };
      r.onerror = function () { ok(0); };
      r.onsuccess = function () {
        var db = r.result, namen = d.stores.map(function (s) { return s.name; }).filter(function (n) { return db.objectStoreNames.contains(n); });
        if (!namen.length) { db.close(); return ok(0); }
        var t = db.transaction(namen, 'readwrite'), n = 0;
        d.stores.forEach(function (s) {
          if (namen.indexOf(s.name) < 0) return;
          var os = t.objectStore(s.name);
          (s.werte || []).forEach(function (w, i) {
            var add = s.keyPath != null ? os.add(w) : os.add(w, s.schluessel[i]);
            add.onsuccess = function () { n++; };
            add.onerror = function (e) { e.preventDefault(); e.stopPropagation(); }; // schon vorhanden: nicht überschreiben
          });
        });
        t.oncomplete = function () { db.close(); ok(n); };
        t.onerror = function (e) { e.preventDefault(); };
        t.onabort = function () { db.close(); ok(n); };
      };
    });
  }

  window.addEventListener('message', async function (e) {
    if (e.origin !== ALT || !e.data || e.data.typ !== 'ordasio-umzug') return;
    var n = 0;
    try {
      Object.keys(e.data.ls || {}).forEach(function (k) { if (localStorage.getItem(k) === null) { localStorage.setItem(k, e.data.ls[k]); n++; } });
      for (var i = 0; i < (e.data.dbs || []).length; i++) n += await dbSchreiben(e.data.dbs[i]);
      localStorage.setItem('ordasio.umgezogen', new Date().toISOString());
    } catch (x) { $('p').textContent = 'Ein Teil konnte nicht übernommen werden: ' + x.message; }
    try { window.opener.postMessage({ typ: 'umzug-fertig', anzahl: n }, ALT); } catch (x) {}
    $('t').textContent = '✓ Übernommen';
    $('p').textContent = n + ' Einträge sind jetzt unter app.ordasio.ch. Bitte melden Sie sich einmal neu an, falls verlangt.';
    setTimeout(weiter, 1500);
  });
  window.opener.postMessage({ typ: 'umzug-bereit' }, ALT);
  setTimeout(function () { if ($('t').textContent.indexOf('✓') < 0) { $('t').textContent = 'Keine Antwort von der alten Adresse'; $('p').textContent = 'Sie können Ordasio trotzdem normal benutzen.'; setTimeout(weiter, 2500); } }, 15000);
})();
</script>
</body>
</html>
