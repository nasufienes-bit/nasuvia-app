<!doctype html>
<html lang="de-CH">
<head>
<script src="../ikonen.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<script src="../stabil.js"></script>
<link rel="icon" type="image/png" href="../favicon.png" />
<title>Treuhänder-Zugang</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#F4FAF6" />
<link rel="apple-touch-icon" href="../icon-180.png" />
<link rel="stylesheet" href="../schrift.css" />
<script src="../konfig.js"></script>
<script src="../postfach.js"></script>

<style>
:root{--papier:#F4FAF6;--flaeche:#E8F4EE;--karte:#fff;--tinte:#0A1F17;--text:#3F5A4F;--leise:#7C8499;--blau:#0B3B2E;--elektrik:#0E7A55;--gruen:#0E9F6E;--rot:#E5484D;--linie:color-mix(in srgb,var(--blau,#0B3B2E) 14%,transparent);--schatten:0 1px 2px rgba(12,18,38,.04),0 14px 34px -22px color-mix(in srgb,var(--blau,#0B3B2E) 40%,transparent);--display:'League Spartan',-apple-system,system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;--unten:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.5 var(--display);background:var(--papier);color:var(--tinte);min-height:100vh;padding-bottom:calc(80px + var(--unten))}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer}
.kopfzeile{position:sticky;top:0;z-index:20;background:rgba(247,249,253,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
.kopfzeile .wrap{display:flex;align-items:center;gap:12px;height:62px}
.kopfzeile .nv-knopf{margin-right:4px}
.marke{display:flex;align-items:center;gap:8px;font-weight:700;font-size:19px;letter-spacing:-.02em;white-space:nowrap}
.marke i{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--blau),var(--elektrik));display:grid;place-items:center}
.marke i svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tabs{display:none}
.tabs button{border:0;background:none;padding:8px 12px;border-radius:100px;color:var(--text);font-weight:500}
.tabs button.an{background:#fff;color:var(--blau);font-weight:600;box-shadow:var(--schatten)}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px}
main{padding:22px 0 30px}
h1{font-size:30px;letter-spacing:-.02em;line-height:1.1}
.unter{color:var(--text);margin-top:4px}
.kopf{display:flex;justify-content:space-between;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px}
.aktionen{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:100px;padding:10px 16px;font-weight:600;background:#fff;color:var(--blau);box-shadow:var(--schatten);white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.haupt{background:var(--blau);color:#fff}
.btn.klein{padding:6px 11px;font-size:13px}
.btn.rot{color:var(--rot)}
.btn:disabled{opacity:.45;cursor:default}
.raster{display:grid;gap:14px}
.r4{grid-template-columns:repeat(4,minmax(0,1fr))}.r2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:820px){.r4,.r2{grid-template-columns:1fr 1fr}.tabs{display:none}}
@media(max-width:520px){.r2{grid-template-columns:1fr}}
.card{background:var(--karte);border-radius:18px;padding:18px;box-shadow:var(--schatten)}
.card h2{font-size:17px;margin-bottom:10px}
.abstand{margin-top:14px}
.zahl .l{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--leise)}
.zahl .w{font-size:25px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.zahl .k{font-size:12.5px;color:var(--leise)}
.leer{color:var(--leise);padding:10px 0}
.hinweis{color:var(--text);font-size:13.5px}
.zeile{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--linie)}
.zeile:last-child{border-bottom:0}
.zeile b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zeile small{color:var(--leise);font-size:12.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zeile .betrag{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.zeile.klick{cursor:pointer}
.zeile.mit-wahl{grid-template-columns:auto minmax(0,1fr) auto}
.zeile input[type=checkbox]{width:18px;height:18px;accent-color:var(--blau)}
.tag-titel{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--leise);padding:14px 0 2px;display:flex;justify-content:space-between}
.marke-s{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;border-radius:100px;padding:2px 8px;margin-left:6px;vertical-align:1px}
.m-offen{background:rgba(245,181,61,.2);color:#8a5a00}.m-ok{background:rgba(14,159,110,.12);color:var(--elektrik,#0A7150)}.m-blau{background:color-mix(in srgb,var(--elektrik,#0E7A55) 10%,transparent);color:var(--blau)}.m-grau{background:var(--flaeche);color:var(--leise)}
.filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
select,input:not([type]),input[type=text],input[type=date],input[type=month],input[type=time],input[type=number],input[type=search],textarea{font:inherit;border:1px solid color-mix(in srgb,var(--blau,#0B3B2E) 26%,transparent);border-radius:10px;padding:8px 11px;background:#fff;color:var(--tinte);min-width:0}
.woche{overflow-x:auto}
.woche table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:640px}
.woche th{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--leise);font-weight:500;text-align:right;padding:8px 6px;border-bottom:1px solid var(--linie)}
.woche th:first-child,.woche td:first-child{text-align:left}
.woche td{padding:10px 6px;border-bottom:1px solid var(--linie);text-align:right}
.woche td.null{color:#C4C8D4}
.woche tr:last-child td{border-bottom:0;font-weight:700}
.woche .heute{background:color-mix(in srgb,var(--elektrik,#0E7A55) 6%,transparent)}
.woche-nav{display:inline-flex;align-items:center;gap:6px}
.woche-nav b{min-width:170px;text-align:center}
dialog{border:0;border-radius:20px;padding:0;width:min(520px,calc(100% - 20px));box-shadow:0 40px 100px -30px rgba(12,18,38,.5)}
dialog::backdrop{background:rgba(12,18,38,.35)}
.dlg{padding:20px;display:grid;gap:10px;max-height:calc(100vh - 40px);overflow:auto}
.dlg h3{font-size:20px}
.dlg label{display:grid;gap:4px;font-size:13px;color:var(--text)}
.dlg .zwei{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dlg .drei{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.dlg .fuss{display:flex;justify-content:space-between;gap:8px;margin-top:6px;flex-wrap:wrap}
.link-feld{display:flex;gap:6px}
.link-feld input{flex:1;font-family:var(--mono);font-size:12px}
.unten-nav{display:none}
@media(max-width:820px){.unten-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(247,249,253,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--linie);padding:6px 4px calc(6px + var(--unten))}
.unten-nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--leise);padding:4px 0}
.unten-nav button.an{color:var(--blau);font-weight:600}
.unten-nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--unten));transform:translate(-50%,20px);opacity:0;background:var(--tinte);color:#fff;border-radius:100px;padding:11px 18px;font-weight:600;transition:.3s;z-index:99;pointer-events:none;max-width:90vw;text-align:center}
.toast.da{transform:translate(-50%,0);opacity:1}
.start{text-align:center;padding:40px 18px}
.start .gross{width:74px;height:74px;border-radius:22px;margin:0 auto 16px;background:linear-gradient(135deg,var(--blau),var(--elektrik));display:grid;place-items:center}
.start .gross svg{width:38px;height:38px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.start h2{font-size:24px;margin-bottom:6px}
.start p{max-width:540px;margin:0 auto 18px;color:var(--text)}
.schritte{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;text-align:left;max-width:820px;margin:22px auto 0}
.schritte div{background:#fff;border-radius:16px;padding:16px;box-shadow:var(--schatten);font-size:14px;color:var(--text)}
.schritte b{display:block;color:var(--tinte);font-size:15px;margin-bottom:2px}
@media(max-width:720px){.schritte{grid-template-columns:1fr}}
.info-box{background:color-mix(in srgb,var(--elektrik,#0E7A55) 7%,transparent);border-radius:14px;padding:12px 14px;font-size:13.5px;color:var(--blau)}
.auswahl-leiste{position:sticky;bottom:calc(76px + var(--unten));z-index:15;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--tinte);color:#fff;border-radius:16px;padding:10px 12px;margin-top:12px;box-shadow:0 20px 40px -20px rgba(12,18,38,.6)}
.auswahl-leiste .btn{box-shadow:none}
@media(min-width:821px){.auswahl-leiste{bottom:16px}}
[data-suche-hier]{display:flex;margin-left:8px}@media(max-width:820px){[data-suche-hier]{margin-left:auto}}
@media(max-width:520px){.zahl .w{font-size:20px}.card{padding:14px}h1{font-size:26px}.dlg .drei{grid-template-columns:1fr 1fr}}
.tabelle{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
.tabelle th{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--leise);font-weight:500;text-align:left;padding:8px 6px;border-bottom:1px solid var(--linie)}
.tabelle td{padding:8px 6px;border-bottom:1px solid var(--linie);vertical-align:top}
.tabelle .r{text-align:right;white-space:nowrap}
.tabelle tr.summe td{font-weight:700;border-top:2px solid var(--tinte)}
.scroll{overflow-x:auto}
.login{max-width:420px;margin:40px auto}
.login label{display:grid;gap:4px;font-size:13px;color:var(--text);margin-bottom:10px}
.login input{width:100%;font-size:16px}
.mandat{display:flex;justify-content:space-between;align-items:center;gap:10px}
.segment{display:inline-flex;background:var(--flaeche);border-radius:100px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.segment button{border:0;background:none;border-radius:100px;padding:7px 13px;color:var(--text);white-space:nowrap}
.segment button.an{background:#fff;color:var(--blau);font-weight:600;box-shadow:0 2px 8px rgba(12,18,38,.08)}

.nur-lesen{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;background:color-mix(in srgb,var(--elektrik,#0E7A55) 10%,transparent);color:var(--blau);border-radius:100px;padding:3px 9px;margin-left:8px;vertical-align:4px}
/* Treuhänder-Werkzeuge */
.mandat-karte{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--linie);cursor:pointer}
.mandat-karte:last-child{border-bottom:0}
.mandat-karte b{font-size:16px}
.mandat-karte small{color:var(--leise);font-size:12.5px}
.pendenz{border-radius:14px;padding:12px 14px;background:#fff;box-shadow:var(--schatten);margin-bottom:10px}
.pendenz summary{display:flex;gap:10px;align-items:center;cursor:pointer;list-style:none;font-weight:600}
.pendenz summary::-webkit-details-marker{display:none}
.pendenz .zahlpunkt{min-width:28px;height:28px;padding:0 6px;border-radius:9px;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;background:#B7791F}
.pendenz.ok .zahlpunkt{background:var(--gruen)}
.pendenz.info .zahlpunkt{background:var(--elektrik)}
.pendenz p{font-size:13.5px;color:var(--text);margin:6px 0}
.pendenz .zeile{padding:8px 0}
.frage{border-left:3px solid #F5B53D;padding:10px 12px;background:#fff;border-radius:0 12px 12px 0;margin-bottom:8px;box-shadow:var(--schatten)}
.frage.beantwortet{border-left-color:var(--elektrik)}.frage.erledigt{border-left-color:var(--linie);opacity:.75}
.frage .antwort{background:var(--flaeche);border-radius:10px;padding:8px 10px;margin-top:6px;font-size:14px}
.kontolink{color:var(--elektrik);cursor:pointer;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--elektrik,#0E7A55) 35%,transparent)}
details>summary.btn{list-style:none;cursor:pointer}details>summary.btn::-webkit-details-marker{display:none}
@media print{body > *:not(main){display:none!important}main .aktionen,main .segment,.export,[data-frage-b],[data-frage-sammel]{display:none!important}.card,.pendenz{box-shadow:none;border:1px solid #ddd}}
</style>
</head>
<body>
<header class="kopfzeile"><div class="wrap">
  <div class="marke"><i><svg viewBox="0 0 24 24"><path d="M12 3 4 7v5c0 4.5 3.4 8.3 8 9 4.6-.7 8-4.5 8-9V7z"/><path d="m9 12 2 2 4-4"/></svg></i>Treuhänder</div>
  <nav class="tabs" id="tabs"></nav>
</div></header>
<main class="wrap" id="inhalt"><p class="leer">Wird geladen …</p></main>
<div class="toast" id="toast"></div>
<script src="../ui.js"></script>
<script src="../navi.js" data-hier="treuhand" data-einfuegen=".kopfzeile .wrap"></script>
<script src="../seitenleiste.js"></script>
<script src="../pakete.js"></script>
<script src="../branchen.js"></script>
<script src="../doppelt.js"></script>
<script>
(() => {
  'use strict';
  const K = window.NASUVIA_KONFIG || {};
  const D = window.Doppelt, O = window.ORDASIO;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fmt = new Intl.NumberFormat('de-CH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const chf = (r) => fmt.format((r || 0) / 100);
  const dk = (d) => (d ? d.slice(8, 10) + '.' + d.slice(5, 7) + '.' + d.slice(0, 4) : '');
  const heute = () => new Date().toISOString().slice(0, 10);
  const toast = (t, ms = 2800) => { const e = $('toast'); e.textContent = t; e.classList.add('da'); clearTimeout(toast.z); toast.z = setTimeout(() => e.classList.remove('da'), ms); };
  const laden = (blob, name) => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); };
  const KAT = { material: 'Material', fremd: 'Subunternehmer und Fremdarbeiten', werkzeug: 'Werkzeug und Kleingeräte', anschaffung: 'Anschaffungen', fahrzeug: 'Fahrzeug', telefon: 'Telefon und Internet',
    software: 'Software und Abos', buero: 'Miete und Büro', werbung: 'Werbung und Website', spesen: 'Spesen und Verpflegung', weiterbildung: 'Weiterbildung', versicherung: 'Versicherungen',
    bank: 'Bank- und Kartengebühren', gebuehren: 'Gebühren und Abgaben', loehne: 'Löhne', sozial: 'Sozialversicherungen und Vorsorge', fahrten: 'Fahrten (Kilometer)', uebrig: 'Übriges',
    steuern: 'Steuern', dienstleistung: 'Dienstleistungen', materialverkauf: 'Materialverkauf', 'uebrig-ein': 'Übrige Einnahmen' };
  if (window.Branchen) for (const b of Branchen.LISTE) for (const k of b.kat) KAT[k.id] = k.name;
  const Z = { mandate: [], kunde: null, buchungen: [], journal: [], einst: {}, fragen: [], jahr: String(new Date().getFullYear()), ansicht: 'pruefen', eigeneKat: {}, konto: null, suche: '', email: '' };
  if (!K.produkt) { $('inhalt').innerHTML = '<div class="start"><h2>Treuhänder-Zugang</h2><p>Den Treuhänder-Zugang gibt es in der Verkaufsversion (Ordasio).</p></div>'; return; }
  const sb = window.supabase.createClient(K.url, K.key, { auth: { persistSession: true, autoRefreshToken: true, storageKey: K.speicher, detectSessionInUrl: true } });
  const katName = (b) => Z.eigeneKat[b.kategorie] || KAT[b.kategorie] || b.kategorie || 'Ohne Kategorie';
  const netto = (b) => (b.betragRappen || 0) - (b.mwstRappen || 0);
  const rf = () => (Z.kunde && Z.kunde.rechtsform) || Z.einst.rechtsform || 'einzel';
  const doppelt = () => !!D && ((O && O.doppelt(rf())) || !!Z.einst.doppelt);
  const plan = () => D.kontenplan(rf(), Z.einst.konten || []);
  let _e = null; const eintraege = () => (_e = _e || D.journalAus({ buchungen: Z.buchungen, journal: Z.journal, einst: Z.einst, rechtsform: rf() }));

  /* ---------- Anmelden (ohne Lizenz: der Zugang ist für Treuhänder gratis) ---------- */
  function login(meldung = '') {
    $('tabs').innerHTML = '';
    $('inhalt').innerHTML = `<div class="card login"><h2>Treuhänder-Zugang</h2>
      <p class="hinweis" style="margin-bottom:12px">Hier sehen Sie die Buchhaltung Ihrer Kunden, die Ihnen den Zugang freigegeben haben. Prüfen, Rückfragen stellen, exportieren. Gratis für Treuhänder.</p>
      <form id="login"><label>E-Mail<input name="email" type="email" autocomplete="username" required></label><label>Passwort<input name="passwort" type="password" autocomplete="current-password" required minlength="6"></label>
        <p class="hinweis" style="color:var(--rot);min-height:1.3em" id="meldung">${esc(meldung)}</p>
        <div class="aktionen"><button class="btn haupt">Anmelden</button><button type="button" class="btn" data-a="neu">Konto erstellen</button></div></form>
      <p class="hinweis abstand">Ihr Kunde gibt unter „Lizenz und Konto“ Ihre E-Mail-Adresse frei. Danach erscheint er hier.</p></div>`;
  }
  document.addEventListener('submit', async (ev) => {
    if (ev.target.id !== 'login') return;
    ev.preventDefault();
    const d = Object.fromEntries(new FormData(ev.target));
    const modus = ev.target.dataset.modus || 'anmelden';
    const r = modus === 'neu'
      ? await sb.auth.signUp({ email: d.email.trim(), password: d.passwort, options: { emailRedirectTo: location.origin + location.pathname, data: { name: d.email.trim(), firma: 'Treuhand', paket: 'kombi', zyklus: 'jahr' } } })
      : await sb.auth.signInWithPassword({ email: d.email.trim(), password: d.passwort });
    if (r.error) { $('meldung').textContent = /Invalid login/i.test(r.error.message) ? 'E-Mail oder Passwort stimmt nicht.' : /not confirmed/i.test(r.error.message) ? 'Bitte zuerst die E-Mail bestätigen.' : r.error.message; return; }
    if (modus === 'neu' && !r.data.session) {
      const em = d.email.trim();
      $('inhalt').innerHTML = `<div class="card login"><h2>Bitte bestätigen Sie Ihre E-Mail</h2>
        <p class="hinweis" style="margin-bottom:12px">Wir haben Ihnen eine Bestätigung an <b>${esc(em)}</b> geschickt. Öffnen Sie die E-Mail von Ordasio und tippen Sie auf «E-Mail-Adresse bestätigen». Danach sind Sie angemeldet.</p>
        <div class="aktionen">${window.OrdasioPostfach ? OrdasioPostfach.knoepfe(em, { haupt: 'btn haupt', zweit: 'btn' }) : ''}</div>
        <p class="hinweis abstand">Keine E-Mail da? Auch im Spam-Ordner nachsehen. Absender: noreply@ordasio.ch</p>
        <div class="aktionen abstand"><button class="btn" data-th-nochmals>Bestätigung nochmals senden</button><button class="btn" data-th-login>Zur Anmeldung</button></div><p class="hinweis" id="thMeldung"></p></div>`;
      document.querySelector('[data-th-login]').onclick = () => login();
      document.querySelector('[data-th-nochmals]').onclick = async (ev2) => { ev2.target.disabled = true; const x = await sb.auth.resend({ type: 'signup', email: em, options: { emailRedirectTo: location.origin + location.pathname } }); $('thMeldung').textContent = x.error ? 'Bitte eine Minute warten und nochmals versuchen.' : '✓ Neue E-Mail ist unterwegs.'; };
      return;
    }
    start();
  });
  document.addEventListener('click', (ev) => {
    if (ev.target.closest('[data-a=neu]')) { const f = $('login'); f.dataset.modus = 'neu'; f.querySelector('.btn.haupt').textContent = 'Konto erstellen'; f.querySelector('[name=passwort]').minLength = 8; f.querySelector('[name=passwort]').autocomplete = 'new-password'; ev.target.remove(); }
  });

  /* ---------- Mandate ---------- */
  async function start() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { login(); return; }
    Z.email = session.user.email;
    const { data, error } = await sb.rpc('tr_mandate');
    if (error) { $('inhalt').innerHTML = `<div class="card"><p class="hinweis">${esc(error.message)}</p></div>`; return; }
    Z.mandate = data || [];
    const k = new URLSearchParams(location.search).get('kunde');
    if (k && Z.mandate.some((m) => m.kunde === k)) return mandatOeffnen(k);
    liste();
  }
  const seit = (t) => { if (!t) return 'noch nichts erfasst'; const tage = Math.floor((Date.now() - new Date(t)) / 864e5); return tage <= 0 ? 'heute aktiv' : tage === 1 ? 'gestern aktiv' : `vor ${tage} Tagen aktiv`; };
  function liste() {
    Z.kunde = null; $('tabs').innerHTML = '';
    const sortiert = [...Z.mandate].sort((a, b) => (b.fragen_beantwortet || 0) - (a.fragen_beantwortet || 0) || String(b.zuletzt || '').localeCompare(String(a.zuletzt || '')));
    const offen = Z.mandate.reduce((s, m) => s + (m.fragen_beantwortet || 0), 0);
    $('inhalt').innerHTML = `<div class="kopf"><div><h1>Ihre Kunden</h1><p class="unter">Angemeldet als ${esc(Z.email)}. Sie sehen nur Kunden, die diese E-Mail-Adresse freigegeben haben.</p></div>
        <div class="aktionen"><button class="btn" data-abmelden>Abmelden</button></div></div>
      ${offen ? `<div class="info-box" style="margin-bottom:12px"><b>${offen} neue ${offen === 1 ? 'Antwort' : 'Antworten'}</b> auf Ihre Rückfragen. Die Kunden mit Antworten stehen oben.</div>` : ''}
      <div class="card">${sortiert.length ? sortiert.map((m) => `<div class="mandat-karte" data-kunde="${m.kunde}"><div style="min-width:0"><b>${esc(m.firma || m.email)}</b>
          <small>${esc([O && O.RECHTSFORMEN[m.rechtsform] ? O.RECHTSFORMEN[m.rechtsform].name : '', window.Branchen && Branchen.finde(m.branche) ? Branchen.finde(m.branche).name : '', `${m.buchungen || 0} Buchungen`, seit(m.zuletzt)].filter(Boolean).join(' · '))}</small></div>
          <div style="text-align:right">${m.fragen_beantwortet ? `<span class="marke-s m-ok">${m.fragen_beantwortet} beantwortet</span>` : ''}${m.fragen_offen ? `<span class="marke-s m-offen">${m.fragen_offen} offen</span>` : ''}<span style="color:var(--leise);margin-left:8px">›</span></div></div>`).join('')
        : '<p class="leer">Noch keine Freigaben. Bitten Sie Ihre Kunden, in Ordasio unter „Lizenz und Konto“ Ihre E-Mail-Adresse freizugeben.</p>'}</div>`;
  }
  async function mandatOeffnen(kunde) {
    Z.kunde = Z.mandate.find((m) => m.kunde === kunde);
    $('inhalt').innerHTML = '<p class="leer">Daten werden geladen …</p>';
    const alle = [];
    for (let von = 0; ; von += 1000) {
      const { data, error } = await sb.from('datensaetze').select('art,daten,geloescht').eq('user_id', kunde).in('art', ['buchungen', 'einstellungen', 'journal']).eq('geloescht', false).range(von, von + 999);
      if (error) { $('inhalt').innerHTML = `<div class="card"><p class="hinweis">${esc(error.message)}</p></div>`; return; }
      alle.push(...data); if (data.length < 1000) break;
    }
    Z.buchungen = alle.filter((z) => z.art === 'buchungen').map((z) => z.daten).filter((b) => b && b.datum && !b.geloescht);
    Z.journal = alle.filter((z) => z.art === 'journal').map((z) => z.daten).filter((j) => j && !j.geloescht);
    Z.einst = (alle.find((z) => z.art === 'einstellungen' && z.daten && z.daten.id === 'haupt') || {}).daten || {};
    Z.eigeneKat = {};
    for (const k of [...((Z.einst.kategorien || {}).aus || []), ...((Z.einst.kategorien || {}).ein || [])]) if (k && k.id && k.name) Z.eigeneKat[k.id] = k.name;
    _e = null;
    await fragenLaden();
    const jahre = [...new Set(Z.buchungen.map((b) => b.datum.slice(0, 4)))].sort().reverse();
    if (jahre.length && !jahre.includes(Z.jahr)) Z.jahr = jahre[0];
    zeichnen();
  }
  async function fragenLaden() {
    const { data } = await sb.from('tr_rueckfragen').select('*').eq('kunde', Z.kunde.kunde).order('erstellt', { ascending: false });
    Z.fragen = data || [];
  }

  /* ---------- Ansichten ---------- */
  const imJahr = () => Z.buchungen.filter((b) => b.datum.slice(0, 4) === Z.jahr).sort((a, b) => (a.datum > b.datum ? 1 : -1));
  const ansichten = () => [['pruefen', 'Prüfen'], ...(doppelt() ? [['abschluss', 'Bilanz und ER'], ['salden', 'Konten'], ['journal', 'Journal']] : [['erfolg', 'Erfolgsrechnung']]), ['mwst', 'MWST'], ['buchungen', 'Buchungen'],
    ['fragen', `Rückfragen${Z.fragen.filter((f) => f.status === 'beantwortet').length ? ' (' + Z.fragen.filter((f) => f.status === 'beantwortet').length + ')' : ''}`]];
  function zeichnen() {
    const T = ansichten();
    if (!T.some(([id]) => id === Z.ansicht)) Z.ansicht = 'pruefen';
    const jahre = [...new Set([...Z.buchungen.map((b) => b.datum.slice(0, 4)), Z.jahr])].sort().reverse();
    const rfName = O && O.RECHTSFORMEN[rf()] ? O.RECHTSFORMEN[rf()].name : '';
    $('tabs').innerHTML = T.map(([id, n]) => `<button class="${Z.ansicht === id ? 'an' : ''}" data-ansicht="${id}">${n}</button>`).join('');
    $('inhalt').innerHTML = `<div class="kopf"><div><p class="hinweis"><a href="?" data-zurueck>← Alle Kunden</a></p><h1>${esc(Z.kunde.firma || Z.kunde.email)}</h1>
        <p class="unter">${esc([rfName, doppelt() ? 'doppelte Buchhaltung' : 'einfache Buchhaltung', Z.einst.festBis ? 'festgeschrieben bis ' + dk(Z.einst.festBis) : ''].filter(Boolean).join(' · '))}</p></div>
        <div class="aktionen"><select data-jahr>${jahre.map((j) => `<option ${j === Z.jahr ? 'selected' : ''}>${j}</option>`).join('')}</select>
          <details style="position:relative"><summary class="btn">Exportieren ▾</summary><div class="card export" style="position:absolute;right:0;top:46px;z-index:30;width:250px;display:grid;gap:6px">
            <button class="btn klein" data-export="buchungen">Buchungen (CSV)</button>${doppelt() ? '<button class="btn klein" data-export="journal">Journal Soll/Haben (CSV)</button><button class="btn klein" data-export="salden">Saldenliste (CSV)</button>' : ''}
            <button class="btn klein" data-export="belege">Alle Belege ${Z.jahr} (ZIP)</button><button class="btn klein" onclick="window.print()">Drucken oder PDF</button></div></details></div></div>
      <div class="segment sl-handy" style="margin-bottom:14px">${T.map(([id, n]) => `<button class="${Z.ansicht === id ? 'an' : ''}" data-ansicht="${id}">${n}</button>`).join('')}</div>
      ${({ pruefen, abschluss, salden, journal, erfolg, mwst, buchungen, fragen })[Z.ansicht]()}`;
  }

  // Zeile einer Buchung mit Rückfrage-Knopf
  const bZeile = (b, extra = '') => `<div class="zeile"><div style="min-width:0"><b>${esc(b.text || b.partner || katName(b))}</b><small>${dk(b.datum)} · ${esc(katName(b))}${b.partner && b.text ? ' · ' + esc(b.partner) : ''}${extra ? ' · ' + extra : ''}</small></div>
    <div style="display:flex;gap:6px;align-items:center"><span class="betrag">${b.typ === 'einnahme' ? '' : '−'}${chf(b.betragRappen)}</span>${b.belegId ? `<button class="btn klein" data-beleg="${esc(b.belegId)}">Beleg</button>` : ''}<button class="btn klein" data-frage-b="${esc(b.id)}">Rückfrage</button></div></div>`;

  /* Prüfliste: was ein Treuhänder vor dem Abschluss ohnehin kontrolliert */
  function pruefen() {
    const l = imJahr(), aus = l.filter((b) => b.typ === 'ausgabe'), punkte = [];
    const p = (stufe, titel, text, liste = [], extra) => punkte.push({ stufe, titel, text, liste, extra });
    const ohneBeleg = aus.filter((b) => !b.belegId && !['lohn', 'fahrt'].includes(b.quelle) && b.kategorie !== 'loehne' && b.kategorie !== 'fahrten');
    p(ohneBeleg.length ? 'warn' : 'ok', 'Ausgaben ohne Beleg', ohneBeleg.length ? `Summe CHF ${chf(ohneBeleg.reduce((s, b) => s + (b.betragRappen || 0), 0))}. Ohne Beleg kann die Steuerverwaltung Abzüge streichen.` : 'Zu allen Ausgaben ist ein Beleg abgelegt.', ohneBeleg);
    const unklar = l.filter((b) => ['uebrig', 'uebrig-ein'].includes(b.kategorie) || !b.kategorie);
    p(unklar.length ? 'warn' : 'ok', 'Unklare Kategorie (Übriges)', unklar.length ? 'Diese Buchungen sind keiner Kategorie zugeordnet.' : 'Alle Buchungen haben eine Kategorie.', unklar);
    const schluessel = new Map();
    for (const b of l) { const k = [b.typ, b.datum, b.betragRappen].join('|'); schluessel.set(k, [...(schluessel.get(k) || []), b]); }
    const doppelte = [...schluessel.values()].filter((x) => x.length > 1).flat();
    p(doppelte.length ? 'warn' : 'ok', 'Mögliche Doppelerfassungen', doppelte.length ? 'Gleicher Tag, gleicher Betrag. Oft derselbe Beleg zweimal erfasst.' : 'Keine Doppelten gefunden.', doppelte);
    const gross = aus.filter((b) => netto(b) >= 100000 && ['anschaffung', 'werkzeug', 'software', 'uebrig'].includes(b.kategorie));
    if (gross.length) p('info', 'Anschaffungen ab CHF 1’000', 'Prüfen, ob aktiviert und abgeschrieben werden soll.', gross);
    const ohneMwst = Z.einst.mwstPflichtig !== false ? l.filter((b) => b.typ === 'einnahme' && !b.mwstSatz && b.quelle !== 'rechnung' && (b.betragRappen || 0) > 0) : [];
    if (ohneMwst.length && Z.einst.mwst) p('info', 'Einnahmen ohne MWST', 'Der Kunde ist MWST-pflichtig. Sind diese Einnahmen wirklich ohne MWST?', ohneMwst);
    const vor30 = new Date(Date.now() - 30 * 864e5).toISOString().slice(0, 10);
    const deb = Z.buchungen.filter((b) => b.typ === 'einnahme' && b.quelle === 'rechnung' && !b.bezahlt && b.datum <= vor30);
    if (deb.length) p('info', 'Offene Kundenrechnungen (älter als 30 Tage)', `Total CHF ${chf(deb.reduce((s, b) => s + (b.betragRappen || 0), 0))}. Delkredere oder Mahnung prüfen.`, deb);
    const kred = Z.buchungen.filter((b) => b.typ === 'ausgabe' && b.kreditor && !b.bezahlt);
    if (kred.length) p('info', 'Offene Lieferantenrechnungen', `Total CHF ${chf(kred.reduce((s, b) => s + (b.betragRappen || 0), 0))}.`, kred);
    if (D && D.person(rf()) && aus.some((b) => b.kategorie === 'fahrzeug') && !Z.journal.some((j) => /privatanteil/i.test(j.text || '') && String(j.datum).startsWith(Z.jahr)))
      p('info', 'Privatanteil Fahrzeug fehlt', 'Es gibt Fahrzeugkosten, aber noch keinen Privatanteil (üblich 0.9 % des Kaufpreises pro Monat).');
    if (doppelt()) {
      if (!Z.journal.some((j) => j.id === 'eroeffnung')) p('warn', 'Eröffnungsbilanz fehlt', 'Ohne Eröffnungsbilanz stimmen Bilanz und Kontostände nicht.');
      const r = D.bericht({ plan: plan(), eintraege: eintraege(), jahr: Z.jahr, rechtsform: rf() });
      p(r.differenz ? 'warn' : 'ok', 'Bilanz ausgeglichen', r.differenz ? `Differenz CHF ${chf(r.differenz)} zwischen Aktiven und Passiven.` : `Aktiven und Passiven je CHF ${chf(r.summeAktiven)}.`);
      const kasse = D.kontoblatt({ plan: plan(), eintraege: eintraege(), nr: '1000', jahr: Z.jahr });
      if (kasse.zeilen.some((z) => z.saldo < 0)) p('warn', 'Kasse zeitweise negativ', 'Die Kasse kann nicht unter null fallen. Fehlt ein Bargeldbezug?', [], `<button class="btn klein" data-konto="1000">Kontoblatt Kasse</button>`);
    }
    const offen = Z.fragen.filter((f) => f.status !== 'erledigt');
    if (offen.length) p('info', 'Rückfragen', `${offen.filter((f) => f.status === 'beantwortet').length} beantwortet, ${offen.filter((f) => f.status === 'offen').length} warten auf den Kunden.`, [], '<button class="btn klein" data-ansicht="fragen">Ansehen</button>');
    const warn = punkte.filter((x) => x.stufe === 'warn').length;
    return `<p class="hinweis" style="margin-bottom:12px">${warn ? `<b>${warn} ${warn === 1 ? 'Punkt' : 'Punkte'} zu klären</b> für ${Z.jahr}.` : `Für ${Z.jahr} ist nichts Auffälliges zu sehen.`} Mit „Rückfrage“ fragen Sie den Kunden direkt in seiner App.</p>
      ${punkte.map((x) => `<details class="pendenz ${x.stufe === 'ok' ? 'ok' : x.stufe === 'info' ? 'info' : ''}" ${x.stufe === 'warn' && x.liste.length ? 'open' : ''}><summary><span class="zahlpunkt">${x.stufe === 'ok' ? '✓' : x.liste.length || '!'}</span>${esc(x.titel)}</summary>
        <p>${esc(x.text)}</p>${x.extra || ''}${x.liste.slice(0, 40).map((b) => bZeile(b)).join('')}${x.liste.length > 40 ? `<p class="hinweis">… und ${x.liste.length - 40} weitere</p>` : ''}
        ${x.liste.length > 1 && x.stufe !== 'ok' ? `<button class="btn klein abstand" data-frage-sammel="${esc(x.titel)}" data-ids="${x.liste.map((b) => b.id).join(',')}">Sammel-Rückfrage zu allen</button>` : ''}</details>`).join('')}`;
  }

  function abschluss() {
    const r = D.bericht({ plan: plan(), eintraege: eintraege(), jahr: Z.jahr, rechtsform: rf() });
    const seite = (gruppen) => gruppen.map((g) => `<tr><td colspan="2"><b>${esc(g.titel)}</b></td></tr>` + g.teile.map((t) => `<tr><td style="padding-left:14px;color:var(--text)">${esc(t.titel)}</td><td></td></tr>` +
      t.konten.map((k) => `<tr><td style="padding-left:26px"><span class="kontolink" data-konto="${k.nr}">${k.nr}</span> ${esc(k.name)}</td><td class="r">${chf(k.betrag)}</td></tr>`).join('')).join('') + `<tr><td>Total ${esc(g.titel)}</td><td class="r"><b>${chf(g.summe)}</b></td></tr>`).join('');
    const er = r.erfolg.map((x) => x.zwischen ? `<tr class="summe"><td>${esc(x.zwischen)}</td><td class="r">${chf(x.betrag)}</td></tr>`
      : `<tr><td colspan="2"><b>${esc(x.titel)}</b></td></tr>` + x.konten.map((k) => `<tr><td style="padding-left:14px"><span class="kontolink" data-konto="${k.nr}">${k.nr}</span> ${esc(k.name)}</td><td class="r">${chf(k.betrag)}</td></tr>`).join('')).join('');
    return `<div class="raster r4"><div class="card zahl"><div class="l">Bilanzsumme</div><div class="w">${chf(r.summeAktiven)}</div></div><div class="card zahl"><div class="l">${r.gewinn >= 0 ? 'Gewinn' : 'Verlust'}</div><div class="w" style="color:${r.gewinn >= 0 ? 'var(--gruen)' : 'var(--rot)'}">${chf(r.gewinn)}</div></div>
      <div class="card zahl"><div class="l">Differenz</div><div class="w" style="color:${r.differenz ? 'var(--rot)' : 'var(--gruen)'}">${chf(r.differenz)}</div></div><div class="card zahl"><div class="l">Stichtag</div><div class="w" style="font-size:20px">${dk(r.stichtag)}</div></div></div>
      <div class="raster r2 abstand"><div class="card scroll"><h2>Bilanz per ${dk(r.stichtag)}</h2><table class="tabelle"><tr><th colspan="2">Aktiven</th></tr>${seite(r.aktiven)}<tr class="summe"><td>Total Aktiven</td><td class="r">${chf(r.summeAktiven)}</td></tr>
        <tr><th colspan="2" style="padding-top:18px">Passiven</th></tr>${seite(r.passiven)}<tr class="summe"><td>Total Passiven</td><td class="r">${chf(r.summePassiven)}</td></tr></table></div>
      <div class="card scroll"><h2>Erfolgsrechnung ${Z.jahr}</h2><table class="tabelle">${er}<tr class="summe"><td>${r.gewinn >= 0 ? 'Jahresgewinn' : 'Jahresverlust'}</td><td class="r">${chf(r.gewinn)}</td></tr></table></div></div>
      <p class="hinweis abstand">Nach OR 959a und 959b, Stand jetzt. Auf eine Kontonummer tippen öffnet das Kontoblatt.</p>`;
  }
  function salden() {
    const l = D.saldenliste({ plan: plan(), eintraege: eintraege(), jahr: Z.jahr });
    if (Z.konto) {
      const k = D.kontoblatt({ plan: plan(), eintraege: eintraege(), nr: Z.konto, jahr: Z.jahr });
      return `<p class="hinweis" style="margin-bottom:10px"><a href="#" data-konto-zu>← Alle Konten</a></p><div class="card scroll"><h2>${k.nr} ${esc(k.name)}</h2><table class="tabelle"><thead><tr><th>Datum</th><th>Text</th><th>Gegenkonto</th><th class="r">Soll</th><th class="r">Haben</th><th class="r">Saldo</th><th></th></tr></thead><tbody>
        <tr><td></td><td>Anfangsbestand</td><td></td><td></td><td></td><td class="r">${chf(k.anfang)}</td><td></td></tr>
        ${k.zeilen.map((z) => `<tr><td>${dk(z.datum)}</td><td>${esc(z.text)}${z.beleg ? ` <small style="color:var(--leise)">${esc(z.beleg)}</small>` : ''}</td><td><span class="kontolink" data-konto="${z.gegen}">${z.gegen}</span></td><td class="r">${z.soll ? chf(z.soll) : ''}</td><td class="r">${z.haben ? chf(z.haben) : ''}</td><td class="r" style="${z.saldo < 0 && k.nr === '1000' ? 'color:var(--rot)' : ''}">${chf(z.saldo)}</td>
          <td>${z.ref ? `<button class="btn klein" data-frage-b="${esc(z.ref)}">?</button>` : ''}</td></tr>`).join('')}
        <tr class="summe"><td></td><td>Schlussbestand</td><td></td><td></td><td></td><td class="r">${chf(k.ende)}</td><td></td></tr></tbody></table></div>`;
    }
    return `<div class="card scroll"><table class="tabelle"><thead><tr><th>Konto</th><th>Name</th><th class="r">Soll</th><th class="r">Haben</th><th class="r">Saldo</th></tr></thead><tbody>
      ${l.map((k) => `<tr class="klick" data-konto="${k.nr}" style="cursor:pointer"><td><span class="kontolink">${k.nr}</span></td><td>${esc(k.name)}</td><td class="r">${chf(k.soll)}</td><td class="r">${chf(k.haben)}</td><td class="r"><b>${chf(k.saldo)}</b></td></tr>`).join('') || '<tr><td colspan="5" class="leer">Keine Buchungen</td></tr>'}</tbody></table></div>`;
  }
  function journal() {
    const q = Z.suche.toLowerCase(), pl = plan();
    const l = eintraege().filter((e) => e.datum.slice(0, 4) === Z.jahr && (!q || `${e.text} ${e.beleg} ${e.zeilen.map((z) => z.soll + ' ' + z.haben + ' ' + (z.betrag / 100).toFixed(2)).join(' ')}`.toLowerCase().includes(q)));
    return `<div class="filter"><input type="search" data-suche placeholder="Suchen: Text, Konto, Betrag" value="${esc(Z.suche)}" style="flex:1;min-width:200px"></div>
      <div class="card scroll"><table class="tabelle"><thead><tr><th>Datum</th><th>Text</th><th>Soll</th><th>Haben</th><th class="r">Betrag</th><th></th></tr></thead><tbody>
      ${l.slice(0, 600).map((e) => e.zeilen.map((z, i) => `<tr><td>${i ? '' : dk(e.datum)}</td><td>${i ? '' : esc(e.text)}${!i && e.art !== 'auto' ? ` <span class="marke-s m-grau">${esc(e.art)}</span>` : ''}</td><td><span class="kontolink" data-konto="${z.soll}">${z.soll}</span> <small style="color:var(--leise)">${esc(D.nameVon(pl, z.soll))}</small></td>
        <td><span class="kontolink" data-konto="${z.haben}">${z.haben}</span> <small style="color:var(--leise)">${esc(D.nameVon(pl, z.haben))}</small></td><td class="r">${chf(z.betrag)}</td><td>${!i && e.ref ? `<button class="btn klein" data-frage-b="${esc(e.ref)}">?</button>` : ''}</td></tr>`).join('')).join('') || '<tr><td colspan="6" class="leer">Keine Einträge</td></tr>'}
      </tbody></table>${l.length > 600 ? `<p class="hinweis">Die ersten 600 von ${l.length} Einträgen. Für alle: Exportieren, Journal (CSV).</p>` : ''}</div>`;
  }
  function erfolg() {
    const l = imJahr(), gr = (typ) => { const m = {}; for (const b of l.filter((x) => x.typ === typ)) { const k = katName(b); m[k] = (m[k] || 0) + netto(b); } return Object.entries(m).sort((a, b) => b[1] - a[1]); };
    const ein = gr('einnahme'), aus = gr('ausgabe'), sE = ein.reduce((s, x) => s + x[1], 0), sA = aus.reduce((s, x) => s + x[1], 0);
    const tab = (titel, l, s) => `<div class="card"><h2>${titel}</h2><table class="tabelle"><tbody>${l.map(([k, v]) => `<tr><td>${esc(k)}</td><td class="r">${chf(v)}</td></tr>`).join('') || '<tr><td class="leer">Keine</td><td></td></tr>'}<tr class="summe"><td>Total</td><td class="r">${chf(s)}</td></tr></tbody></table></div>`;
    return `<div class="raster r4"><div class="card zahl"><div class="l">Ertrag netto</div><div class="w">${chf(sE)}</div></div><div class="card zahl"><div class="l">Aufwand netto</div><div class="w">${chf(sA)}</div></div>
      <div class="card zahl"><div class="l">${sE - sA >= 0 ? 'Gewinn' : 'Verlust'}</div><div class="w" style="color:${sE - sA >= 0 ? 'var(--gruen)' : 'var(--rot)'}">${chf(sE - sA)}</div></div><div class="card zahl"><div class="l">Buchungen</div><div class="w">${l.length}</div></div></div>
      <div class="raster r2 abstand">${tab('Ertrag', ein, sE)}${tab('Aufwand', aus, sA)}</div><p class="hinweis abstand">Beträge ohne MWST. Grundlage sind die Buchungen des Kunden, Stand jetzt.</p>`;
  }
  function mwst() {
    const l = imJahr(), q = [1, 2, 3, 4].map((n) => { const x = l.filter((b) => Math.ceil(Number(b.datum.slice(5, 7)) / 3) === n);
      return { n, umsatz: x.filter((b) => b.typ === 'einnahme').reduce((s, b) => s + (b.betragRappen || 0), 0), mwst: x.filter((b) => b.typ === 'einnahme').reduce((s, b) => s + (b.mwstRappen || 0), 0), vst: x.filter((b) => b.typ === 'ausgabe').reduce((s, b) => s + (b.mwstRappen || 0), 0) }; });
    const sum = (k) => q.reduce((s, x) => s + x[k], 0);
    return `<div class="card scroll"><table class="tabelle"><thead><tr><th>Quartal</th><th class="r">Umsatz brutto</th><th class="r">MWST geschuldet</th><th class="r">Vorsteuer</th><th class="r">Zahllast</th></tr></thead><tbody>
      ${q.map((x) => `<tr><td>${x.n}. Quartal ${Z.jahr}</td><td class="r">${chf(x.umsatz)}</td><td class="r">${chf(x.mwst)}</td><td class="r">${chf(x.vst)}</td><td class="r">${chf(x.mwst - x.vst)}</td></tr>`).join('')}
      <tr class="summe"><td>Jahr</td><td class="r">${chf(sum('umsatz'))}</td><td class="r">${chf(sum('mwst'))}</td><td class="r">${chf(sum('vst'))}</td><td class="r">${chf(sum('mwst') - sum('vst'))}</td></tr></tbody></table></div>
      <p class="hinweis abstand">Effektive Methode, nach Buchungsdatum. Für die Umsatzabstimmung: Umsatz laut Buchhaltung mit den deklarierten Umsätzen vergleichen.</p>`;
  }
  function buchungen() {
    const q = Z.suche.toLowerCase();
    const l = imJahr().filter((b) => !q || `${b.text} ${b.partner} ${katName(b)} ${(b.betragRappen / 100).toFixed(2)}`.toLowerCase().includes(q));
    return `<div class="filter"><input type="search" data-suche placeholder="Suchen: Text, Lieferant, Kategorie, Betrag" value="${esc(Z.suche)}" style="flex:1;min-width:200px"></div>
      <div class="card scroll"><table class="tabelle"><thead><tr><th>Datum</th><th>Text</th><th>Kategorie</th><th class="r">MWST</th><th class="r">Betrag</th><th></th></tr></thead><tbody>
      ${l.map((b) => `<tr><td>${dk(b.datum)}</td><td>${esc(b.text || '')}${b.partner ? `<br><small style="color:var(--leise)">${esc(b.partner)}</small>` : ''}</td><td>${esc(katName(b))}</td><td class="r">${b.mwstSatz ? b.mwstSatz + ' %' : ''}</td>
        <td class="r" style="color:${b.typ === 'einnahme' ? 'var(--gruen)' : 'inherit'}">${b.typ === 'einnahme' ? '' : '−'}${chf(b.betragRappen)}</td><td style="white-space:nowrap">${b.belegId ? `<button class="btn klein" data-beleg="${esc(b.belegId)}">Beleg</button> ` : ''}<button class="btn klein" data-frage-b="${esc(b.id)}">?</button></td></tr>`).join('') || '<tr><td colspan="6" class="leer">Keine Buchungen</td></tr>'}</tbody></table></div>`;
  }
  function fragen() {
    const st = { offen: ['Wartet auf Kunde', 'm-offen'], beantwortet: ['Beantwortet', 'm-ok'], erledigt: ['Erledigt', 'm-grau'] };
    const sortiert = [...Z.fragen].sort((a, b) => ['beantwortet', 'offen', 'erledigt'].indexOf(a.status) - ['beantwortet', 'offen', 'erledigt'].indexOf(b.status));
    return `<div class="aktionen" style="margin-bottom:12px"><button class="btn haupt" data-frage-neu>+ Allgemeine Rückfrage</button><span class="hinweis">Der Kunde sieht Ihre Fragen in seiner Buchhaltung und antwortet dort.</span></div>
      ${sortiert.map((f) => `<div class="frage ${f.status}"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><small style="color:var(--leise)">${dk(String(f.erstellt).slice(0, 10))}${f.bezug ? ' · ' + esc(f.bezug) : ''}</small><span class="marke-s ${st[f.status][1]}">${st[f.status][0]}</span></div>
        <div style="margin-top:4px">${esc(f.frage)}</div>${f.antwort ? `<div class="antwort"><b>Antwort:</b> ${esc(f.antwort)}</div>` : ''}
        <div class="aktionen" style="margin-top:8px">${f.status !== 'erledigt' ? `<button class="btn klein" data-frage-status="${f.id}" data-wert="erledigt">✓ Erledigt</button>` : `<button class="btn klein" data-frage-status="${f.id}" data-wert="offen">Wieder öffnen</button>`}${f.buchung_id && Z.buchungen.some((b) => b.id === f.buchung_id) ? `<button class="btn klein" data-frage-zeigen="${esc(f.buchung_id)}">Buchung</button>` : ''}<button class="btn klein rot" data-frage-weg="${f.id}">Löschen</button></div></div>`).join('') || '<p class="leer">Noch keine Rückfragen.</p>'}`;
  }

  /* ---------- Rückfragen ---------- */
  const bezugVon = (b) => `${dk(b.datum)} · ${b.text || b.partner || katName(b)} · CHF ${chf(b.betragRappen)}`;
  async function frageStellen({ buchung = null, bezug = '', vorschlag = '' } = {}) {
    const text = await UI.eingabe(buchung ? `Rückfrage zu: ${bezugVon(buchung)}` : (bezug ? `Rückfrage: ${bezug}` : 'Rückfrage an den Kunden'), { mehrzeilig: true, vorgabe: vorschlag, ja: 'Senden', platzhalter: 'z. B. Bitte Beleg nachreichen. Was wurde hier gekauft?' });
    if (!text || !text.trim()) return;
    const { error } = await sb.from('tr_rueckfragen').insert({ kunde: Z.kunde.kunde, treuhaender_email: Z.email, buchung_id: buchung ? buchung.id : null, bezug: buchung ? bezugVon(buchung) : bezug || null, frage: text.trim() });
    if (error) { toast(error.message); return; }
    await fragenLaden(); zeichnen(); toast('✓ Rückfrage gesendet');
  }
  const VORSCHLAG = { 'Ausgaben ohne Beleg': 'Bitte die Belege zu diesen Ausgaben nachreichen (Foto in Ordasio anhängen).', 'Unklare Kategorie (Übriges)': 'Wofür waren diese Ausgaben? Bitte kurz beschreiben oder die Kategorie anpassen.',
    'Mögliche Doppelerfassungen': 'Sind diese Buchungen doppelt erfasst? Falls ja, bitte eine davon löschen.', 'Anschaffungen ab CHF 1’000': 'Was wurde angeschafft und wie lange wird es genutzt?' };

  /* ---------- Exporte ---------- */
  const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  const crc32 = (u) => { let c = 0xFFFFFFFF; for (let i = 0; i < u.length; i++) c = CRC[(c ^ u[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  // Einfaches ZIP (ohne Kompression, Fotos und PDFs sind schon komprimiert)
  function zip(dateien) {
    const enc = new TextEncoder(), teile = [], zentral = []; let off = 0;
    for (const d of dateien) {
      const n = enc.encode(d.name), crc = crc32(d.daten), len = d.daten.length;
      const h = new DataView(new ArrayBuffer(30));
      [[0, 0x04034b50, 4], [4, 20, 2], [6, 0x0800, 2], [8, 0, 2], [10, 0, 2], [12, 0x21, 2], [14, crc, 4], [18, len, 4], [22, len, 4], [26, n.length, 2], [28, 0, 2]].forEach(([o, v, g]) => (g === 4 ? h.setUint32(o, v, true) : h.setUint16(o, v, true)));
      teile.push(new Uint8Array(h.buffer), n, d.daten);
      const c = new DataView(new ArrayBuffer(46));
      [[0, 0x02014b50, 4], [4, 20, 2], [6, 20, 2], [8, 0x0800, 2], [10, 0, 2], [12, 0, 2], [14, 0x21, 2], [16, crc, 4], [20, len, 4], [24, len, 4], [28, n.length, 2], [30, 0, 2], [32, 0, 2], [34, 0, 2], [36, 0, 2], [38, 0, 4], [42, off, 4]].forEach(([o, v, g]) => (g === 4 ? c.setUint32(o, v, true) : c.setUint16(o, v, true)));
      zentral.push(new Uint8Array(c.buffer), n); off += 30 + n.length + len;
    }
    const groesse = zentral.reduce((s, x) => s + x.length, 0), e = new DataView(new ArrayBuffer(22));
    e.setUint32(0, 0x06054b50, true); e.setUint16(8, dateien.length, true); e.setUint16(10, dateien.length, true); e.setUint32(12, groesse, true); e.setUint32(16, off, true);
    return new Blob([...teile, ...zentral, new Uint8Array(e.buffer)], { type: 'application/zip' });
  }
  const dateiname = (s) => String(s).replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 80);
  const kundeName = () => dateiname(Z.kunde.firma || 'Kunde');
  async function exportieren(art) {
    const pl = doppelt() ? plan() : null;
    if (art === 'buchungen') {
      const zeilen = [['Datum', 'Typ', 'Text', 'Partner', 'Kategorie', ...(pl ? ['Konto'] : []), 'Betrag brutto', 'MWST-Satz', 'MWST', 'Betrag netto', 'Zahlung', 'Beleg']].concat(imJahr().map((b) => [b.datum, b.typ, b.text || '', b.partner || '', katName(b),
        ...(pl ? [D.kategorieKonto(Z.einst, b.typ, b.kategorie)] : []), ((b.typ === 'ausgabe' ? -1 : 1) * (b.betragRappen || 0) / 100).toFixed(2), b.mwstSatz || 0, ((b.mwstRappen || 0) / 100).toFixed(2), (netto(b) / 100).toFixed(2), b.zahlung || '', b.belegId ? 'ja' : 'nein']));
      laden(new Blob(['﻿' + zeilen.map((z) => z.map((x) => `"${String(x).replace(/"/g, '""')}"`).join(';')).join('\r\n')], { type: 'text/csv;charset=utf-8' }), `${kundeName()} Buchungen ${Z.jahr}.csv`);
    }
    if (art === 'journal') laden(new Blob([D.journalCsv(eintraege(), pl, Z.jahr + '-01-01', Z.jahr + '-12-31')], { type: 'text/csv;charset=utf-8' }), `${kundeName()} Journal ${Z.jahr}.csv`);
    if (art === 'salden') {
      const l = D.saldenliste({ plan: pl, eintraege: eintraege(), jahr: Z.jahr });
      const text = '﻿' + [['Konto', 'Name', 'Soll', 'Haben', 'Saldo'], ...l.map((k) => [k.nr, k.name, (k.soll / 100).toFixed(2), (k.haben / 100).toFixed(2), (k.saldo / 100).toFixed(2)])].map((z) => z.map((x) => `"${String(x).replace(/"/g, '""')}"`).join(';')).join('\r\n');
      laden(new Blob([text], { type: 'text/csv;charset=utf-8' }), `${kundeName()} Saldenliste ${Z.jahr}.csv`);
    }
    if (art === 'belege') {
      const mit = imJahr().filter((b) => b.belegId);
      if (!mit.length) { toast('Keine Belege in ' + Z.jahr); return; }
      const dateien = [], fehlt = [], namen = new Set();
      for (let i = 0; i < mit.length; i++) {
        const b = mit[i]; toast(`Belege werden geladen … ${i + 1} von ${mit.length}`, 60000);
        const { data, error } = await sb.storage.from('belege').download(`${Z.kunde.kunde}/${b.belegId}`);
        if (error || !data) { fehlt.push(b); continue; }
        const ext = (data.type.includes('pdf') ? 'pdf' : data.type.includes('png') ? 'png' : 'jpg');
        let name = dateiname(`${b.datum} ${b.partner || b.text || katName(b)} ${(b.betragRappen / 100).toFixed(2)}`); let n = name, z = 2;
        while (namen.has(n)) n = `${name} (${z++})`; namen.add(n);
        dateien.push({ name: `${n}.${ext}`, daten: new Uint8Array(await data.arrayBuffer()) });
      }
      const liste = '﻿' + [['Datei', 'Datum', 'Text', 'Kategorie', 'Betrag'], ...mit.map((b, i) => [dateien[i] ? dateien[i].name : 'fehlt', b.datum, b.text || b.partner || '', katName(b), (b.betragRappen / 100).toFixed(2)])].map((z) => z.map((x) => `"${String(x).replace(/"/g, '""')}"`).join(';')).join('\r\n');
      dateien.push({ name: 'Belegliste.csv', daten: new TextEncoder().encode(liste) });
      laden(zip(dateien), `${kundeName()} Belege ${Z.jahr}.zip`);
      toast(fehlt.length ? `${dateien.length - 1} Belege geladen, ${fehlt.length} nicht gefunden` : `✓ ${dateien.length - 1} Belege als ZIP`);
    }
  }

  document.addEventListener('click', async (ev) => {
    const t = ev.target;
    const ku = t.closest('[data-kunde]'); if (ku) { history.replaceState(null, '', '?kunde=' + ku.dataset.kunde); Z.ansicht = 'pruefen'; Z.konto = null; Z.suche = ''; mandatOeffnen(ku.dataset.kunde); return; }
    if (t.closest('[data-zurueck]')) { ev.preventDefault(); history.replaceState(null, '', location.pathname); start(); return; }
    if (t.closest('[data-abmelden]')) { await sb.auth.signOut({ scope: 'local' }); login(); return; }
    const an = t.closest('[data-ansicht]'); if (an) { Z.ansicht = an.dataset.ansicht; Z.konto = null; Z.suche = ''; zeichnen(); scrollTo(0, 0); return; }
    const ko = t.closest('[data-konto]'); if (ko && D) { Z.ansicht = 'salden'; Z.konto = ko.dataset.konto; zeichnen(); scrollTo(0, 0); return; }
    if (t.closest('[data-konto-zu]')) { ev.preventDefault(); Z.konto = null; zeichnen(); return; }
    const ex = t.closest('[data-export]'); if (ex) { t.closest('details') && t.closest('details').removeAttribute('open'); exportieren(ex.dataset.export); return; }
    const fb = t.closest('[data-frage-b]'); if (fb) { frageStellen({ buchung: Z.buchungen.find((b) => b.id === fb.dataset.frageB) }); return; }
    const fs = t.closest('[data-frage-sammel]');
    if (fs) { const ids = fs.dataset.ids.split(','); const l = Z.buchungen.filter((b) => ids.includes(b.id));
      frageStellen({ bezug: `${fs.dataset.frageSammel} (${l.length}): ` + l.slice(0, 12).map((b) => `${dk(b.datum)} CHF ${chf(b.betragRappen)}`).join(', ') + (l.length > 12 ? ' …' : ''), vorschlag: VORSCHLAG[fs.dataset.frageSammel] || '' }); return; }
    if (t.closest('[data-frage-neu]')) { frageStellen(); return; }
    const fst = t.closest('[data-frage-status]'); if (fst) { await sb.rpc('tr_frage_status', { p_id: fst.dataset.frageStatus, p_status: fst.dataset.wert }); await fragenLaden(); zeichnen(); return; }
    const fw = t.closest('[data-frage-weg]'); if (fw) { if (!await UI.frage('Diese Rückfrage löschen? Der Kunde sieht sie danach nicht mehr.')) return; await sb.from('tr_rueckfragen').delete().eq('id', fw.dataset.frageWeg); await fragenLaden(); zeichnen(); return; }
    const fz = t.closest('[data-frage-zeigen]'); if (fz) { const b = Z.buchungen.find((x) => x.id === fz.dataset.frageZeigen); if (b) { Z.ansicht = 'buchungen'; Z.suche = (b.betragRappen / 100).toFixed(2); zeichnen(); } return; }
    const be = t.closest('[data-beleg]');
    if (be) {
      const fenster = window.open('', '_blank');
      const { data, error } = await sb.storage.from('belege').createSignedUrl(`${Z.kunde.kunde}/${be.dataset.beleg}`, 120);
      if (error || !data) { if (fenster) fenster.close(); toast('Beleg nicht gefunden'); return; }
      if (fenster) fenster.location = data.signedUrl; else location.href = data.signedUrl;
    }
  });
  document.addEventListener('change', (ev) => { if (ev.target.matches('[data-jahr]')) { Z.jahr = ev.target.value; Z.konto = null; zeichnen(); } });
  let sucheZeit;
  document.addEventListener('input', (ev) => {
    if (!ev.target.matches('[data-suche]')) return;
    clearTimeout(sucheZeit); sucheZeit = setTimeout(() => { Z.suche = ev.target.value; const pos = ev.target.selectionStart; zeichnen(); const n = document.querySelector('[data-suche]'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 250);
  });
  (async () => {
    const q = new URLSearchParams(location.search), th = q.get('token_hash'), typ = q.get('type');
    if (th && /^(signup|email|magiclink|invite|email_change)$/.test(typ || '')) {
      q.delete('token_hash'); q.delete('type'); try { history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : '')); } catch {}
      const { error } = await sb.auth.verifyOtp({ token_hash: th, type: typ });
      if (error) { const { data: { session } } = await sb.auth.getSession(); if (!session) { login('Der Link ist abgelaufen oder wurde schon verwendet. Bitte melden Sie sich an.'); return; } }
    }
    start();
  })();
})();
</script>
</body>
