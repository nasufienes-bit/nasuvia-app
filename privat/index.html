<style>
:root{--papier:#F4FAF6;--flaeche:#E8F4EE;--karte:#fff;--tinte:#0A1F17;--text:#3F5A4F;--leise:#7C8499;--blau:#0B3B2E;--elektrik:#0E7A55;--gruen:#0E9F6E;--rot:#E5484D;--gelb:#B7791F;--linie:color-mix(in srgb,var(--blau,#0B3B2E) 14%,transparent);--schatten:0 1px 2px rgba(12,18,38,.05),0 10px 26px -16px rgba(12,18,38,.25);--display:'League Spartan',-apple-system,system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;--unten:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.5 var(--display);background:var(--papier);color:var(--tinte);min-height:100vh;padding-bottom:calc(80px + var(--unten))}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer}
.kopfzeile{position:sticky;top:0;z-index:20;background:rgba(247,249,253,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
.kopfzeile .wrap{display:flex;align-items:center;gap:12px;height:62px}
.kopfzeile .nv-knopf{margin-right:4px}
.marke{display:flex;align-items:center;gap:8px;font-weight:700;font-size:19px;letter-spacing:-.02em}
.marke i{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--blau),var(--elektrik));display:grid;place-items:center}
.marke i svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tabs{margin-left:auto;display:flex;gap:2px}
.tabs button{border:0;background:none;padding:8px 12px;border-radius:100px;color:var(--text);font-weight:500}
.tabs button.an{background:#fff;color:var(--blau);font-weight:600;box-shadow:var(--schatten)}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px}
main{padding:22px 0 30px}
h1{font-size:30px;letter-spacing:-.02em;line-height:1.1}
.unter{color:var(--text);margin-top:4px}
.kopf{display:flex;justify-content:space-between;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px}
.aktionen{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:100px;padding:10px 16px;font-weight:600;background:#fff;color:var(--blau);box-shadow:var(--schatten);white-space:nowrap}
.btn.haupt{background:var(--blau);color:#fff}
.btn.klein{padding:6px 11px;font-size:13px}
.btn.rot{color:var(--rot)}
.raster{display:grid;gap:14px}
.r2{grid-template-columns:repeat(2,minmax(0,1fr))}.r4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:820px){.r2,.r4{grid-template-columns:1fr 1fr}.r2.voll{grid-template-columns:1fr}.tabs{display:none}}
@media(max-width:520px){.r2{grid-template-columns:1fr}}
.card{background:var(--karte);border-radius:18px;padding:18px;box-shadow:var(--schatten)}
.card h2{font-size:17px;margin-bottom:10px}
.abstand{margin-top:14px}
.zahl .l{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--leise)}
.zahl .w{font-size:25px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.zahl .k{font-size:12.5px;color:var(--leise)}
.plus{color:var(--gruen)}.minus{color:var(--rot)}
.leer{color:var(--leise);padding:10px 0}
.hinweis{color:var(--text);font-size:13.5px}
.zeile{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--linie)}
.zeile:last-child{border-bottom:0}
.zeile b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zeile small{color:var(--leise);font-size:12.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zeile .betrag{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.zeile.klick{cursor:pointer}
.marke-s{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;border-radius:100px;padding:2px 8px;margin-left:6px;vertical-align:1px}
.m-offen{background:rgba(245,181,61,.2);color:#8a5a00}.m-ok{background:rgba(14,159,110,.12);color:var(--elektrik,#0A7150)}.m-rot{background:rgba(229,72,77,.12);color:#B4282D}.m-blau{background:color-mix(in srgb,var(--elektrik,#0E7A55) 10%,transparent);color:var(--blau)}
.spur{height:7px;background:var(--flaeche);border-radius:7px;overflow:hidden;margin-top:6px;grid-column:1/-1}
.spur i{display:block;height:100%;border-radius:7px}
.ring{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ring svg{width:170px;height:170px;flex:none}

.filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
select,input:not([type]),input[type=text],input[type=date],input[type=search],input[type=number],textarea{font:inherit;border:1px solid color-mix(in srgb,var(--blau,#0B3B2E) 26%,transparent);border-radius:10px;padding:8px 11px;background:#fff;color:var(--tinte)}
.segment{display:inline-flex;background:var(--flaeche);border-radius:100px;padding:3px;gap:2px}

dialog{border:0;border-radius:20px;padding:0;width:min(520px,calc(100% - 20px));box-shadow:0 40px 100px -30px rgba(12,18,38,.5)}

.dlg{padding:20px;display:grid;gap:10px;max-height:calc(100vh - 40px);overflow:auto}
.dlg h3{font-size:20px}
.dlg label{display:grid;gap:4px;font-size:13px;color:var(--text)}
.dlg .zwei{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.unten-nav{display:none}
@media(max-width:820px){.unten-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(247,249,253,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--linie);padding:6px 4px calc(6px + var(--unten))}

.toast{position:fixed;left:50%;bottom:calc(90px + var(--unten));transform:translate(-50%,20px);opacity:0;background:var(--tinte);color:#fff;border-radius:100px;padding:11px 18px;font-weight:600;transition:.3s;z-index:99;pointer-events:none;max-width:90vw;text-align:center}
.toast.da{transform:translate(-50%,0);opacity:1}
.start{text-align:center;padding:40px 18px}
.start .gross{width:74px;height:74px;border-radius:22px;margin:0 auto 16px;background:linear-gradient(135deg,var(--blau),var(--elektrik));display:grid;place-items:center}

.start h2{font-size:24px;margin-bottom:6px}
.start p{max-width:520px;margin:0 auto 18px;color:var(--text)}
.frist{font-weight:700}
.segment{max-width:100%;overflow-x:auto;scrollbar-width:none}.segment::-webkit-scrollbar{display:none}.segment button{white-space:nowrap}
.zeile.zwei{grid-template-columns:1fr}.zeile.zwei .frist{font-size:13px}
@media(max-width:520px){.zahl .w{font-size:19px}.card{padding:14px}.kopf .aktionen{width:100%}h1{font-size:26px}}
[data-suche-hier]{display:flex;margin-left:8px}@media(max-width:820px){[data-suche-hier]{margin-left:auto}}
.info-box{background:color-mix(in srgb,var(--elektrik,#0E7A55) 7%,transparent);border-radius:14px;padding:12px 14px;font-size:13.5px;color:var(--blau);margin-top:10px}
.schnell{display:grid;gap:4px;justify-items:start;text-align:left;border:1px solid var(--linie);background:#fff;border-radius:14px;padding:14px;cursor:pointer;font:inherit;color:var(--tinte);transition:border-color .2s,box-shadow .2s}
.schnell:hover{border-color:color-mix(in srgb,var(--elektrik,#0E7A55) 35%,transparent);box-shadow:0 10px 26px -18px color-mix(in srgb,var(--blau,#0B3B2E) 50%,transparent)}
.schnell svg{width:22px;height:22px;fill:none;stroke:var(--elektrik,#0E7A55);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.schnell small{color:var(--text);font-size:12.5px;line-height:1.35}
@media(max-width:820px){.raster.r4 .schnell{padding:12px}}
.st-anleitung{margin-bottom:14px}
.st-anleitung summary{display:flex;gap:14px;align-items:center;justify-content:space-between;cursor:pointer;list-style:none}
.st-anleitung summary::-webkit-details-marker{display:none}
.st-anleitung summary small{display:block;color:var(--leise);font-size:13px}
.st-balken{width:120px;height:8px;border-radius:8px;background:var(--flaeche);overflow:hidden;flex:none}.st-balken i{display:block;height:100%;background:linear-gradient(90deg,var(--elektrik),#34D399)}
.st-schritt{border-top:1px solid var(--linie);padding:12px 0}
.st-titel{display:flex;gap:10px;align-items:center;font-weight:700;cursor:pointer}
.st-titel input{width:20px;height:20px;accent-color:var(--elektrik)}
.st-schritt .st-inhalt{margin:6px 0 0 30px;color:var(--text);font-size:14px}
.st-schritt.fertig .st-titel span{text-decoration:line-through;color:var(--leise)}.st-schritt.fertig .st-inhalt{display:none}
.st-schritt.jetzt{background:linear-gradient(90deg,color-mix(in srgb,var(--elektrik,#0E7A55) 6%,transparent),transparent);border-radius:12px;padding:12px 10px;margin:0 -10px}
.st-liste{display:grid;gap:6px;margin:4px 0 8px}.st-liste label{display:flex;gap:8px;align-items:center}.st-liste input{width:18px;height:18px;accent-color:var(--elektrik)}
.st-werte{display:grid;gap:4px;margin:6px 0}.st-werte div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--linie);padding:4px 0}
.st-wert{background:var(--flaeche);border-radius:10px;padding:8px 10px}
.st-tipps{margin:8px 0 0 18px;display:grid;gap:4px}
.hb-frisch{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border:1px solid color-mix(in srgb,var(--gruen) 35%,transparent);border-left:4px solid var(--gruen);border-radius:14px;padding:12px 12px 12px 14px;margin-bottom:12px;box-shadow:var(--schatten)}
.hb-frisch-ic{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--gruen) 14%,transparent);color:var(--gruen)}.hb-frisch-ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.hb-frisch-t{flex:1;min-width:200px}.hb-frisch-t b{display:block;color:var(--tinte);overflow-wrap:anywhere}.hb-frisch-t small{color:var(--leise);font-size:13px}
.hb-frisch-a{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hb-frisch-zu{width:32px;height:32px;border:0;border-radius:50%;background:transparent;cursor:pointer;color:var(--leise);display:grid;place-items:center}.hb-frisch-zu:hover{background:var(--flaeche)}.hb-frisch-zu svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
@media(max-width:560px){.hb-frisch-a{width:100%}.hb-frisch-a .btn{flex:1}}
.js-such{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--linie);border-radius:14px;padding:4px 6px 4px 14px;box-shadow:var(--schatten);margin-bottom:14px}
.js-such:focus-within{border-color:var(--elektrik)}.js-such svg{width:20px;height:20px;flex:none;fill:none;stroke:var(--leise);stroke-width:2;stroke-linecap:round}
.js-such input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:17px;padding:10px 0;color:var(--tinte)}
.js-such input::-webkit-search-cancel-button{display:none}.js-such button{border:0;background:var(--flaeche);border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer;color:var(--text)}
.j-balken{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;align-items:end;height:190px;padding-top:8px}
.j-balken .m{display:grid;grid-template-rows:1fr auto;height:100%;cursor:pointer;border-radius:8px;padding:0 2px}.j-balken .m:hover,.j-balken .m.an{background:var(--flaeche)}
.j-balken .s{display:flex;gap:2px;align-items:end;justify-content:center;height:100%}.j-balken .s i{display:block;width:42%;max-width:16px;border-radius:4px 4px 0 0;min-height:1px}
.j-balken .ein{background:var(--gruen)}.j-balken .aus{background:var(--blau)}.j-balken small{display:block;text-align:center;font-size:11px;color:var(--leise);padding:4px 0;font-family:var(--mono)}
.j-leg{display:flex;gap:14px;font-size:12.5px;color:var(--leise);margin-top:6px}.j-leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.j-tab{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}.j-tab td,.j-tab th{padding:9px 6px;border-bottom:1px solid var(--linie);text-align:right}.j-tab td:first-child,.j-tab th:first-child{text-align:left}
.j-tab th{font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--leise)}.j-tab tr.k{cursor:pointer}.j-tab tr.k:hover td{background:var(--flaeche)}.j-tab tr.an td{background:var(--flaeche);font-weight:600}.j-tab tr.t td{font-weight:700;border-top:2px solid var(--tinte)}
.j-spur{height:6px;border-radius:4px;background:var(--flaeche);overflow:hidden;margin-top:5px}.j-spur i{display:block;height:100%;border-radius:4px}
.er-chips{display:flex;flex-wrap:wrap;gap:6px}.er-chips button{border:1px solid var(--linie);background:#fff;border-radius:100px;padding:8px 13px;font:inherit;font-size:14px;cursor:pointer;color:var(--tinte)}.er-chips button.an{background:var(--blau);color:#fff;border-color:var(--blau)}
.er-block{background:var(--flaeche,#EEF5F1);border-radius:14px;padding:10px 12px}.er-marke{display:inline-block;background:#FFF4D6;color:#8A5A00;border-radius:100px;padding:1px 8px;font-size:12px;font-weight:600;margin-right:4px}
</style>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fmt = new Intl.NumberFormat('de-CH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const chf = (r) => fmt.format((r || 0) / 100);
  const heute = () => new Date().toLocaleDateString('sv-SE');
  const dk = (d) => (d ? d.slice(8, 10) + '.' + d.slice(5, 7) + '.' + d.slice(0, 4) : '');
  const tageBis = (d) => Math.round((new Date(d + 'T12:00') - new Date(heute() + 'T12:00')) / 864e5);
  let rgVorher = null, rgTimer = null, rgText = 'Gespeichert';
  const toast = (t) => {
    if (rgVorher !== null && !/^Rückgängig/.test(t)) { rgText = t; return; }   // Meldung kommt in die Rückgängig-Leiste
    const e = $('toast'); e.textContent = t; e.classList.add('da'); clearTimeout(toast.z); toast.z = setTimeout(() => e.classList.remove('da'), 2800);
  };
  const betragLesen = (t) => {
    let s = String(t || '').trim().replace(/[’'\s]/g, '').replace(/^CHF/i, '').replace('−', '-');
    if (/,\d{1,2}$/.test(s)) s = s.replace(/\./g, '').replace(',', '.');
    s = s.replace(/,/g, '');
    const n = Number(s); return Number.isFinite(n) ? Math.round(n * 100) : NaN;
  };

  /* ---------- Daten (auf diesem Gerät) ---------- */
  const KEY = 'homebuero.v1';
  const D = (() => { try { return { bewegungen: [], rechnungen: [], betreibungen: [], regeln: {}, abosStatus: {}, steuern: [], steuerVon: {}, budget: {}, teilen: { personen: [], ausgaben: [] }, kk: { aktuell: {}, angebote: [], kosten: 500 }, bargeld: [], guthaben: [], fix: [], sparziele: [], kalender: [], ordner: [], dokumente: [], papierkorb: [], start: {}, ...JSON.parse(localStorage.getItem(KEY) || '{}') }; } catch { return { bewegungen: [], rechnungen: [], betreibungen: [], regeln: {}, abosStatus: {} }; } })();
  // Jede Änderung lässt sich rückgängig machen: der vorherige Stand wird gemerkt
  let letzterStand = (() => { try { return localStorage.getItem(KEY) || JSON.stringify(D); } catch { return JSON.stringify(D); } })();
  const sichern = () => {
    const neu = JSON.stringify(D);
    if (neu === letzterStand) return;
    try { localStorage.setItem(KEY, neu); } catch { toast('Speicher voll — bitte eine Sicherung herunterladen'); return; }
    if (rgVorher === null) rgVorher = letzterStand;
    letzterStand = neu;
    clearTimeout(rgTimer);
    rgTimer = setTimeout(() => {
      const vorher = rgVorher, text = rgText; rgVorher = null; rgText = 'Gespeichert';
      if (!window.Rueckgaengig || !vorher) return;
      Rueckgaengig.zeigen(text, () => {
        const alt = JSON.parse(vorher);
        for (const k of Object.keys(D)) delete D[k];
        Object.assign(D, alt);
        try { localStorage.setItem(KEY, vorher); } catch {}
        letzterStand = vorher;
        zeichnen();
      });
    }, 80);
  };
  const neueId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  // Löschen heisst: 30 Tage in „Zuletzt gelöscht“, danach endgültig weg
  const ORT = { bewegungen: 'Kontobewegung', rechnungen: 'Rechnung', betreibungen: 'Betreibung', steuern: 'Steuerabzug', 'teilen.ausgaben': 'Gemeinsame Ausgabe', 'kk.angebote': 'Krankenkassen-Angebot',
    bargeld: 'Bargeld', guthaben: 'Guthaben', fix: 'Fixe Zahlung', sparziele: 'Sparziel', kalender: 'Kalender-Eintrag', dokumente: 'Dokument', ordner: 'Ordner' };
  const listeVon = (pfad) => pfad.split('.').reduce((o, k) => o[k], D);
  const listeSetzen = (pfad, wert) => { const k = pfad.split('.'); const letzter = k.pop(); k.reduce((o, x) => o[x], D)[letzter] = wert; };
  async function wegwerfen(pfad, eintrag, titel) {

    const proMonat = monate.map((ym) => { const l = liste.filter((b) => b.datum.startsWith(ym)); return { ym, l, ein: sum(l, (b) => b.betragRappen > 0), aus: -sum(l, (b) => b.betragRappen < 0) }; });

  /* Steuererklärung Schritt für Schritt: Fortschritt pro Jahr, Werte aus dem Home-Büro als Hilfe */

      + (D.bargeld || []).filter(jahrL).reduce((a, x) => a + (x.art === 'ausgabe' ? -x.betragRappen : x.betragRappen), 0);
    const guthaben = (D.guthaben || []).reduce((a, g) => a + Math.max(0, g.betragRappen - (g.zahlungen || []).reduce((t, z) => t + z.betragRappen, 0)), 0);
    const gespart = (D.sparziele || []).reduce((a, z) => a + (z.einzahlungen || []).reduce((t, e) => t + e.betragRappen, 0), 0);
    const offeneRg = (D.rechnungen || []).filter((r) => r.status !== 'bezahlt' && (r.erhalten || r.faellig || '') <= steuerJahr + '-12-31').reduce((a, r) => a + (r.betragRappen || 0), 0);
    const UNTERLAGEN = [['lohnausweis', 'Lohnausweis(e) vom Arbeitgeber'], ['bank', 'Zins- und Saldoausweise aller Konten per 31.12.'], ['3a', 'Bescheinigung Säule 3a'], ['kk', 'Prämienübersicht der Krankenkasse'],

      ${SCHRITTE.map(([k, t, inhalt], i) => `<div class="st-schritt ${plan.erledigt[k] ? 'fertig' : ''} ${naechster && naechster[0] === k ? 'jetzt' : ''}"><label class="st-titel"><input type="checkbox" data-st-schritt="${k}" ${plan.erledigt[k] ? 'checked' : ''}><span>${i + 1}. ${t}</span></label><div class="st-inhalt">${inhalt}</div></div>`).join('')}
      <p class="hinweis" style="margin-top:10px">Allgemeine Hilfe ohne Gewähr. Regeln und Beträge sind je nach Kanton verschieden. Massgebend ist die Wegleitung Ihres Kantons.</p></details>`;

  function steuernAnsicht() {

  // Quittungsfoto verkleinern, damit es auf dem Gerät wenig Platz braucht
  function bildKlein(datei) {
    return new Promise((ok) => { const img = new Image(); img.onload = () => { const m = Math.min(1, 1100 / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = img.width * m; c.height = img.height * m; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); ok(c.toDataURL('image/jpeg', .6)); URL.revokeObjectURL(img.src); }; img.onerror = () => ok(''); img.src = URL.createObjectURL(datei); });
  }

      <h1>Steuerabzüge ${steuerJahr}</h1>${ABZUG.filter(([id]) => l.some((s) => s.art === id)).map(([id, n]) => { const x = l.filter((s) => s.art === id); return `<h2>${esc(n)}</h2><table>${x.map((s) => `<tr><td>${dk(s.datum)}</td><td>${esc(s.text)}</td><td class="r">${chf(s.betragRappen)}</td></tr>`).join('')}<tr><th colspan="2">Total</th><th class="r">${chf(x.reduce((a, s) => a + s.betragRappen, 0))}</th></tr></table>`; }).join('')}
      <h2>Quittungen</h2>${l.filter((s) => s.foto).map((s) => `<img src="${s.foto}">`).join('') || '<p>Keine Fotos.</p>'}<script>setTimeout(()=>print(),300)<\/script></body></html>`);

  /* ---------- Budget: geplant gegen tatsächlich ---------- */
  let budgetMonat = heute().slice(0, 7);
  function budgetAnsicht() {
    const ist = {}; let ein = 0;
    for (const b of D.bewegungen.filter((x) => x.datum.slice(0, 7) === budgetMonat)) { if (b.betragRappen < 0) ist[b.kategorie] = (ist[b.kategorie] || 0) - b.betragRappen; else ein += b.betragRappen; }
    const kats = KAT.filter(([id]) => D.budget[id] || ist[id]);
    const sB = kats.reduce((x, [id]) => x + (D.budget[id] || 0), 0), sI = kats.reduce((x, [id]) => x + (ist[id] || 0), 0);
    return `<div class="kopf"><div><h1>Budget</h1><p class="unter">Legen Sie pro Kategorie fest, wie viel Sie im Monat ausgeben wollen. Der Kontoauszug zeigt, wo Sie stehen.</p></div>

        <div class="card zahl"><div class="l">Ausgegeben</div><div class="w ${sI > sB && sB ? 'minus' : ''}">${chf(sI)}</div></div><div class="card zahl"><div class="l">Noch frei</div><div class="w">${chf(Math.max(0, sB - sI))}</div><div class="k">${sB ? Math.round(sI / sB * 100) + ' % verbraucht' : 'Budget festlegen'}</div></div></div>
      <div class="card abstand">${KAT.filter(([id]) => id !== 'uebrig' || ist.uebrig || D.budget.uebrig).map(([id, n, f]) => { const b = D.budget[id] || 0, i = ist[id] || 0, p = b ? Math.min(100, i / b * 100) : 0;
        return `<div class="zeile"><div style="min-width:0"><b>${esc(n)}</b><small>${chf(i)} von ${b ? chf(b) : '–'}${b && i > b ? ` · <span class="minus">${chf(i - b)} drüber</span>` : ''}</small></div>
          <input type="text" inputmode="decimal" data-budget="${id}" value="${b ? chf(b) : ''}" placeholder="Budget" style="width:110px;text-align:right" aria-label="Budget ${esc(n)}">
          <div class="spur"><i style="width:${b ? p : 0}%;background:${b && i > b ? 'var(--rot)' : f}"></i></div></div>`; }).join('')}</div>`;
  }

  /* ---------- Teilen: gemeinsame Ausgaben in Familie oder WG ---------- */
  function ausgleich() {
    const saldo = Object.fromEntries(D.teilen.personen.map((p) => [p, 0]));
    for (const a of D.teilen.ausgaben.filter((x) => !x.erledigt)) {
      const fuer = (a.fuer && a.fuer.length ? a.fuer : D.teilen.personen).filter((p) => p in saldo); if (!fuer.length || !(a.von in saldo)) continue;
      saldo[a.von] += a.betragRappen; const teil = a.betragRappen / fuer.length; for (const p of fuer) saldo[p] -= teil;
    }
    const plus = Object.entries(saldo).filter(([, v]) => v > 50).sort((a, b) => b[1] - a[1]), minus = Object.entries(saldo).filter(([, v]) => v < -50).sort((a, b) => a[1] - b[1]);
    const zahlungen = []; let i = 0, j = 0;
    while (i < minus.length && j < plus.length) { const b = Math.min(-minus[i][1], plus[j][1]); zahlungen.push({ von: minus[i][0], an: plus[j][0], betrag: Math.round(b) }); minus[i][1] += b; plus[j][1] -= b; if (minus[i][1] > -50) i++; if (plus[j][1] < 50) j++; }
    return { saldo, zahlungen };
  }
  function teilenAnsicht() {
    const T = D.teilen, { saldo, zahlungen } = ausgleich(), offen = T.ausgaben.filter((a) => !a.erledigt).sort((a, b) => (a.datum < b.datum ? 1 : -1));
    const text = `Ausgleich gemeinsame Ausgaben:\n${zahlungen.map((z) => `${z.von} → ${z.an}: CHF ${chf(z.betrag)}`).join('\n')}`;
    return `<div class="kopf"><div><h1>Teilen</h1><p class="unter">Gemeinsame Ausgaben in Familie oder WG: wer hat bezahlt, wer schuldet wem wie viel.</p></div>
        <div class="aktionen"><button class="btn" data-hb="personen">Personen (${T.personen.length})</button><button class="btn haupt" data-hb="ausgabeNeu" ${T.personen.length < 2 ? 'disabled' : ''}>+ Ausgabe</button></div></div>
      ${T.personen.length < 2 ? '<div class="card start"><h2>Wer teilt mit?</h2><p>Erfassen Sie zuerst mindestens zwei Personen, zum Beispiel alle in Ihrer WG.</p><button class="btn haupt" data-hb="personen">Personen erfassen</button></div>' : `
      <div class="raster r2 voll"><div class="card"><h2>So wird ausgeglichen</h2>${zahlungen.length ? zahlungen.map((z) => `<div class="zeile"><div><b>${esc(z.von)} → ${esc(z.an)}</b></div><div class="betrag">${chf(z.betrag)}</div></div>`).join('') +
          `<div class="aktionen abstand"><a class="btn" href="https://wa.me/?text=${encodeURIComponent(text)}" target="_blank" rel="noopener">Per WhatsApp teilen</a><button class="btn haupt" data-hb="ausgeglichen">Alles ausgeglichen</button></div>` : '<p class="leer">Alle sind quitt. 🎉</p>'}</div>
        <div class="card"><h2>Stand pro Person</h2>${Object.entries(saldo).map(([p, v]) => `<div class="zeile"><div><b>${esc(p)}</b><small>${v > 50 ? 'bekommt' : v < -50 ? 'schuldet' : 'quitt'}</small></div><div class="betrag ${v > 50 ? 'plus' : v < -50 ? 'minus' : ''}">${chf(Math.abs(Math.round(v)))}</div></div>`).join('')}</div></div>
      <div class="card abstand"><h2>Offene Ausgaben</h2>${offen.length ? offen.map((a) => `<div class="zeile klick" data-ausgabe="${a.id}"><div style="min-width:0"><b>${esc(a.text || 'Ausgabe')}</b><small>${dk(a.datum)} · bezahlt von ${esc(a.von)} · für ${a.fuer && a.fuer.length && a.fuer.length < T.personen.length ? esc(a.fuer.join(', ')) : 'alle'}</small></div><div class="betrag">${chf(a.betragRappen)}</div></div>`).join('') : '<p class="leer">Keine offenen Ausgaben.</p>'}</div>`}`;
  }

  /* ---------- Krankenkasse: Prämien vergleichen ---------- */
  const kkKosten = (o, kosten) => { const f = Number(o.franchise) || 300; return (o.praemieRappen || 0) * 12 + Math.min(kosten, f * 100) + Math.min(Math.max(0, kosten - f * 100) * 0.1, 70000); };

    return `<div class="kopf"><div><h1>Krankenkasse</h1><p class="unter">Vergleichen Sie, was Sie die Grundversicherung im Jahr wirklich kostet: Prämien plus Franchise und Selbstbehalt.</p></div>
        <div class="aktionen"><a class="btn" href="https://www.priminfo.admin.ch/de/praemien" target="_blank" rel="noopener">Offizielle Prämien (priminfo)</a><button class="btn haupt" data-hb="kkNeu">+ Angebot</button></div></div>
      ${tage >= 0 && tage <= 60 ? `<div class="info-box" style="background:rgba(229,72,77,.08);color:#B4282D;margin-bottom:14px"><b>Noch ${tage} ${tage === 1 ? 'Tag' : 'Tage'}:</b> Die Kündigung der Grundversicherung muss bis am 30. November bei Ihrer Kasse eintreffen, damit Sie auf 1. Januar wechseln können.</div>` : ''}
      <div class="raster r2 voll"><div class="card"><h2>Ihre heutige Versicherung</h2>
        <form id="kkAktuell" class="raster" style="gap:8px"><div class="zwei" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input type="text" name="kasse" value="${esc(k.aktuell.kasse || '')}" placeholder="Kasse"><input type="text" name="modell" value="${esc(k.aktuell.modell || '')}" placeholder="Modell (z. B. Hausarzt)"></div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><select name="franchise">${[300, 500, 1000, 1500, 2000, 2500].map((f) => `<option value="${f}" ${Number(akt.franchise) === f ? 'selected' : ''}>Franchise ${f}</option>`).join('')}</select><input type="text" inputmode="decimal" name="praemie" value="${akt.praemieRappen ? chf(akt.praemieRappen) : ''}" placeholder="Prämie pro Monat"></div>
          <button class="btn">Speichern</button></form>

        <div class="card"><h2>Ihre Gesundheitskosten</h2><p class="hinweis">Wie viel kosten Arzt, Medikamente und Spital ungefähr im Jahr? Davon hängt ab, welche Franchise sich lohnt.</p>

          <p class="hinweis abstand">Faustregel: Wer selten zum Arzt geht, fährt mit Franchise 2500 meist günstiger. Wer regelmässig Kosten hat, mit 300.</p></div></div>
      <div class="card abstand"><h2>Vergleich pro Jahr</h2>${liste.map((o, i) => `<div class="zeile ${o.aktuell ? '' : 'klick'}" ${o.aktuell ? '' : `data-kk="${o.id}"`}><div style="min-width:0"><b>${i === 0 ? '🏆 ' : ''}${esc(o.kasse)}${o.modell ? ' · ' + esc(o.modell) : ''}${o.aktuell ? '<span class="marke-s m-blau">heute</span>' : ''}</b>
          <small>Franchise ${o.franchise} · Prämie CHF ${chf(o.praemieRappen)}/Monat</small></div><div class="betrag">${chf(o.total)}${!o.aktuell && basis ? `<small class="${o.total < basis ? 'plus' : 'minus'}" style="text-align:right">${o.total < basis ? 'spart ' : 'kostet '}${chf(Math.abs(basis - o.total))}</small>` : ''}</div></div>`).join('')}</div>
      <p class="hinweis abstand">Jahreskosten = 12 Prämien + Franchise (soweit Kosten anfallen) + 10 % Selbstbehalt bis höchstens CHF 700. Die Leistungen der Grundversicherung sind bei allen Kassen gleich.</p>`;
  }

  // Bedienung der neuen Bereiche

        budgetVorschlag: () => { const ab = new Date(Date.now() - 92 * 864e5).toLocaleDateString('sv-SE'), s = {}; for (const b of D.bewegungen.filter((x) => x.datum >= ab && x.betragRappen < 0)) s[b.kategorie] = (s[b.kategorie] || 0) - b.betragRappen;
          if (!Object.keys(s).length) { toast('Dafür braucht es Kontoauszüge der letzten Monate'); return; } for (const [k, v] of Object.entries(s)) D.budget[k] = Math.round(v / 3 / 1000) * 1000; sichern(); zeichnen(); toast('Budget aus dem Durchschnitt vorgeschlagen'); },

  /* ---------- Sicherung ---------- */
  function sicherung() {

      if (e.target === dlg || e.target.closest('[data-zu]')) dlg.close();
      if (e.target.closest('[data-runter]')) {
        const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(D)], { type: 'application/json' }));
        a.download = `Home-Buero Sicherung ${heute()}.json`; a.click();
      }
      if (e.target.closest('[data-rauf]')) {
        const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
        inp.onchange = async () => { try { const n = JSON.parse(await inp.files[0].text()); Object.assign(D, n); sichern(); dlg.close(); zeichnen(); toast('Sicherung geladen'); } catch { toast('Diese Datei kann ich nicht lesen'); } };
        inp.click();
      }
      if (e.target.closest('[data-alleweg]') && await UI.frage('Wirklich alle Daten auf diesem Gerät löschen? Das kann nicht rückgängig gemacht werden.')) {
        Object.assign(D, { bewegungen: [], rechnungen: [], betreibungen: [], regeln: {}, abosStatus: {}, steuern: [], steuerVon: {}, budget: {}, teilen: { personen: [], ausgaben: [] }, kk: { aktuell: {}, angebote: [], kosten: 500 }, bargeld: [], guthaben: [], fix: [], sparziele: [], kalender: [], ordner: [], dokumente: [], papierkorb: [], start: {} }); sichern(); dlg.close(); zeichnen();
      }
    };
    dlg.showModal();
  }

  document.addEventListener('click', (e) => {
    const a = e.target.closest('[data-aktion]'); if (!a) return;
    ({ auszug: auszugLaden, importe: importeZeigen, rechnung: () => rechnungBearbeiten(), betreibung: () => betreibungBearbeiten(), sicherung })[a.dataset.aktion]();
  });
  Object.assign(window.HomeBuero = window.HomeBuero || {}, { daten: D, abosFinden, sichern, zeichnen, toast, esc, chf, dk, heute, tageBis, betragLesen, neueId, katName, katFarbe, KAT, bildKlein, wegwerfen, listeVon, listeSetzen, ORT, restBetrag, ring, zeitWahl, imZeitraum, auszugLaden, setzeAnsicht: (a) => { ansicht = a; try { localStorage.setItem('homebuero.ansicht', a); } catch {} zeichnen(); window.scrollTo(0, 0); } });
  zeichnen();
  bezahltAusErinnerung();
  if (window.NASUVIA_KONFIG && NASUVIA_KONFIG.produkt) setTimeout(erLaden, 1200);
})();
