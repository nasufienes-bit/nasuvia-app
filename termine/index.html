<!doctype html>
<html lang="de-CH">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Termine</title>
<meta name="theme-color" content="#F4FAF6" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Termine" />
<link rel="apple-touch-icon" href="../icon-180.png" />
<link rel="stylesheet" href="../schrift.css" />
<script src="../konfig.js"></script>
<script src="../lib/supabase.js"></script>
<script src="../lib/qrcode.js"></script>
<style>
:root{--papier:#F4FAF6;--flaeche:#E8F4EE;--karte:#fff;--tinte:#0A1F17;--text:#3F5A4F;--leise:#7C8499;--blau:#0B3B2E;--elektrik:#0E7A55;--gruen:#0E9F6E;--rot:#E5484D;--linie:rgba(11,59,46,.14);--schatten:0 1px 2px rgba(12,18,38,.04),0 14px 34px -22px rgba(11,59,46,.4);--display:'League Spartan',-apple-system,system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;--unten:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.5 var(--display);background:var(--papier);color:var(--tinte);min-height:100vh;padding-bottom:calc(80px + var(--unten))}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer}
.kopfzeile{position:sticky;top:0;z-index:20;background:rgba(247,249,253,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
.kopfzeile .wrap{display:flex;align-items:center;gap:12px;height:62px}
.kopfzeile .nv-knopf{margin-right:4px}
.marke{display:flex;align-items:center;gap:8px;font-weight:700;font-size:19px;letter-spacing:-.02em;white-space:nowrap}
.marke i{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--blau),var(--elektrik));display:grid;place-items:center}
.marke i svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tabs{margin-left:auto;display:flex;gap:2px}
.tabs button{border:0;background:none;padding:8px 12px;border-radius:100px;color:var(--text);font-weight:500}
.tabs button.an{background:#fff;color:var(--blau);font-weight:600;box-shadow:var(--schatten)}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px}
main{padding:22px 0 30px}
h1{font-size:30px;letter-spacing:-.02em;line-height:1.1}
.unter{color:var(--text);margin-top:4px}
.kopf{display:flex;justify-content:space-between;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px}
.aktionen{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:100px;padding:10px 16px;font-weight:600;background:#fff;color:var(--blau);box-shadow:var(--schatten);white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.haupt{background:var(--blau);color:#fff}
.btn.klein{padding:6px 11px;font-size:13px}
.btn.rot{color:var(--rot)}
.btn:disabled{opacity:.45;cursor:default}
.raster{display:grid;gap:14px}
.r4{grid-template-columns:repeat(4,minmax(0,1fr))}.r2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:820px){.r4,.r2{grid-template-columns:1fr 1fr}.tabs{display:none}}
@media(max-width:520px){.r2{grid-template-columns:1fr}}
.card{background:var(--karte);border-radius:18px;padding:18px;box-shadow:var(--schatten)}
.card h2{font-size:17px;margin-bottom:10px}
.abstand{margin-top:14px}
.zahl .l{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--leise)}
.zahl .w{font-size:25px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.zahl .k{font-size:12.5px;color:var(--leise)}
.leer{color:var(--leise);padding:10px 0}
.hinweis{color:var(--text);font-size:13.5px}
.zeile{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--linie)}
.zeile:last-child{border-bottom:0}
.zeile b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zeile small{color:var(--leise);font-size:12.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zeile .betrag{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.zeile.klick{cursor:pointer}
.zeile.mit-wahl{grid-template-columns:auto minmax(0,1fr) auto}
.zeile input[type=checkbox]{width:18px;height:18px;accent-color:var(--blau)}
.tag-titel{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--leise);padding:14px 0 2px;display:flex;justify-content:space-between}
.marke-s{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;border-radius:100px;padding:2px 8px;margin-left:6px;vertical-align:1px}
.m-offen{background:rgba(245,181,61,.2);color:#8a5a00}.m-ok{background:rgba(14,159,110,.12);color:#0A7150}.m-blau{background:rgba(14,122,85,.1);color:var(--blau)}.m-grau{background:var(--flaeche);color:var(--leise)}
.filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
select,input[type=text],input[type=date],input[type=month],input[type=time],input[type=number],input[type=search],textarea{font:inherit;border:1px solid rgba(11,59,46,.26);border-radius:10px;padding:8px 11px;background:#fff;color:var(--tinte);min-width:0}
.woche{overflow-x:auto}
.woche table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:640px}
.woche th{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--leise);font-weight:500;text-align:right;padding:8px 6px;border-bottom:1px solid var(--linie)}
.woche th:first-child,.woche td:first-child{text-align:left}
.woche td{padding:10px 6px;border-bottom:1px solid var(--linie);text-align:right}
.woche td.null{color:#C4C8D4}
.woche tr:last-child td{border-bottom:0;font-weight:700}
.woche .heute{background:rgba(14,122,85,.06)}
.woche-nav{display:inline-flex;align-items:center;gap:6px}
.woche-nav b{min-width:170px;text-align:center}
dialog{border:0;border-radius:20px;padding:0;width:min(520px,calc(100% - 20px));box-shadow:0 40px 100px -30px rgba(12,18,38,.5)}
dialog::backdrop{background:rgba(12,18,38,.35)}
.dlg{padding:20px;display:grid;gap:10px;max-height:calc(100vh - 40px);overflow:auto}
.dlg h3{font-size:20px}
.dlg label{display:grid;gap:4px;font-size:13px;color:var(--text)}
.dlg .zwei{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dlg .drei{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.dlg .fuss{display:flex;justify-content:space-between;gap:8px;margin-top:6px;flex-wrap:wrap}
.link-feld{display:flex;gap:6px}
.link-feld input{flex:1;font-family:var(--mono);font-size:12px}
.unten-nav{display:none}
@media(max-width:820px){.unten-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(247,249,253,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--linie);padding:6px 4px calc(6px + var(--unten))}
.unten-nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--leise);padding:4px 0}
.unten-nav button.an{color:var(--blau);font-weight:600}
.unten-nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--unten));transform:translate(-50%,20px);opacity:0;background:var(--tinte);color:#fff;border-radius:100px;padding:11px 18px;font-weight:600;transition:.3s;z-index:99;pointer-events:none;max-width:90vw;text-align:center}
.toast.da{transform:translate(-50%,0);opacity:1}
.start{text-align:center;padding:40px 18px}
.start .gross{width:74px;height:74px;border-radius:22px;margin:0 auto 16px;background:linear-gradient(135deg,var(--blau),var(--elektrik));display:grid;place-items:center}
.start .gross svg{width:38px;height:38px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.start h2{font-size:24px;margin-bottom:6px}
.start p{max-width:540px;margin:0 auto 18px;color:var(--text)}
.schritte{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;text-align:left;max-width:820px;margin:22px auto 0}
.schritte div{background:#fff;border-radius:16px;padding:16px;box-shadow:var(--schatten);font-size:14px;color:var(--text)}
.schritte b{display:block;color:var(--tinte);font-size:15px;margin-bottom:2px}
@media(max-width:720px){.schritte{grid-template-columns:1fr}}
.info-box{background:rgba(14,122,85,.07);border-radius:14px;padding:12px 14px;font-size:13.5px;color:var(--blau)}
.auswahl-leiste{position:sticky;bottom:calc(76px + var(--unten));z-index:15;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--tinte);color:#fff;border-radius:16px;padding:10px 12px;margin-top:12px;box-shadow:0 20px 40px -20px rgba(12,18,38,.6)}
.auswahl-leiste .btn{box-shadow:none}
@media(min-width:821px){.auswahl-leiste{bottom:16px}}
[data-suche-hier]{display:flex;margin-left:8px}@media(max-width:820px){[data-suche-hier]{margin-left:auto}}
@media(max-width:520px){.zahl .w{font-size:20px}.card{padding:14px}h1{font-size:26px}.dlg .drei{grid-template-columns:1fr 1fr}}
/* Stundenrapport zum Drucken */
#rapport{display:none}
@media print{
  body{background:#fff;padding:0}
  body > *:not(#rapport){display:none!important}
  #rapport{display:block;padding:10mm 4mm;font-size:11pt;color:#000}
  #rapport h1{font-size:20pt;margin-bottom:2mm}
  #rapport p{margin-bottom:4mm;color:#333}
  #rapport table{width:100%;border-collapse:collapse}
  #rapport th,#rapport td{border-bottom:1px solid #ccc;padding:2mm 1.5mm;text-align:left;vertical-align:top}
  #rapport td.r,#rapport th.r{text-align:right}
  #rapport tfoot td{font-weight:700;border-top:2px solid #000;border-bottom:0}
  #rapport .unterschrift{display:flex;gap:20mm;margin-top:18mm}
  #rapport .unterschrift div{flex:1;border-top:1px solid #000;padding-top:2mm;font-size:9pt}
  .lz-pille,.nv-schwebend{display:none!important}
}
.tagzeit{display:grid;grid-template-columns:90px 1fr 1fr;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--linie)}
.tagzeit:last-child{border-bottom:0}
.tagzeit .bereich{display:flex;gap:4px;align-items:center}
.tagzeit .bereich input{width:100%;padding:6px 6px}
.dienst{display:grid;grid-template-columns:minmax(0,1fr) 90px 100px auto;gap:8px;align-items:center;padding:6px 0}
.dienst input{width:100%}
@media(max-width:600px){.tagzeit{grid-template-columns:1fr 1fr}.tagzeit b{grid-column:1/-1}.dienst{grid-template-columns:1fr 1fr}.dienst input:first-child{grid-column:1/-1}}
.schalter{display:flex;gap:10px;align-items:center;font-weight:600}
.schalter input{width:20px;height:20px;accent-color:var(--blau)}
.verbreiten details{border-top:1px solid var(--linie)}
.verbreiten details:first-of-type{border-top:0}
.verbreiten summary{cursor:pointer;list-style:none;padding:14px 0;display:flex;align-items:center;gap:12px;font-weight:600}
.verbreiten summary::-webkit-details-marker{display:none}
.verbreiten summary::after{content:"+";margin-left:auto;color:var(--elektrik);font-size:22px;line-height:1;transition:transform .2s}
.verbreiten details[open] summary::after{transform:rotate(45deg)}
.verbreiten summary .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;color:#fff;font-size:17px}
.verbreiten summary small{display:block;font-weight:400;color:var(--leise);font-size:12.5px}
.verbreiten .inhalt{padding:0 0 16px 48px;color:var(--text);font-size:14.5px}
.verbreiten ol{margin:6px 0 10px 18px;display:grid;gap:6px}
.verbreiten b{color:var(--tinte)}
.code{position:relative;margin:8px 0 12px}
.code textarea{width:100%;font:12px/1.5 var(--mono);background:#0A1F17;color:#E8F4EE;border:0;border-radius:12px;padding:12px;resize:vertical;min-height:84px}
.code button{position:absolute;right:8px;top:8px}
.vorschau-knopf{display:inline-block;background:var(--elektrik);color:#fff;padding:12px 22px;border-radius:999px;font-weight:600;text-decoration:none;margin:4px 0 10px}
.qr-box{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.qr-box .qr{width:150px;height:150px;background:#fff;border:1px solid var(--linie);border-radius:14px;padding:8px}
.qr-box .qr svg{width:100%;height:100%}
.unterreiter{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
.unterreiter button{border:1px solid var(--linie);background:#fff;border-radius:100px;padding:5px 12px;font-size:13px;color:var(--text)}
.unterreiter button.an{background:var(--blau);color:#fff;border-color:var(--blau)}
@media(max-width:600px){.verbreiten .inhalt{padding-left:0}}
#aufsteller{display:none}
@media print{body > *:not(#aufsteller){display:none!important}body > #aufsteller{display:flex!important;flex-direction:column;align-items:center;justify-content:center;text-align:center;height:180mm;font-family:var(--display);color:#0A1F17}
  #aufsteller h1{font-size:30pt;margin-bottom:4mm}#aufsteller p{font-size:15pt;color:#3F5A4F}#aufsteller .qr{width:90mm;height:90mm;margin:10mm 0}#aufsteller .qr svg{width:100%;height:100%}#aufsteller small{font-size:10pt;color:#7C8499;word-break:break-all;max-width:120mm}
  .lz-pille,.nv-schwebend{display:none!important}@page{size:A5 portrait;margin:12mm}}
.m-rot{background:rgba(229,72,77,.12);color:#B4282D}
</style>
</head>
<body>
<header class="kopfzeile"><div class="wrap">
  <div class="marke"><i><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M8 14h3"/></svg></i>Termine</div>
  <nav class="tabs" id="tabs"></nav>
  <span data-suche-hier></span>
</div></header>
<main class="wrap" id="inhalt"><p class="leer">Wird geladen …</p></main>
<nav class="unten-nav" id="untenNav" style="grid-template-columns:repeat(2,1fr)"></nav>
<dialog id="dlg"></dialog>
<div class="toast" id="toast"></div>
<div id="aufsteller"></div>
<script src="../korb.js"></script>
<script src="../pakete.js"></script>
<script src="../lizenz.js" data-produkt="termine"></script>
<script src="../suche.js"></script>
<script src="../ui.js"></script>
<script src="../navi.js" data-hier="termine" data-einfuegen=".kopfzeile .wrap"></script>
<script>
(() => {
  'use strict';
  const K = window.NASUVIA_KONFIG || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fmt = new Intl.NumberFormat('de-CH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const chf = (r) => fmt.format((r || 0) / 100);
  const iso = (d) => d.toLocaleDateString('sv-SE', { timeZone: 'Europe/Zurich' });
  const heute = () => iso(new Date());
  const dk = (d) => (d ? d.slice(8, 10) + '.' + d.slice(5, 7) + '.' + d.slice(0, 4) : '');
  const WT = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'], WT_LANG = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
  const uhr = (ts) => new Date(ts).toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Zurich' });
  const tagVon = (ts) => iso(new Date(ts));
  const plusTage = (d, n) => { const x = new Date(d + 'T12:00'); x.setDate(x.getDate() + n); return x.toLocaleDateString('sv-SE'); };
  const betragLesen = (t) => { const n = Number(String(t || '').replace(/[’'\s]/g, '').replace(/^CHF/i, '').replace(',', '.')); return Number.isFinite(n) ? Math.round(n * 100) : 0; };
  const toast = (t, ms = 2800) => { const e = $('toast'); e.textContent = t; e.classList.add('da'); clearTimeout(toast.z); toast.z = setTimeout(() => e.classList.remove('da'), ms); };
  const fehlerText = (e) => String((e && e.message) || e || 'Unbekannter Fehler');
  // Datum und Uhrzeit in Zürich → Zeitpunkt (unabhängig von der Zeitzone des Geräts)
  function zuerich(datum, zeit) {
    const [j, m, t] = datum.split('-').map(Number), [h, mi] = zeit.split(':').map(Number);
    const geraten = Date.UTC(j, m - 1, t, h, mi);
    const teile = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: 'Europe/Zurich', hourCycle: 'h23', year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric' }).formatToParts(new Date(geraten)).map((p) => [p.type, p.value]));
    const versatz = Date.UTC(+teile.year, +teile.month - 1, +teile.day, +teile.hour, +teile.minute) - geraten;
    return new Date(geraten - versatz);
  }
  const ICON = { kalender: '<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>', einstellungen: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 2.9-1.2V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.9H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>' };
  const TABS = [['kalender', 'Termine'], ['einstellungen', 'Online-Buchung']];
  const STATUS = { neu: ['Neu', 'm-offen'], bestaetigt: ['Bestätigt', 'm-blau'], abgesagt: ['Abgesagt', 'm-rot'], erledigt: ['Erledigt', 'm-ok'] };
  const STD_ZEITEN = { 1: [['08:00', '12:00'], ['13:30', '18:00']], 2: [['08:00', '12:00'], ['13:30', '18:00']], 3: [['08:00', '12:00'], ['13:30', '18:00']], 4: [['08:00', '12:00'], ['13:30', '18:00']], 5: [['08:00', '12:00'], ['13:30', '17:00']], 6: [], 7: [] };
  const Z = { tab: 'kalender', ab: heute(), konfig: null, termine: [], bereit: false, alte: false };
  const q = new URLSearchParams(location.search);
  if (TABS.some(([id]) => id === q.get('tab'))) Z.tab = q.get('tab');
  if (!K.produkt) { $('inhalt').innerHTML = '<div class="start"><h2>Termine</h2><p>Die Online-Terminbuchung gibt es in der Verkaufsversion (Ordasio).</p></div>'; return; }
  const sb = window.supabase.createClient(K.url, K.key, { auth: { persistSession: true, autoRefreshToken: true, storageKey: K.speicher } });
  const buchungsLink = () => new URL('../buchen/?b=' + Z.konfig.token, location.href).href;
  const firma = () => (Z.konfig && Z.konfig.firma) || (window.NASUVIA_LIZENZ && (window.NASUVIA_LIZENZ.firma || window.NASUVIA_LIZENZ.name)) || '';

  async function laden() {
    Korb.neuLaden = laden; if (window.UI && UI.teile) UI.teile.anwenden('termine');
    Korb.aufraeumen(sb, [{ tabelle: 'tb_termine' }]);
    try {
      let k = await sb.from('tb_konfig').select('*').maybeSingle();
      if (k.error) throw k.error;
      if (!k.data) {
        const neu = { firma: firma(), zeiten: STD_ZEITEN, dienste: [{ id: 'd' + Date.now().toString(36), name: 'Beratung', dauer: 30, preis: 0 }] };
        k = await sb.from('tb_konfig').insert(neu).select().single();
        if (k.error) throw k.error;
      }
      Z.konfig = k.data;
      const von = zuerich(Z.alte ? plusTage(heute(), -60) : heute(), '00:00').toISOString();
      const t = await sb.from('tb_termine').select('*').is('geloescht_am', null).gte('ende', von).order('beginn').limit(2000);
      if (t.error) throw t.error;
      Z.termine = t.data; Z.bereit = true; zeichnen();
    } catch (e) { $('inhalt').innerHTML = `<div class="card"><h2>Daten konnten nicht geladen werden</h2><p class="hinweis">${esc(fehlerText(e))}</p></div>`; }
  }
  function zeichnen() {
    $('tabs').innerHTML = TABS.map(([id, n]) => `<button class="${Z.tab === id ? 'an' : ''}" data-tab="${id}">${n}</button>`).join('');
    $('untenNav').innerHTML = TABS.map(([id, n]) => `<button class="${Z.tab === id ? 'an' : ''}" data-tab="${id}"><svg viewBox="0 0 24 24">${ICON[id]}</svg>${n}</button>`).join('');
    if (!Z.bereit) return;
    $('inhalt').innerHTML = Z.tab === 'kalender' ? kalender() : einstellungen();
    if (Z.tab === 'einstellungen') qrZeigen();
  }

  function kalender() {
    const k = Z.konfig;
    const kommend = Z.termine.filter((t) => t.status !== 'abgesagt' && new Date(t.ende) >= new Date());
    const neu = Z.termine.filter((t) => t.status === 'neu' && new Date(t.ende) >= new Date());
    const tage = [...new Set(Z.termine.map((t) => tagVon(t.beginn)))];
    return `<div class="kopf"><div><h1>Termine</h1><p class="unter">${k.aktiv ? `Online-Buchung ist <b style="color:var(--gruen)">eingeschaltet</b>.` : 'Online-Buchung ist noch ausgeschaltet.'} ${neu.length ? `${neu.length} neue ${neu.length === 1 ? 'Buchung' : 'Buchungen'} warten auf Bestätigung.` : ''}</p></div>
        <div class="aktionen">${k.aktiv ? '<button class="btn" data-a="linkTeilen">Buchungslink teilen</button>' : '<button class="btn" data-tab="einstellungen">Online-Buchung einrichten</button>'}<button class="btn" data-a="anpassen">Übersicht anpassen</button><button class="btn" data-a="korb">Zuletzt gelöscht</button><button class="btn haupt" data-a="terminNeu">+ Termin</button></div></div>
      <div class="raster r4" data-teil="zahlen">
        <div class="card zahl"><div class="l">Heute</div><div class="w">${kommend.filter((t) => tagVon(t.beginn) === heute()).length}</div><div class="k">Termine</div></div>
        <div class="card zahl"><div class="l">Nächste 7 Tage</div><div class="w">${kommend.filter((t) => tagVon(t.beginn) <= plusTage(heute(), 7)).length}</div><div class="k">Termine</div></div>
        <div class="card zahl"><div class="l">Neu</div><div class="w">${neu.length}</div><div class="k">zu bestätigen</div></div>
        <div class="card zahl"><div class="l">Umsatz geplant</div><div class="w">${chf(kommend.reduce((s, t) => s + t.preis_rappen, 0))}</div><div class="k">CHF, kommende Termine</div></div>
      </div>
      <div class="card abstand">${tage.length ? tage.map((d) => { const l = Z.termine.filter((t) => tagVon(t.beginn) === d);
        return `<div class="tag-titel" ${d === heute() ? 'style="color:var(--elektrik)"' : ''}><span>${WT[new Date(d + 'T12:00').getDay()]} ${dk(d)}${d === heute() ? ' · heute' : ''}</span><span>${l.filter((t) => t.status !== 'abgesagt').length}</span></div>` +
          l.map((t) => `<div class="zeile klick" data-termin="${t.id}" ${t.status === 'abgesagt' ? 'style="opacity:.5"' : ''}><div style="min-width:0"><b>${uhr(t.beginn)}–${uhr(t.ende)} · ${esc(t.name)}<span class="marke-s ${STATUS[t.status][1]}">${STATUS[t.status][0]}</span>${t.quelle === 'online' ? '<span class="marke-s m-grau">online</span>' : ''}</b>
            <small>${esc([t.dienst_name, t.telefon, t.notiz].filter(Boolean).join(' · '))}</small></div><div class="betrag">${t.preis_rappen ? chf(t.preis_rappen) : ''}</div></div>`).join(''); }).join('')
        : '<p class="leer">Keine kommenden Termine.</p>'}</div>
      <button class="btn abstand" data-a="alte" data-teil="alte">${Z.alte ? 'Vergangene ausblenden' : 'Vergangene Termine zeigen'}</button>`;
  }

  function einstellungen() {
    const k = Z.konfig;
    const zeiten = { ...STD_ZEITEN, ...k.zeiten };
    const bereich = (tag, i) => { const b = (zeiten[tag] || [])[i] || ['', '']; return `<span class="bereich"><input type="time" data-zeit="${tag}:${i}:0" value="${b[0]}" aria-label="von"><span>–</span><input type="time" data-zeit="${tag}:${i}:1" value="${b[1]}" aria-label="bis"></span>`; };
    return `<div class="kopf"><div><h1>Online-Buchung</h1><p class="unter">Ihre Kunden buchen selbst einen freien Termin. Sie sehen die Buchung sofort hier.</p></div></div>
      <form id="konfig">
      <div class="card"><label class="schalter"><input type="checkbox" name="aktiv" ${k.aktiv ? 'checked' : ''}> Online-Buchung eingeschaltet</label>
        ${k.aktiv ? `<div class="link-feld abstand"><input type="text" readonly value="${esc(buchungsLink())}" aria-label="Buchungslink"><button type="button" class="btn" data-kopieren="${esc(buchungsLink())}">Kopieren</button><a class="btn" href="${esc(buchungsLink())}" target="_blank" rel="noopener">Ansehen</a></div>
          <p class="hinweis abstand">Diesen Link auf Ihre Website, in Google, Instagram oder WhatsApp stellen.</p>` : '<p class="hinweis abstand">Einschalten, speichern, und Sie bekommen Ihren persönlichen Buchungslink.</p>'}</div>
      ${k.aktiv ? verbreiten() : ''}
      <div class="card abstand"><h2>Angaben für Ihre Kunden</h2>
        <div class="raster r2"><label class="hinweis" style="display:grid;gap:4px">Firmenname<input type="text" name="firma" value="${esc(k.firma)}" maxlength="120"></label><label class="hinweis" style="display:grid;gap:4px">Telefon<input type="text" name="telefon" value="${esc(k.telefon)}" maxlength="40"></label></div>
        <label class="hinweis abstand" style="display:grid;gap:4px">Adresse<input type="text" name="adresse" value="${esc(k.adresse)}" maxlength="200" placeholder="Strasse, PLZ Ort"></label>
        <label class="hinweis abstand" style="display:grid;gap:4px">Kurzer Text (z. B. Parkplatz, Hinweise)<textarea name="text" rows="2" maxlength="600">${esc(k.text)}</textarea></label></div>
      <div class="card abstand"><h2>Leistungen</h2><div id="dienste">${(k.dienste || []).map((d) => dienstZeile(d)).join('')}</div>
        <button type="button" class="btn klein abstand" data-a="dienstNeu">+ Leistung</button></div>
      <div class="card abstand"><h2>Öffnungszeiten</h2><p class="hinweis" style="margin-bottom:6px">Zwei Zeitfenster pro Tag, zum Beispiel Vormittag und Nachmittag. Leer lassen heisst geschlossen.</p>
        ${[1, 2, 3, 4, 5, 6, 7].map((tag) => `<div class="tagzeit"><b>${WT_LANG[tag % 7]}</b>${bereich(tag, 0)}${bereich(tag, 1)}</div>`).join('')}</div>
      <div class="card abstand"><h2>Regeln</h2><div class="raster r4">
        <label class="hinweis" style="display:grid;gap:4px">Termine alle<select name="raster">${[10, 15, 20, 30, 60].map((r) => `<option value="${r}" ${k.raster === r ? 'selected' : ''}>${r} Minuten</option>`).join('')}</select></label>
        <label class="hinweis" style="display:grid;gap:4px">Frühestens in<select name="vorlauf">${[0, 1, 2, 4, 12, 24, 48].map((r) => `<option value="${r}" ${k.vorlauf_std === r ? 'selected' : ''}>${r ? r + ' Stunden' : 'sofort'}</option>`).join('')}</select></label>
        <label class="hinweis" style="display:grid;gap:4px">Bis zu<select name="maxtage">${[7, 14, 30, 60, 90, 180].map((r) => `<option value="${r}" ${k.max_tage === r ? 'selected' : ''}>${r} Tage im Voraus</option>`).join('')}</select></label></div></div>
      <div class="aktionen abstand"><button class="btn haupt">Speichern</button></div>
      </form>`;
  }
  /* ---------- Buchungslink verbreiten: Website, Google, Instagram, Facebook, WhatsApp, QR ---------- */
  let webBaukasten = 'wix';
  const knopfCode = (l) => `<a href="${l}" target="_blank" rel="noopener" style="display:inline-block;background:#0E7A55;color:#ffffff;padding:14px 28px;border-radius:999px;font:600 16px -apple-system,system-ui,sans-serif;text-decoration:none">Termin online buchen</a>`;
  const einbettCode = (l) => `<iframe src="${l}&einbetten=1" title="Termin online buchen" style="width:100%;height:920px;border:0;border-radius:16px" loading="lazy"></iframe>`;
  const codeFeld = (id, inhalt) => `<div class="code"><textarea readonly id="${id}" rows="3" aria-label="Code">${esc(inhalt)}</textarea><button type="button" class="btn klein" data-kopieren-feld="${id}">Kopieren</button></div>`;
  const BAUKASTEN = {
    wix: ['Wix', ['Im Wix-Editor links auf <b>„+ Hinzufügen“</b> tippen.', 'Knopf: <b>„Button“</b> wählen, auf die Seite ziehen, dann <b>„Link“</b> → <b>„Webadresse“</b> und Ihren Buchungslink einfügen. Text: „Termin online buchen“.', 'Eingebettet: <b>„Einbetten“</b> → <b>„HTML einbetten“</b>, dann <b>„Code eingeben“</b> und den Einbettungs-Code unten einfügen. Das Feld gross ziehen.', 'Oben rechts <b>„Veröffentlichen“</b>.']],
    wordpress: ['WordPress', ['Seite bearbeiten und mit <b>„+“</b> einen Block hinzufügen.', 'Knopf: Block <b>„Buttons“</b>, Text eingeben und mit dem Link-Symbol den Buchungslink setzen.', 'Eingebettet: Block <b>„Individuelles HTML“</b> und den Einbettungs-Code einfügen.', '<b>„Aktualisieren“</b> tippen.']],
    jimdo: ['Jimdo', ['Im Bearbeitungsmodus auf <b>„+ Element hinzufügen“</b>.', 'Knopf: <b>„Button“</b>, beim Link „Externe Seite“ den Buchungslink einfügen.', 'Eingebettet: Element <b>„Widget/HTML“</b> und den Einbettungs-Code einfügen.', 'Speichern.']],
    squarespace: ['Squarespace', ['Seite bearbeiten, Abschnitt wählen und <b>„Block hinzufügen“</b>.', 'Knopf: <b>„Button“</b>, als Link den Buchungslink einfügen.', 'Eingebettet: Block <b>„Code“</b> und den Einbettungs-Code einfügen.', '<b>„Speichern“</b>.']],
    andere: ['Andere', ['In jedem Baukasten gibt es einen <b>Knopf</b> oder <b>Button</b> mit einem Feld für eine <b>Webadresse</b>. Dort den Buchungslink einfügen.', 'Wenn Sie eine Webagentur haben: Schicken Sie ihr einfach den Code unten.']],
  };
  function verbreiten() {
    const l = buchungsLink(), f = firma() || 'uns';
    const wa = `Termine bei ${f} können Sie jetzt online buchen: ${l}`;
    const b = BAUKASTEN[webBaukasten];
    const teil = (farbe, sym, titel, unter, inhalt) => `<details><summary><span class="ic" style="background:${farbe}">${sym}</span><span>${titel}<small>${unter}</small></span></summary><div class="inhalt">${inhalt}</div></details>`;
    return `<div class="card abstand verbreiten"><h2>So finden Ihre Kunden Ihre Buchung</h2>
      <p class="hinweis" style="margin-bottom:6px">Stellen Sie Ihren Buchungslink überall hin, wo Ihre Kunden Sie suchen. Alle Buchungen landen hier, egal woher sie kommen.</p>
      ${teil('#0E7A55', '🌐', 'Eigene Website', 'Knopf oder Buchung direkt in der Seite', `
        <div class="unterreiter">${Object.entries(BAUKASTEN).map(([id, [n]]) => `<button type="button" class="${id === webBaukasten ? 'an' : ''}" data-baukasten="${id}">${n}</button>`).join('')}</div>
        <ol>${b[1].map((s) => `<li>${s}</li>`).join('')}</ol>
        <p><b>Ihr Buchungslink</b></p>${codeFeld('cLink', l)}
        <p><b>Knopf</b>, so sieht er aus: <br><a class="vorschau-knopf" href="${esc(l)}" target="_blank" rel="noopener">Termin online buchen</a></p>${codeFeld('cKnopf', knopfCode(l))}
        <p><b>Buchung direkt in der Seite</b> (die Kunden bleiben auf Ihrer Website):</p>${codeFeld('cEinbett', einbettCode(l))}`)}
      ${teil('#4285F4', 'G', 'Google Maps und Google-Suche', 'Knopf „Termin buchen“ in Ihrem Google-Profil', `
        <ol><li>Auf <a href="https://business.google.com" target="_blank" rel="noopener">business.google.com</a> mit dem Google-Konto Ihres Geschäfts anmelden. Oder auf Google nach Ihrem Geschäftsnamen suchen, dann erscheint Ihr Profil zum Bearbeiten.</li>
          <li><b>„Profil bearbeiten“</b> tippen, dann den Bereich <b>„Kontakt“</b> öffnen.</li>
          <li>Beim Feld für <b>Links für Terminvereinbarungen</b> (Terminbuchung) Ihren Buchungslink einfügen und speichern.</li>
          <li>Nach der Prüfung durch Google erscheint bei Ihrem Eintrag in Maps und in der Suche der Knopf <b>„Termin buchen“</b>.</li></ol>
        ${codeFeld('cLinkG', l)}<p class="hinweis">Noch kein Google-Profil? Auf business.google.com kostenlos erstellen. Die Bezeichnungen bei Google können je nach Version leicht abweichen.</p>`)}
      ${teil('linear-gradient(135deg,#F58529,#DD2A7B,#8134AF)', '📷', 'Instagram', 'Link in der Bio und in Storys', `
        <ol><li>Profil öffnen, <b>„Profil bearbeiten“</b> → <b>„Links“</b> → <b>„Externen Link hinzufügen“</b>.</li>
          <li>Buchungslink einfügen, als Titel <b>„Termin buchen“</b>. Speichern.</li>
          <li>In Storys: Sticker <b>„Link“</b> wählen und den Buchungslink einfügen. Als Highlight speichern, dann ist er immer sichtbar.</li></ol>${codeFeld('cLinkI', l)}`)}
      ${teil('#1877F2', 'f', 'Facebook-Seite', 'Knopf „Jetzt buchen“', `
        <ol><li>Ihre Facebook-Seite öffnen und auf <b>„Button hinzufügen“</b> (oder den bestehenden Button → <b>„Bearbeiten“</b>) tippen.</li>
          <li><b>„Jetzt buchen“</b> wählen, dann <b>„Link zu Website“</b> und den Buchungslink einfügen. Speichern.</li></ol>${codeFeld('cLinkF', l)}`)}
      ${teil('#25D366', '💬', 'WhatsApp', 'Profil, Begrüssung und Schnellantwort', `
        <ol><li><b>WhatsApp Business:</b> Einstellungen → <b>Unternehmenstools</b> → <b>Unternehmensprofil</b> → Feld <b>Website</b>: Buchungslink einfügen.</li>
          <li>Unter <b>Begrüssungsnachricht</b> und <b>Abwesenheitsnachricht</b> den Text unten einfügen. Wer Ihnen schreibt, bekommt den Link sofort.</li>
          <li>Unter <b>Schnellantworten</b> eine Antwort mit dem Kürzel <b>/termin</b> anlegen. Im Chat „/termin“ tippen und der Text ist da.</li>
          <li>Auch im normalen WhatsApp: Text als Status posten oder Kunden direkt schicken.</li></ol>
        ${codeFeld('cWa', wa)}<a class="btn klein" href="https://wa.me/?text=${encodeURIComponent(wa)}" target="_blank" rel="noopener">Jetzt in WhatsApp teilen</a>`)}
      ${teil('#0B3B2E', '▦', 'QR-Code, Visitenkarte, E-Mail', 'Aufsteller für die Theke, Signatur', `
        <div class="qr-box"><div class="qr" id="qrVorschau"></div><div><p>Kunden scannen den Code mit der Handy-Kamera und buchen sofort.</p>
          <div class="aktionen" style="margin-top:8px"><button type="button" class="btn klein haupt" data-a="aufsteller">Aufsteller drucken (A5)</button><button type="button" class="btn klein" data-a="qrLaden">QR-Code herunterladen</button></div></div></div>
        <p style="margin-top:12px"><b>E-Mail-Signatur:</b> diesen Satz unter Ihre E-Mails setzen.</p>${codeFeld('cSig', 'Termin online buchen: ' + l)}
        <p class="hinweis">Für Visitenkarte oder Flyer: QR-Code herunterladen und der Druckerei schicken.</p>`)}
    </div>`;
  }
  async function qrSvg(text) { try { return await window.__QRCode.toString(text, { type: 'svg', margin: 1, color: { dark: '#0A1F17', light: '#ffffff' } }); } catch { return ''; } }
  async function qrZeigen() { const e = $('qrVorschau'); if (e && Z.konfig && Z.konfig.aktiv) e.innerHTML = await qrSvg(buchungsLink()); }

  const dienstZeile = (d) => `<div class="dienst" data-dienst="${esc(d.id)}"><input type="text" data-d="name" value="${esc(d.name)}" placeholder="z. B. Haarschnitt" maxlength="120" aria-label="Leistung"><input type="number" data-d="dauer" value="${d.dauer || 30}" min="5" max="600" step="5" aria-label="Dauer in Minuten" title="Minuten"><input type="text" inputmode="decimal" data-d="preis" value="${d.preis ? chf(d.preis) : ''}" placeholder="Preis CHF" aria-label="Preis"><button type="button" class="btn klein rot" data-dienst-weg aria-label="Entfernen">✕</button></div>`;

  /* ---------- Termine bearbeiten ---------- */
  const dlg = $('dlg');
  const dialog = (html) => { dlg.innerHTML = `<form class="dlg" method="dialog">${html}</form>`; dlg.showModal(); return dlg.querySelector('form'); };
  const smsLink = (t, art) => {
    const wann = `${WT_LANG[new Date(tagVon(t.beginn) + 'T12:00').getDay()]}, ${dk(tagVon(t.beginn))} um ${uhr(t.beginn)} Uhr`;
    const text = art === 'ab' ? `Guten Tag ${t.name.split(' ')[0]}, leider müssen wir Ihren Termin am ${wann} absagen. Bitte buchen Sie einen neuen Termin oder rufen Sie uns an. Freundliche Grüsse, ${firma()}`
      : art === 'erinnern' ? `Guten Tag ${t.name.split(' ')[0]}, wir erinnern Sie an Ihren Termin am ${wann}${t.dienst_name ? ' (' + t.dienst_name + ')' : ''}. Bis bald! ${firma()}`
      : `Guten Tag ${t.name.split(' ')[0]}, Ihr Termin am ${wann}${t.dienst_name ? ' (' + t.dienst_name + ')' : ''} ist bestätigt. Freundliche Grüsse, ${firma()}`;
    return `sms:${(t.telefon || '').replace(/\s/g, '')}?&body=${encodeURIComponent(text)}`;
  };
  function terminDialog(t = {}) {
    const k = Z.konfig, d0 = t.beginn ? tagVon(t.beginn) : heute();
    const f = dialog(`<h3>${t.id ? esc(t.name) : 'Neuer Termin'}</h3>
      ${t.id ? `<p class="hinweis">${STATUS[t.status][0]}${t.quelle === 'online' ? ' · online gebucht am ' + dk(tagVon(t.erstellt)) : ''}${t.email ? ' · ' + esc(t.email) : ''}</p>
        ${t.telefon ? `<div class="aktionen">${t.status === 'neu' ? `<a class="btn klein" href="${smsLink(t, 'ok')}" data-status-nach="bestaetigt">Bestätigen per SMS</a>` : ''}<a class="btn klein" href="${smsLink(t, 'erinnern')}">Erinnerung per SMS</a><a class="btn klein" href="tel:${esc(t.telefon.replace(/\s/g, ''))}">Anrufen</a></div>` : ''}` : ''}
      <div class="zwei"><label>Name<input type="text" name="name" value="${esc(t.name || '')}" required maxlength="120"></label><label>Telefon<input type="tel" name="telefon" value="${esc(t.telefon || '')}" maxlength="40"></label></div>
      <label>Leistung<select name="dienst"><option value="">Andere</option>${(k.dienste || []).map((d) => `<option value="${esc(d.id)}" ${d.id === t.dienst_id ? 'selected' : ''}>${esc(d.name)} (${d.dauer} Min.${d.preis ? ', CHF ' + chf(d.preis) : ''})</option>`).join('')}</select></label>
      <div class="drei"><label>Datum<input type="date" name="datum" value="${d0}" required></label><label>Beginn<input type="time" name="von" value="${t.beginn ? uhr(t.beginn) : '09:00'}" required></label><label>Dauer (Min.)<input type="number" name="dauer" min="5" max="600" step="5" value="${t.beginn ? Math.round((new Date(t.ende) - new Date(t.beginn)) / 60000) : ((k.dienste || [])[0] || {}).dauer || 30}"></label></div>
      <label>Notiz<input type="text" name="notiz" value="${esc(t.notiz || '')}" maxlength="500"></label>
      ${t.id ? `<label>Status<select name="status">${Object.entries(STATUS).map(([s, [n]]) => `<option value="${s}" ${s === t.status ? 'selected' : ''}>${n}</option>`).join('')}</select></label>` : ''}
      <div class="fuss">${t.id ? `<span class="aktionen"><button type="button" class="btn rot" data-a="terminLoeschen">Löschen</button>${t.status !== 'abgesagt' && t.telefon ? `<a class="btn rot" href="${smsLink(t, 'ab')}" data-status-nach="abgesagt">Absagen per SMS</a>` : ''}<button type="button" class="btn" data-a="terminRechnung">Rechnung</button></span>` : '<span></span>'}
        <span class="aktionen"><button type="button" class="btn" data-a="zu">Abbrechen</button><button class="btn haupt">Speichern</button></span></div>`);
    f.dataset.formTermin = t.id || '';
    f.querySelector('[name=dienst]').onchange = (e) => { const d = (k.dienste || []).find((x) => x.id === e.target.value); if (d) f.dauer.value = d.dauer; };
    f.onsubmit = async (ev) => {
      ev.preventDefault();
      const d = new FormData(f), dienst = (k.dienste || []).find((x) => x.id === d.get('dienst'));
      const beginn = zuerich(d.get('datum'), d.get('von')), dauer = Math.max(5, Number(d.get('dauer')) || 30);
      const zeile = { name: String(d.get('name')).trim(), telefon: String(d.get('telefon') || '').trim(), notiz: String(d.get('notiz') || '').trim(),
        dienst_id: dienst ? dienst.id : '', dienst_name: dienst ? dienst.name : (t.dienst_name || ''), preis_rappen: dienst ? dienst.preis || 0 : (t.preis_rappen || 0),
        beginn: beginn.toISOString(), ende: new Date(beginn.getTime() + dauer * 60000).toISOString() };
      if (t.id) zeile.status = d.get('status'); else zeile.status = 'bestaetigt';
      const ueber = Z.termine.find((x) => x.id !== t.id && x.status !== 'abgesagt' && new Date(x.beginn) < new Date(zeile.ende) && new Date(x.ende) > beginn);
      if (ueber && !await UI.frage(`Zu dieser Zeit ist schon ${ueber.name} eingetragen. Trotzdem speichern?`)) return;
      const r = t.id ? await Korb.aendern(sb, 'tb_termine', t.id, zeile, 'Termin geändert') : await Korb.neu(sb, 'tb_termine', zeile, 'Termin eingetragen');
      if (r.error) { toast(fehlerText(r.error), 6000); return; }
      dlg.close(); await laden(); toast('Gespeichert');
    };
  }
  async function statusSetzen(id, status) { const { error } = await Korb.aendern(sb, 'tb_termine', id, { status }, 'Status: ' + (STATUS[status] || [status])[0]); if (error) toast(fehlerText(error)); else { await laden(); } }

  async function konfigSpeichern(f) {
    const d = new FormData(f), zeiten = {};
    for (let tag = 1; tag <= 7; tag++) {
      zeiten[tag] = [0, 1].map((i) => [f.querySelector(`[data-zeit="${tag}:${i}:0"]`).value, f.querySelector(`[data-zeit="${tag}:${i}:1"]`).value]).filter(([a, b]) => a && b && a < b);
    }
    const dienste = [...f.querySelectorAll('[data-dienst]')].map((z) => ({ id: z.dataset.dienst, name: z.querySelector('[data-d=name]').value.trim(), dauer: Math.min(600, Math.max(5, Number(z.querySelector('[data-d=dauer]').value) || 30)), preis: betragLesen(z.querySelector('[data-d=preis]').value) })).filter((x) => x.name);
    if (d.get('aktiv') === 'on' && !dienste.length) { toast('Bitte mindestens eine Leistung erfassen'); return; }
    if (d.get('aktiv') === 'on' && !Object.values(zeiten).some((z) => z.length)) { toast('Bitte Öffnungszeiten eintragen'); return; }
    const zeile = { aktiv: d.get('aktiv') === 'on', firma: String(d.get('firma') || '').trim(), telefon: String(d.get('telefon') || '').trim(), adresse: String(d.get('adresse') || '').trim(), text: String(d.get('text') || '').trim(),
      dienste, zeiten, raster: Number(d.get('raster')), vorlauf_std: Number(d.get('vorlauf')), max_tage: Number(d.get('maxtage')) };
    const r = await Korb.aendern(sb, 'tb_konfig', Z.konfig.user_id, zeile, zeile.aktiv ? 'Gespeichert, Buchung ist eingeschaltet' : 'Gespeichert', 'user_id');
    if (r.error) { toast(fehlerText(r.error), 6000); return; }
    Z.konfig = r.data; zeichnen(); toast(zeile.aktiv ? 'Gespeichert. Ihr Buchungslink ist bereit.' : 'Gespeichert');
  }

  document.addEventListener('click', async (ev) => {
    const t = ev.target;
    const tab = t.closest('[data-tab]'); if (tab) { Z.tab = tab.dataset.tab; zeichnen(); window.scrollTo(0, 0); return; }
    const kop = t.closest('[data-kopieren]'); if (kop) { try { await navigator.clipboard.writeText(kop.dataset.kopieren); toast('Link kopiert'); } catch {} return; }
    const sn = t.closest('[data-status-nach]'); if (sn) { const id = dlg.querySelector('form').dataset.formTermin; setTimeout(() => { dlg.close(); statusSetzen(id, sn.dataset.statusNach); }, 300); return; }
    const kf = t.closest('[data-kopieren-feld]'); if (kf) { const f = $(kf.dataset.kopierenFeld); try { await navigator.clipboard.writeText(f.value); toast('Kopiert'); } catch { f.select(); document.execCommand('copy'); toast('Kopiert'); } return; }
    const bk = t.closest('[data-baukasten]'); if (bk) { webBaukasten = bk.dataset.baukasten; const offen = [...document.querySelectorAll('.verbreiten details')].map((d) => d.open); zeichnen(); document.querySelectorAll('.verbreiten details').forEach((d, i) => { d.open = offen[i]; }); return; }
    const dw = t.closest('[data-dienst-weg]'); if (dw) { dw.closest('[data-dienst]').remove(); return; }
    const te = t.closest('[data-termin]'); if (te && !t.closest('dialog')) { terminDialog(Z.termine.find((x) => x.id === te.dataset.termin)); return; }
    const a = t.closest('[data-a]'); if (!a) return;
    const form = a.closest('form');
    switch (a.dataset.a) {
      case 'zu': dlg.close(); break;
      case 'terminNeu': terminDialog(); break;
      case 'anpassen': UI.teile.dialog('termine', [['zahlen', 'Zahlen oben (Heute, 7 Tage, Neu, Umsatz)'], ['alte', 'Knopf „Vergangene Termine zeigen“']]); break;
      case 'korb': Korb.oeffnen(sb, [{ tabelle: 'tb_termine', art: 'Termin', titel: (r) => `${r.name} · ${dk(tagVon(r.beginn))} ${uhr(r.beginn)}` }], laden); break;
      case 'aufsteller': {
        const k = Z.konfig;
        $('aufsteller').innerHTML = `<h1>${esc(firma())}</h1><p>Termin online buchen</p><div class="qr">${await qrSvg(buchungsLink())}</div><p>Kamera aufs Handy, scannen, fertig.</p>${k.telefon ? `<p>Oder anrufen: ${esc(k.telefon)}</p>` : ''}<small>${esc(buchungsLink())}</small>`;
        window.print(); break;
      }
      case 'qrLaden': {
        const url = await window.__QRCode.toDataURL(buchungsLink(), { width: 1200, margin: 2 });
        const l = document.createElement('a'); l.href = url; l.download = 'QR-Code Termin buchen.png'; l.click(); break;
      }
      case 'alte': Z.alte = !Z.alte; laden(); break;
      case 'dienstNeu': $('dienste').insertAdjacentHTML('beforeend', dienstZeile({ id: 'd' + Date.now().toString(36), name: '', dauer: 30, preis: 0 })); $('dienste').lastElementChild.querySelector('input').focus(); break;
      case 'linkTeilen': {
        const link = buchungsLink();
        if (navigator.share) { try { await navigator.share({ title: 'Termin buchen', url: link }); } catch {} } else { try { await navigator.clipboard.writeText(link); toast('Link kopiert'); } catch { await UI.eingabe('Ihr Buchungslink', link); } }
        break;
      }
      case 'terminLoeschen': {
        const t0 = Z.termine.find((x) => x.id === form.dataset.formTermin) || {};
        if (!await Korb.loeschen(sb, 'tb_termine', form.dataset.formTermin, `Termin ${t0.name || ''}`)) break;
        dlg.close(); await laden(); toast('Gelöscht'); break;
      }
      case 'terminRechnung': {
        const x = Z.termine.find((y) => y.id === form.dataset.formTermin);
        try { sessionStorage.setItem('ordasio.zeit.rechnung', JSON.stringify({ positionen: [{ text: `${x.dienst_name || 'Leistung'} am ${dk(tagVon(x.beginn))} (${x.name})`, menge: '1', preis: x.preis_rappen ? (x.preis_rappen / 100).toFixed(2) : '' }], projekt: '', quelle: 'Termine' })); } catch {}
        if (x.status !== 'erledigt' && x.status !== 'abgesagt') await sb.from('tb_termine').update({ status: 'erledigt' }).eq('id', x.id);
        location.href = '../rechnungen/'; break;
      }
    }
  });
  document.addEventListener('submit', (ev) => { if (ev.target.id === 'konfig') { ev.preventDefault(); konfigSpeichern(ev.target); } });
  zeichnen();
  (async function warten(n = 0) { const { data: { session } } = await sb.auth.getSession(); if (session) laden(); else if (n < 600) setTimeout(() => warten(n + 1), 500); })();
})();
</script>
</body>
</html>
